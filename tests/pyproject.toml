[project]
name = "nohiki-integration-tests"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Cross-service integration and E2E tests for nohiki monorepo"
requires-python = ">=3.14"
dependencies = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
    "httpx>=0.28.1",
    "requests>=2.32.5",
    "PyJWT>=2.10.1",
    "structlog>=25.5.0",
    "health-check==0.1.0",
    "nohiki-test-utils==0.1.0",
    "nohiki-db-utils[async]==0.1.0",
    "nohiki-kafka-client==0.1.0",
    "nohiki-domain-models==0.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["integration", "api"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# short default timeout per test - use @pytest.mark.timeout(N) for longer tests
timeout = 15
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (requires containers)",
    "requires_docker: Tests that require Docker/testcontainers to be running",
    "e2e: End-to-end tests (requires full deployment)",
    "slow: Slow tests (excluded from quick runs)",
]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-ra",
]
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers.*",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",        # pydocstyle - not needed for tests
    "ANN",      # flake8-annotations - tests don't need full annotations
    "S101",     # assert - tests use assert
    "PLR2004",  # magic values - acceptable in tests
    "PLR0913",  # too many arguments - test helpers often need many params
    "FBT",      # boolean arguments - CLI tools use these legitimately
    "BLE001",   # blind exception - acceptable in test cleanup/setup
    "S603",     # subprocess - test runners need subprocess
    "S607",     # partial path - test scripts use docker compose
    "TC003",    # type-checking imports - not needed for tests
    "PLC0415",  # import not at top - sometimes needed in tests
    "COM812",   # missing trailing comma - conflicts with the formatter (matches root config)
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S105", "S106"]  # hardcoded passwords acceptable in tests
"conftest.py" = ["S105", "S106"]  # hardcoded passwords acceptable in test fixtures
"run_tests.py" = ["S105", "S106"]  # hardcoded passwords acceptable in test runners

[tool.coverage.run]
source = ["integration", "api"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
