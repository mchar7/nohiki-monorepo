[project]
name = "nohiki-ml-core"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Shared ML encoding logic for Nohiki (ColBERT, MUVERA, Sparse)"
requires-python = ">=3.14"
# Base dependencies - lightweight: GPU detection, dependency checking, encoder protocols.
# No numpy, no ML inference libs. Heavy inference stack requires the [inference] extra.
dependencies = [
    "nohiki-domain-models==0.1.0",
    "nohiki-observability==0.1.0",
    "nohiki-common-exceptions==0.1.0",
    "nohiki-ml-manifest==0.1.0",
]

[project.optional-dependencies]
# Full inference stack - heavy deps (~2GB+) for in-process model loading.
# Required by: ml-compute-service (inference_backend="direct" in manifest)
inference = [
    "numpy>=2.5.1",
    "pylate>=1.6.0,<1.7",
    "fastembed>=0.7.4",
    "sentence-transformers==5.3.0",
    "scikit-learn>=1.5.0",  # PLAIDIndex.compute_cluster_threshold() - cluster health at build time
    "httpx>=0.28.0",
    "onnxruntime>=1.24.0; python_version >= \"3.13\"",
    "onnxruntime>=1.17.0; python_version < \"3.13\"",
]
# Model caching via S3 + Redis
cache = [
    "nohiki-s3-client==0.1.0",
    "nohiki-redis-utils==0.1.0",
]
# GPU support - requires NVIDIA hardware (~3GB+ deps)
gpu = [
    "triton>=3.0.0; sys_platform == 'linux'",
]
test = [
    "nohiki-ml-core[inference,cache]",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "nohiki-test-utils==0.1.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

# deptry exceptions for this package, name-scoped so every other dependency stays enforced.
# DEP002: runtime-selected adapters or deployment extras, installed but not imported here.
# DEP003: modules deliberately consumed through a declared workspace facade dependency.
[tool.deptry.per_rule_ignores]
DEP002 = [
    "fastembed",
    "nohiki-common-exceptions",
    "nohiki-redis-utils",
    "nohiki-s3-client",
    "onnxruntime",
    "pylate",
    "triton",
]
DEP003 = ["opentelemetry"]
