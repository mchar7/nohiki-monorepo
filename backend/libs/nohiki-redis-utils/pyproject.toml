[project]
name = "nohiki-redis-utils"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Redis cache utilities for the Nohiki platform"
requires-python = ">=3.14"
dependencies = [
    "nohiki-core-settings==0.1.0",
    "nohiki-observability==0.1.0",
    "pydantic>=2.12.0",
    "redis[hiredis]>=7.0.0",
]

[project.optional-dependencies]
otel = [
    "nohiki-observability[redis]==0.1.0",
]
testing = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "testcontainers>=4.14.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

# deptry exceptions for this package, name-scoped so every other dependency stays enforced.
# DEP003: modules deliberately consumed through a declared workspace facade dependency.
# DEP004: modules imported by test helpers that this package ships from src/.
[tool.deptry.per_rule_ignores]
DEP003 = ["nohiki_common_exceptions", "nohiki_test_utils", "opentelemetry"]
DEP004 = ["pytest", "testcontainers"]
