[project]
name = "nohiki-geo-utils"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Redis-cached geocoding utilities for Nohiki services"
requires-python = ">=3.14"
dependencies = [
    "geopy>=2.4.0",
    "aiohttp>=3.13.0",
    "nohiki-domain-models==0.1.0",
]

[project.optional-dependencies]
redis = [
    "nohiki-redis-utils==0.1.0",
]
test = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
