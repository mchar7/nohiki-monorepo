[project]
name = "nohiki-test-utils"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Cross-cutting testing utilities for the Nohiki platform"
requires-python = ">=3.14"
dependencies = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "faker>=38.2.0",
    "polyfactory>=3.2.0,<4",
    "pyjwt>=2.10.1",
    "fastapi>=0.120.4",
    "nohiki-domain-models",
]

[project.entry-points.pytest11]
nohiki_test_utils = "nohiki_test_utils.plugins"

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
