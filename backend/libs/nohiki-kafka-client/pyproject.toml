[project]
name = "nohiki-kafka-client"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Kafka client utilities for Nohiki services"
requires-python = ">=3.14"
dependencies = [
    "aiokafka[snappy,lz4,zstd]>=0.13.0",
    "betterproto2>=0.10.0",
    "nohiki-core-settings==0.1.0",
    "nohiki-observability==0.1.0",
    "pydantic>=2.12.5",
    "uuid-utils>=0.14.0",
    "nohiki-common-exceptions==0.1.0",
]

[project.optional-dependencies]
otel = [
    "nohiki-observability[kafka]==0.1.0",
]
db = [
    "nohiki-db-utils==0.1.0",
]
ratelimit = [
    "nohiki-redis-utils==0.1.0",
]
testing = [
    "pytest>=9.0.0",
    "testcontainers>=4.14.0",
    "nohiki-test-utils==0.1.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
