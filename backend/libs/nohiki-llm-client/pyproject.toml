[project]
name = "nohiki-llm-client"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Shared LLM client with PydanticAI for Nohiki services"
requires-python = ">=3.14"
dependencies = [
    "certifi>=2026.6.17",
    "nohiki-core-settings==0.1.0",
    "nohiki-observability==0.1.0",
    "pydantic>=2.12.0",
    "openinference-instrumentation-pydantic-ai>=0.1.10",
    "openinference-semantic-conventions>=0.1.25",
    "opentelemetry-exporter-otlp-proto-grpc>=1.39.0",
    "opentelemetry-sdk>=1.39.0",
    "genai-prices>=0.0.54",
    "pydantic-ai-slim[openrouter,openai,google,anthropic,retries]>=2.24.0,<3",
    "anthropic[vertex]>=0.49.0",
    "pydantic-evals>=2.24.0,<3",
    "tenacity>=9.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "respx>=0.22.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    "error",
    # google-genai 1.75.0 triggers this inside its Python 3.14 typing compatibility code (googleapis/python-genai#1939).
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning:google.genai",
]
markers = [
    "integration: marks tests requiring live external services (deselect with '-m not integration')",
]

# deptry exceptions for this package, name-scoped so every other dependency stays enforced.
# DEP002: runtime-selected adapters or deployment extras, installed but not imported here.
# DEP003: modules deliberately consumed through a declared workspace facade dependency.
[tool.deptry.per_rule_ignores]
DEP002 = ["nohiki-core-settings"]
DEP003 = ["google", "httpx", "nohiki_common_exceptions", "openai"]
