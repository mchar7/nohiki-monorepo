[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
[project]
name = "nohiki-embedding-client"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Unified embedding client for Nohiki services"
requires-python = ">=3.14"
dependencies = [
    "nohiki-kafka-client==0.1.0",
    "nohiki-domain-models==0.1.0",
    "nohiki-common-exceptions==0.1.0",
    "nohiki-observability==0.1.0",
    "uuid-utils>=0.10.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.0.0",
]
