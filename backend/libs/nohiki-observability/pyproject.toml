[project]
name = "nohiki-observability"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Standardized observability tools for the Nohiki platform"
requires-python = ">=3.14"
dependencies = [
    # Core logging and tracing - always needed
    "structlog>=25.5.0",
    "opentelemetry-api>=1.39.0",
    "opentelemetry-sdk>=1.39.0",
    "opentelemetry-instrumentation-logging>=0.60b0",
    "opentelemetry-propagator-b3>=1.39.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.39.0",
    "prometheus-client>=0.24.0",
    "uuid-utils>=0.14.0",
    "nohiki-common-exceptions",
    "starlette>=1.3.0",
]

[project.optional-dependencies]
# Instrumentation packages - only install what you need
fastapi = [
    "opentelemetry-instrumentation-fastapi>=0.60b0",
    "fastapi>=0.129.0",
]
httpx = [
    "opentelemetry-instrumentation-httpx>=0.60b0",
    "httpx>=0.28.0",
]
grpc = [
    "opentelemetry-instrumentation-grpc>=0.60b0",
]
redis = [
    "opentelemetry-instrumentation-redis>=0.60b0",
]
sqlalchemy = [
    "opentelemetry-instrumentation-sqlalchemy>=0.60b0",
]
requests = [
    "opentelemetry-instrumentation-requests>=0.60b0",
    "requests>=2.32.5",
]
kafka = [
    "opentelemetry-instrumentation-confluent-kafka>=0.60b0",
]
system = [
    "opentelemetry-instrumentation-system-metrics>=0.60b0",
]
phoenix = [
    "arize-phoenix-otel>=0.14.0",
    "openinference-instrumentation-openai>=0.1.0",
]
# Convenience extras for common combinations
http = [
    "nohiki-observability[fastapi,httpx,requests]",
]
database = [
    "nohiki-observability[sqlalchemy,redis]",
]
full = [
    "nohiki-observability[fastapi,httpx,grpc,redis,sqlalchemy,requests,kafka,phoenix,system]",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

# deptry exceptions for this package, name-scoped so every other dependency stays enforced.
# DEP002: runtime-selected adapters or deployment extras, installed but not imported here.
# DEP003: modules deliberately consumed through a declared workspace facade dependency.
[tool.deptry.per_rule_ignores]
DEP002 = [
    "arize-phoenix-otel",
    "httpx",
    "nohiki-observability",
    "openinference-instrumentation-openai",
    "opentelemetry-instrumentation-confluent-kafka",
    "opentelemetry-instrumentation-grpc",
    "opentelemetry-instrumentation-redis",
    "opentelemetry-instrumentation-requests",
    "opentelemetry-instrumentation-system-metrics",
    "requests",
]
DEP003 = ["google"]
