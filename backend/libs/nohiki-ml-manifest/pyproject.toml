[project]
name = "nohiki-ml-manifest"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Semantic representation manifest schema, caching, and validation for Nohiki ML pipelines"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.11.0",
    "nohiki-domain-models==0.1.0",
    "nohiki-common-exceptions==0.1.0",
    "nohiki-core-settings==0.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "nohiki-test-utils==0.1.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
