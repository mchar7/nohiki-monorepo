[project]
name = "nohiki-s3-client"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Async S3-compatible object storage client for Nohiki services"
requires-python = ">=3.14"
dependencies = [
    "aiobotocore>=3.0.0",
    "nohiki-core-settings==0.1.0",
    "azure-storage-blob==12.30.0",
    "azure-identity>=1.25.3",
    "pydantic>=2.12.0",
    "types-aiobotocore[s3]>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "moto[s3]>=5.1.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
