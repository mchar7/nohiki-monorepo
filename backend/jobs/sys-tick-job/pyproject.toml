[project]
name = "sys-tick-job"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "One-shot system tick publisher jobs for Nohiki"
requires-python = ">=3.14"
dependencies = [
    "nohiki-kafka-client==0.1.0",
    "nohiki-domain-models==0.1.0",
    "nohiki-observability==0.1.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

# deptry exceptions for this package, name-scoped so every other dependency stays enforced.
# DEP002: runtime-selected adapters or deployment extras, installed but not imported here.
[tool.deptry.per_rule_ignores]
DEP002 = ["nohiki-observability"]
