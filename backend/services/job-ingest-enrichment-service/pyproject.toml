[project]
name = "job-ingest-enrichment-service"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Processes raw job listings using LLM and publishes structured results"
requires-python = ">=3.14"
dependencies = [
    "nohiki-core-settings==0.1.0",
    "nohiki-embedding-client==0.1.0",
    "nohiki-fastapi-utils[server]==0.1.0",
    "nohiki-observability[fastapi]==0.1.0",
    "nohiki-domain-models==0.1.0",
    "nohiki-finance==0.1.0",
    "nohiki-kafka-client[ratelimit]==0.1.0",
    "nohiki-llm-client==0.1.0",
    "nohiki-db-utils[full]==0.1.0",
    "nohiki-redis-utils==0.1.0",
    "nohiki-geo-utils==0.1.0",
    "nohiki-ml-core==0.1.0",
    "nohiki-ml-manifest==0.1.0",
    "uuid-utils>=0.14.0",
    "alembic>=1.16.0",
]

[project.optional-dependencies]
test = [
    "nohiki-test-utils==0.1.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
