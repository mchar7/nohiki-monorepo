[project]
name = "user-pref-service"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Job target profile management for Nohiki platform"
requires-python = ">=3.14"
dependencies = [
    "nohiki-core-settings==0.1.0",
    "nohiki-fastapi-utils[server]==0.1.0",
    "nohiki-db-utils[full]==0.1.0",
    "nohiki-kafka-client==0.1.0",
    "nohiki-domain-models==0.1.0",
    "nohiki-observability[fastapi]==0.1.0",
    "nohiki-redis-utils==0.1.0",
    "nohiki-geo-utils[redis]==0.1.0",
    "nohiki-embedding-client==0.1.0",
    "nohiki-ml-core==0.1.0",
    "nohiki-ml-manifest==0.1.0",
    "nohiki-qdrant-client==0.1.0",
    "uuid-utils>=0.14.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "nohiki-test-utils==0.1.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
