[project]
name = "job-ingest-discovery-service"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Microservice for scraping job postings using JobSpy."
requires-python = ">=3.14"
dependencies = [
    "nohiki-common-exceptions==0.1.0",
    "nohiki-core-settings==0.1.0",
    "nohiki-db-utils[full]==0.1.0",
    "nohiki-domain-models==0.1.0",
    "nohiki-observability[fastapi]==0.1.0",
    "nohiki-redis-utils==0.1.0",
    "nohiki-fastapi-utils[server]==0.1.0",
    "nohiki-kafka-client==0.1.0",
    "httpx>=0.28.1",
    "python-jobspy>=1.1.82",
    "pandas>=2.3.3,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "nohiki-test-utils==0.1.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --tb=short"
markers = [
    "integration: mark integration tests",
    "requires_docker: mark tests that require Docker/testcontainers",
    "unit: mark unit tests (default)",
]
filterwarnings = ["error"]
