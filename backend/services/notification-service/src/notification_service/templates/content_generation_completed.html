<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Your Generated Document is Ready</title>
</head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
    <h1 style="color: #059669;">Your Generated Document is Ready!</h1>
    <p>Your document has been generated for:</p>
    <div style="background: #f3f4f6; padding: 20px; border-radius: 8px; margin: 20px 0;">
        <h2 style="margin-top: 0;">{{ listing_title }}</h2>
        {% if company_name %}<p><strong>Company:</strong> {{ company_name }}</p>{% endif %}
    </div>
    <p>Log in to your account to view and download your generated document.</p>
    <p style="color: #6b7280; font-size: 14px;">
        You received this email because you requested document generation.
    </p>
</body>
</html>
