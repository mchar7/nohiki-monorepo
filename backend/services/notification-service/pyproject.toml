[project]
name = "notification-service"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Microservice for sending messages via email and other channels"
requires-python = ">=3.14"
dependencies = [
    "nohiki-common-exceptions==0.1.0",
    "nohiki-core-settings==0.1.0",
    "nohiki-domain-models==0.1.0",
    "nohiki-observability[fastapi]==0.1.0",
    "nohiki-db-utils[full]==0.1.0",
    "nohiki-fastapi-utils[server]==0.1.0",
    "nohiki-kafka-client==0.1.0",
    "nohiki-redis-utils==0.1.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-asyncio>=1.3.0",
    "testcontainers>=4.14.0",
    "httpx>=0.28.1",
    "asyncpg>=0.31.0",
    "psycopg[binary]==3.3.4",
    "freezegun>=1.5.5",
    "nohiki-test-utils==0.1.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

# deptry exceptions for this package, name-scoped so every other dependency stays enforced.
# DEP002: runtime-selected adapters or deployment extras, installed but not imported here.
# DEP003: modules deliberately consumed through a declared workspace facade dependency.
[tool.deptry.per_rule_ignores]
DEP002 = ["nohiki-common-exceptions"]
DEP003 = ["fastapi", "opentelemetry", "pydantic", "pydantic_settings", "sqlalchemy", "uvicorn"]
