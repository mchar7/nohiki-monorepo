[project]
name = "user-upload-service"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Document storage with S3/MinIO backend for Nohiki platform."
requires-python = ">=3.14"
dependencies = [
    "nohiki-core-settings==0.1.0",
    "nohiki-fastapi-utils[server,otel]==0.1.0",
    "nohiki-db-utils[full]==0.1.0",
    "nohiki-kafka-client==0.1.0",
    "nohiki-domain-models==0.1.0",
    "nohiki-observability[fastapi]==0.1.0",
    "nohiki-s3-client==0.1.0",
    "pydantic[email]>=2.12.5",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "nohiki-test-utils==0.1.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

# deptry exceptions for this package, name-scoped so every other dependency stays enforced.
# DEP003: modules deliberately consumed through a declared workspace facade dependency.
[tool.deptry.per_rule_ignores]
DEP003 = ["fastapi", "pydantic_settings", "sqlalchemy", "uvicorn"]
