[project]
name = "bff-service"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Backend-for-Frontend service - unified browser API with CQRS projections"
requires-python = ">=3.14"
dependencies = [
    "nohiki-core-settings==0.1.0",
    "nohiki-fastapi-utils[server,otel,jwt]==0.1.0",
    "nohiki-db-utils[full]==0.1.0",
    "nohiki-kafka-client==0.1.0",
    "nohiki-domain-models==0.1.0",
    "nohiki-observability[fastapi]==0.1.0",
    "nohiki-s3-client==0.1.0",
    "nohiki-redis-utils==0.1.0",
    "jsonschema>=4.25.1",
    "uuid-utils>=0.14.0",
    "sse-starlette>=2.0.0",
    "redis[hiredis]>=5.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "nohiki-test-utils==0.1.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
