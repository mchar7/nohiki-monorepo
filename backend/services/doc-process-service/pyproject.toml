[project]
name = "doc-process-service"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Document processing service with Docling Serve integration"
requires-python = ">=3.14"
dependencies = [
    "nohiki-common-exceptions==0.1.0",
    "nohiki-core-settings==0.1.0",
    "nohiki-domain-models==0.1.0",
    "nohiki-fastapi-utils[server]==0.1.0",
    "nohiki-kafka-client==0.1.0",
    "nohiki-observability[fastapi]==0.1.0",
    "nohiki-redis-utils==0.1.0",
    "nohiki-s3-client==0.1.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
test = [
    "nohiki-test-utils==0.1.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
