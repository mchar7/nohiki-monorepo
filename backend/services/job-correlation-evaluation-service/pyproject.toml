[project]
name = "job-correlation-evaluation-service"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Service for matching jobs to user preferences with filtering, scoring, and matching logic"
requires-python = ">=3.14"
dependencies = [
    "nohiki-core-settings==0.1.0",
    "nohiki-common-exceptions==0.1.0",
    "nohiki-domain-models==0.1.0",
    "nohiki-db-utils[full]==0.1.0",
    "nohiki-embedding-client==0.1.0",
    "nohiki-geo-utils==0.1.0",
    "nohiki-kafka-client==0.1.0",
    "nohiki-llm-client==0.1.0",
    "nohiki-qdrant-client==0.1.0",
    "nohiki-s3-client==0.1.0",
    "nohiki-observability[fastapi]==0.1.0",
    "nohiki-fastapi-utils[server,otel]==0.1.0",
    "nohiki-redis-utils==0.1.0",
    "nohiki-ml-core==0.1.0",
    "nohiki-ml-manifest==0.1.0",
    "joblib>=1.5.3,<2",
    "numpy>=2.5.1",
    "uuid-utils>=0.14.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "nohiki-test-utils==0.1.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: marks tests as integration tests (requires Docker/testcontainers)",
]
filterwarnings = [
    # grpcio async interceptor cleanup bug - library issue we cannot fix
    # https://github.com/grpc/grpc/issues/35020
    "ignore:Exception ignored in.*InterceptedCall.__del__:pytest.PytestUnraisableExceptionWarning",
    "ignore:coroutine 'InterceptedUnaryUnaryCall._invoke' was never awaited:RuntimeWarning",
    # testcontainers library deprecation - not our code, will be fixed in future testcontainers release
    "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning",
]
