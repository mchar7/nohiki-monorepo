[project]
name = "job-embedding-finetuning"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Fine-tune embedding models for job matching"
requires-python = ">=3.14"
dependencies = [
    "sentence-transformers>=5.3.0,<5.4",
    "datasets>=3.0.0",
    "torch>=2.0.0",
    "transformers>=5.3.0,<5.4",
    "accelerate>=0.30.0",
    "safetensors>=0.4.0",
    "typer>=0.26.8",
    "rich>=13.0.0",
    "pandas>=2.3.3,<3",
    "pyarrow>=15.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
finetune = "job_embedding_finetuning.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["job_embedding_finetuning"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::pytest.PytestConfigWarning"]

[tool.uv]
override-dependencies = ["multiprocess>=0.70.19"]
