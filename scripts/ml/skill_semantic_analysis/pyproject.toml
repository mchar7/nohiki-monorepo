[project]
name = "skill-semantic-analysis"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Semantic similarity threshold analysis for skill matching using JobBERT"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.1",
    "sentence-transformers>=5.3.0,<5.4",
    "rich>=13.0",
    "typer>=0.26.8",
]

[project.scripts]
skill-semantic = "skill_semantic_analysis.cli:app"

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
