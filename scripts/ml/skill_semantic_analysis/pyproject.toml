[project]
name = "skill-semantic-analysis"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Semantic similarity threshold analysis for skill matching using JobBERT"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.1",
    "sentence-transformers>=5.6.0",
    "rich>=13.0",
    "typer>=0.26.8",
]

[project.scripts]
skill-semantic = "skill_semantic_analysis.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["skill_semantic_analysis", "skill_semantic_analysis.analysis"]
package-dir = {"skill_semantic_analysis" = "."}
