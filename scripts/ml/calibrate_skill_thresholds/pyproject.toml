[project]
name = "calibrate-skill-thresholds"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Empirically calibrate skill normalization thresholds using real taxonomy data"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.1",
    "rich>=14.0",
    "typer>=0.26.8",
]

[project.scripts]
calibrate-skill-thresholds = "calibrate_skill_thresholds.cli:app"

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
