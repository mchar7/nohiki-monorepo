[project]
name = "ast-explorer"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Tree-sitter based AST explorer for codebase navigation and AI context generation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "tree-sitter>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "typer>=0.21.0",
    "rich>=14.0.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
ast-explorer = "ast_explorer.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
