[project]
name = "health-check"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Health check CLI for Nohiki microservice deployments"
requires-python = ">=3.14"
dependencies = [
    "aiokafka[snappy,lz4,zstd]>=0.13.0",
    "typer>=0.21.0",
    "rich>=14.3.0",
    "httpx>=0.28.0",
    "psycopg[binary]>=3.2.0",
    "redis>=6.0.0",
    "nohiki-kafka-client==0.1.0",
    "nohiki-ml-manifest==0.1.0",
    "nohiki-test-utils==0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.0",
    "pytest-cov>=7.0.0",
]

[project.scripts]
health-check = "health_check.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
nohiki-kafka-client = { workspace = true }
nohiki-ml-manifest = { workspace = true }
nohiki-test-utils = { workspace = true }

[tool.ty.environment]
root = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["health_check"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "^\\ *\\.\\.\\.$",
    "if TYPE_CHECKING:",
]
