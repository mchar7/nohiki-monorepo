# Blocks internal tooling references from commit messages and patch text.
# Rules are intentionally precise so product names and public APIs remain valid.

[[rules]]
id = "workflow-term"
description = "Internal agent workflow vocabulary"
scope = "both"
regex = [
  "\\bsubagents?\\b",
  "\\bopenspec\\b",
  "\\bprompt_reviewer\\b",
  "\\bawesome-claude-skills\\b",
]
allow = []

[[rules]]
id = "workflow-process"
description = "Orchestrator-as-process wording in commit messages"
scope = "message"
regex = ["(?<![A-Za-z0-9_])orchestrator(?![A-Za-z0-9_])"]
allow = []

[[rules]]
id = "internal-path"
description = "Internal planning and workstation paths"
scope = "both"
regex = [
  "(?<![A-Za-z0-9_])\\.planning(?:[/\\\\]|\\b)",
  "(?<![A-Za-z0-9_])\\.local/planning(?:[/\\\\]|\\b)",
  # Character classes keep personal-path literals out of this scanner config.
  "(?<![A-Za-z0-9_])\\x2fhome\\x2fmatt(?:[/\\\\]|\\b)",
  "(?<![A-Za-z0-9_])/pers[i]st/home(?:[/\\\\]|\\b)",
]
allow = []

[[rules]]
id = "session-artifact"
description = "Internal session and planning artifacts"
scope = "both"
regex = [
  "\\bNEXT-SESSION(?:\\.md)?\\b",
  "\\bDELEGATION\\.md\\b",
  "\\bDOSSIER\\b",
  "\\bDECISION-LOG\\b",
]
allow = []

[[rules]]
id = "planning-language"
description = "Internal planning terminology"
scope = "both"
regex = [
  "\\bhunk ledger\\b",
  "\\bcommit stack plan\\b",
  "\\bwave boundary\\b",
  "\\bcarrier train\\b",
  "\\bagent hardening\\b",
  "\\bAI planning\\b",
]
allow = []

[[rules]]
id = "decision-identifier"
description = "Internal decision identifiers"
scope = "both"
regex = ["\\bD-1[01][0-9]\\b"]
allow = []
