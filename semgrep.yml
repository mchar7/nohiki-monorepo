# Nohiki Architecture Rules
# Only rules NOT covered by ruff, ty, or other established tools
# Note: Protobuf _pb2 rules disabled - no legacy imports exist in codebase

rules:

  # NOHIKI-SPECIFIC: Kafka DB session middleware wiring
  - id: kafka-with-db-session-requires-session-factory
    patterns:
      - pattern-inside: |
          async def $FUNC(...):
              ...
      - pattern: start_event_consumer()
      - pattern-not-inside: |
          async def $FUNC(...):
              ...
              kafka_client.set_db_session_factory(...)
              ...
              start_event_consumer()
              ...
    message: "Services that start Kafka consumers and use @kafka_client.with_db_session handlers must call kafka_client.set_db_session_factory(...) before start_event_consumer()."
    languages: [python]
    severity: ERROR
    paths:
      include:
        - '**/backend/services/**/src/**/main.py'
      exclude:
        - '**/backend/services/ml-compute-service/**'
        - '**/backend/services/ml-gateway-service/**'
        - '**/backend/services/job-ingest-discovery-service/**'
        - '**/backend/services/doc-content-service/**'
        - '**/backend/services/doc-process-service/**'

  # TEST CORRECTNESS: stale import and attribute patch targets must fail instead of passing vacuously.
  - id: no-patching-builtins-import
    pattern-either:
      - pattern: patch("builtins.__import__", ...)
      - pattern: $M.patch("builtins.__import__", ...)
    message: "Patch the import function used by production (for example, module.importlib.import_module), not builtins.__import__."
    languages: [python]
    severity: ERROR

  - id: no-mock-patch-create
    pattern-either:
      - pattern: patch(..., create=True, ...)
      - pattern: patch.object(..., create=True, ...)
      - pattern: $M.patch(..., create=True, ...)
      - pattern: $M.patch.object(..., create=True, ...)
    message: "Do not pass create=True to mock.patch; a missing patch target must fail the test."
    languages: [python]
    severity: ERROR

  - id: no-monkeypatch-setattr-raising-false
    pattern: $MONKEYPATCH.setattr(..., raising=False)
    message: "Do not pass raising=False to monkeypatch.setattr; a missing patch target must fail the test."
    languages: [python]
    severity: ERROR
