name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # edited: title changes must re-lint because the PR title becomes the merge commit subject
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'edited' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Router
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      commit_class: ${{ steps.gate.outputs.commit_class }}
      standard: ${{ steps.gate.outputs.standard }}
      broad: ${{ steps.gate.outputs.broad }}
      worker_units: ${{ steps.gate.outputs.worker_units }}
      broad_unbounded: ${{ steps.gate.outputs.broad_unbounded }}
      worker_timeout_minutes: ${{ steps.guards.outputs.worker_timeout_minutes }}
      protected_main_smoke: ${{ steps.gate.outputs.protected_main_smoke }}
      full: ${{ steps.gate.outputs.full }}
      nix: ${{ steps.gate.outputs.nix }}
      lint_python: ${{ steps.gate.outputs.lint_python }}
      lint_frontend: ${{ steps.gate.outputs.lint_frontend }}
      lint_steiger: ${{ steps.gate.outputs.lint_steiger }}
      lint_proto: ${{ steps.gate.outputs.lint_proto }}
      lint_markdown: ${{ steps.gate.outputs.lint_markdown }}
      lint_workflows: ${{ steps.gate.outputs.lint_workflows }}
      lint_docker: ${{ steps.gate.outputs.lint_docker }}
      typecheck_backend: ${{ steps.gate.outputs.typecheck_backend }}
      typecheck_frontend: ${{ steps.gate.outputs.typecheck_frontend }}
      python_any: ${{ steps.gate.outputs.python_any }}
      frontend_tests: ${{ steps.gate.outputs.frontend_tests }}
      frontend_smoke: ${{ steps.gate.outputs.frontend_smoke }}
      frontend_e2e: ${{ steps.gate.outputs.frontend_e2e }}
      node_workspace_contracts: ${{ steps.gate.outputs.node_workspace_contracts }}
      edge_worker: ${{ steps.gate.outputs.edge_worker }}
      otel_collector: ${{ steps.gate.outputs.otel_collector }}
      hygiene: ${{ steps.gate.outputs.hygiene }}
      api_schema_freshness: ${{ steps.gate.outputs.api_schema_freshness }}
      image_matrix_parity: ${{ steps.gate.outputs.image_matrix_parity }}
      proto_breaking: ${{ steps.gate.outputs.proto_breaking }}
      build_backend: ${{ steps.gate.outputs.build_backend }}
      affected_packages: ${{ steps.gate.outputs.affected_packages }}
      test_packages: ${{ steps.gate.outputs.test_packages }}
      commitlint_expected: ${{ steps.gate.outputs.commitlint_expected }}
      title_only: ${{ steps.reuse.outputs.title_only }}
      reused_run_id: ${{ steps.reuse.outputs.reused_run_id }}

    steps:
      - name: Start router timing
        id: timing
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Open router summary
        env:
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          {
            echo "## Router"
            echo
            echo "Classifies the tested diff into lane flags and a commit class. Runs no checks itself."
            echo
            echo "| Context | Value |"
            echo "|---|---|"
            echo "| Run | \`$GITHUB_RUN_ID\` |"
            echo "| Event | \`$GITHUB_EVENT_NAME\` (\`${EVENT_ACTION:-none}\`) |"
            echo "| Tested SHA | \`${GITHUB_SHA:0:7}\` |"
            echo
            echo "### Results"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up uv and Python
        id: setup-uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version-file: toolchain/uv.toml
          python-version: "3.14.6"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Prepare router environment
        run: uv sync --locked --package ci-checks -q

      - name: Mark router work start
        id: unique
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Gather protected-main evidence
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-sync ci-checks gate-evidence \
            --event "$GITHUB_EVENT_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --head-sha "$GITHUB_SHA" \
            --github-env "$GITHUB_ENV"

      - name: Compute change gate
        id: gate
        env:
          BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          record=()
          if [ "$EVENT" = push ]; then
            record=(--affected-images-record affected-images.json)
          fi
          uv run --no-sync ci-checks gate --event "$EVENT" --base-ref "$BASE" --head-ref "$HEAD" \
            --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY" "${record[@]}"

      - name: Upload affected image record
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: affected-images
          path: affected-images.json
          if-no-files-found: error
          retention-days: 7


      # No `if:` on purpose: both outputs must be defined on every event for the fan-in renderer.
      # Fails closed, so a missing or ambiguous proof runs the full selected suite.
      - name: Look up a reusable Checks proof
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          uv run --no-sync ci-checks gate-reuse \
            --event "$GITHUB_EVENT_NAME" \
            --action "$EVENT_ACTION" \
            --repository "$GITHUB_REPOSITORY" \
            --pr-head-sha "$PR_HEAD_SHA" \
            --base-sha "$PR_BASE_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Derive worker guard
        id: guards
        env:
          COMMIT_CLASS: ${{ steps.gate.outputs.commit_class }}
        run: |
          case "$COMMIT_CLASS" in
            # S-90 split the wall budget into a cold and a warm one. This value is fixed when the
            # matrix is created, before any leg knows whether its ready cache will hit, so only the
            # larger of the two can bound a hang without killing a legitimately cold worker.
            standard|broad) cold_wall_budget_seconds=844 ;;
            *)
              echo "cannot derive a guard for commit class: $COMMIT_CLASS" >&2
              exit 1
              ;;
          esac
          # A timeout is a hang guard, not the class budget verdict. Parallel broad units
          # share one fan-in wall clock, so each uses the same wall-plus-grace guard.
          hang_grace_minutes=2
          timeout=$((cold_wall_budget_seconds / 60 + hang_grace_minutes))
          echo "worker_timeout_minutes=$timeout" >> "$GITHUB_OUTPUT"
      - name: Write Checks attestation
        if: github.event_name == 'pull_request' && github.event.action != 'edited'
        env:
          COMMIT_CLASS: ${{ steps.gate.outputs.commit_class }}
          EVENT_ACTION: ${{ github.event.action }}
          # Binds the proof to the base it was computed against, so a retarget cannot reuse it.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          tested_tree_sha="$(git rev-parse 'HEAD^{tree}')"
          jq -n \
            --arg tested_tree_sha "$tested_tree_sha" \
            --arg event_action "$EVENT_ACTION" \
            --arg commit_class "$COMMIT_CLASS" \
            --arg base_sha "$BASE_SHA" \
            --argjson run_id "$GITHUB_RUN_ID" \
            '{tested_tree_sha: $tested_tree_sha, event_action: $event_action, commit_class: $commit_class, base_sha: $base_sha, run_id: $run_id}' \
            > checks-attestation.json


      - name: Upload Checks attestation
        if: github.event_name == 'pull_request' && github.event.action != 'edited'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checks-attestation
          path: checks-attestation.json
          if-no-files-found: error


      - name: Report router cost
        if: always()
        env:
          UV_CACHE_HIT: ${{ steps.setup-uv.outputs.cache-hit }}
          UV_CACHE_KEY: ${{ steps.setup-uv.outputs.cache-key }}
          JOB_STARTED: ${{ steps.timing.outputs.started }}
          UNIQUE_STARTED: ${{ steps.unique.outputs.started }}
          TITLE_ONLY: ${{ steps.reuse.outputs.title_only }}
          REUSED_RUN_ID: ${{ steps.reuse.outputs.reused_run_id }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          now="$(date +%s)"
          if [[ "$UV_CACHE_HIT" == true ]]; then uv_state=hit; else uv_state=miss; fi
          # Shaped like the composite's cache-telemetry so every job renders caches identically.
          CACHE_OUTCOMES="uv=$uv_state:${UV_CACHE_KEY:-none}"
          # shellcheck disable=SC2016 # Markdown code spans are literal.
          {
            if [ "$TITLE_ONLY" = true ]; then
              echo
              echo "**Substantive units short-circuited.** This event changed only the pull request"
              echo "title, which cannot change the tree, so run \`$REUSED_RUN_ID\` already proves every"
              echo "verdict above. Commit policy still runs in \`Title policy\`."
            fi
            echo
            echo "### Cost"
            echo
            echo "| Phase | Seconds |"
            echo "|---|---:|"
            echo "| Setup | $((UNIQUE_STARTED - JOB_STARTED)) |"
            echo "| Unique work | $((now - UNIQUE_STARTED)) |"
            echo
            echo "| Cache | Outcome | Key |"
            echo "|---|---|---|"
            read -ra entries <<< "$CACHE_OUTCOMES"
            for entry in "${entries[@]}"; do
              name="${entry%%=*}"
              value="${entry#*=}"
              key="${value#*:}"
              state="${value%%:*}"
              if [ "$key" = none ]; then
                key="—"
              else
                # A 64-character hash tells a human nothing; the full key is in the job log.
                key="\`$(printf '%s' "$key" | sed -E 's/([0-9a-f]{8})[0-9a-f]{24,}/\1…/g')\`"
              fi
              printf '| %s | %s | %s |\n' "$name" "${state//-/ }" "$key"
            done
            echo
            echo "### Commands"
            echo
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo '- `ci-checks gate-evidence`'
            fi
            echo '- `ci-checks gate`'
            echo '- `ci-checks gate-reuse`'
            if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "${EVENT_ACTION:-}" != edited ]; then
              echo '- `git rev-parse HEAD^{tree}`; `jq` attestation'
            fi
          } >> "$GITHUB_STEP_SUMMARY"


  worker:
    name: Scoped worker (${{ matrix.unit }})
    needs: [changes]
    if: (needs.changes.outputs.standard == 'true' || needs.changes.outputs.broad == 'true') && needs.changes.outputs.title_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.changes.outputs.worker_timeout_minutes) }}
    strategy:
      # A failing unit must not cancel its siblings: each one is an independent verdict the
      # fan-in reports separately, exactly as the retired broad-* jobs were.
      fail-fast: false
      matrix:
        # The gate emits at most the two measured-capacity legs. Python keeps the 56.8s
        # Python-only payload; frontend carries hygiene and the full 68.1s payload. Putting
        # hygiene on Python would add 11.3s of setup to the 344s long pole.
        unit: ${{ fromJSON(needs.changes.outputs.worker_units) }}
    permissions:
      # Only the cache-writing leg needs this, but `permissions:` takes no expression, so
      # every leg carries it. Fork pull requests get a read-only token regardless.
      actions: write
      contents: read
    env:
      NIX_SETUP_SELECTED: ${{ needs.changes.outputs.broad == 'true' || needs.changes.outputs.protected_main_smoke == 'true' || needs.changes.outputs.nix == 'true' || needs.changes.outputs.lint_python == 'true' || needs.changes.outputs.lint_proto == 'true' || needs.changes.outputs.lint_workflows == 'true' || needs.changes.outputs.lint_docker == 'true' || needs.changes.outputs.typecheck_backend == 'true' || needs.changes.outputs.python_any == 'true' || needs.changes.outputs.hygiene == 'true' || needs.changes.outputs.build_backend == 'true' || needs.changes.outputs.api_schema_freshness == 'true' || needs.changes.outputs.image_matrix_parity == 'true' || needs.changes.outputs.proto_breaking == 'true' }}
      NODE_SETUP_SELECTED: ${{ needs.changes.outputs.protected_main_smoke != 'true' && needs.changes.outputs.title_only != 'true' && (needs.changes.outputs.commitlint_expected == 'true' || needs.changes.outputs.lint_markdown == 'true' || needs.changes.outputs.lint_frontend == 'true' || needs.changes.outputs.lint_steiger == 'true' || needs.changes.outputs.typecheck_frontend == 'true' || needs.changes.outputs.frontend_tests == 'true' || needs.changes.outputs.edge_worker == 'true' || needs.changes.outputs.api_schema_freshness == 'true') }}
      DOCS_ONLY: ${{ needs.changes.outputs.standard == 'true' && needs.changes.outputs.lint_markdown == 'true' && needs.changes.outputs.affected_packages == '' }}
      SKYLOS_CACHE_DIR: ${{ github.workspace }}/.skylos
      SKYLOS_CACHE_STATIC_TIER: content
      # One selector for the deploy key, the static cache and the scan, so the three cannot drift.
      DEADCODE_SELECTED: ${{ matrix.unit == 'frontend' && needs.changes.outputs.protected_main_smoke != 'true' && (needs.changes.outputs.broad == 'true' || needs.changes.outputs.affected_packages != '') && github.event.pull_request.head.repo.fork != true }}
    outputs:
      # Single-writer: the runner skips an output whose expression is the empty string
      # (actions/runner JobExtension.cs:789-805), so a unit that did not run contributes
      # nothing. `false` is NOT empty by that check, hence the '' spelling below.
      node_group_executed: ${{ steps.setup-ci.outputs.node-group-executed == 'true' && 'true' || '' }}
      commitlint_executed: ${{ steps.commitlint-range.outcome == 'success' && 'true' || '' }}
      # Warmth needs two single-writer signals, not one tri-state: an empty output is
      # indistinguishable from a leg that never reported, and S-90 requires an unreported run to
      # take the cold budget. A miss on any leg publishes the miss; a hit publishes only the hit.
      ready_cache_missed: ${{ steps.setup-ci.outputs.ready-cache-hit != 'true' && 'true' || '' }}
      ready_cache_hit: ${{ steps.setup-ci.outputs.ready-cache-hit == 'true' && 'true' || '' }}
    steps:
      - name: Start worker timing
        id: timing
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Open worker summary
        env:
          UNIT: ${{ matrix.unit }}
          UNITS: ${{ join(fromJSON(needs.changes.outputs.worker_units), ', ') }}
          COMMIT_CLASS: ${{ needs.changes.outputs.commit_class }}
        run: |
          case "$UNIT" in
            python) scope='the Python leg: the affected-package test closure.' ;;
            frontend) scope='the frontend leg: Node, hygiene and policy checks.' ;;
            *) echo "unknown worker unit: $UNIT" >&2; exit 1 ;;
          esac
          {
            echo "## Scoped worker ($UNIT)"
            echo
            echo "Runs $scope"
            echo
            echo "| Context | Value |"
            echo "|---|---|"
            echo "| Run | \`$GITHUB_RUN_ID\` |"
            echo "| Unit | \`$UNIT\` of \`$UNITS\` |"
            echo "| Commit class | \`$COMMIT_CLASS\` |"
            echo "| Tested SHA | \`${GITHUB_SHA:0:7}\` |"
            echo
            echo "### Results"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false


      - name: Set up selected environments
        id: setup-ci
        uses: ./.github/actions/setup-ci
        with:
          ready-cache: ${{ env.NIX_SETUP_SELECTED }}
          # Python restores no node_modules. Frontend owns the Nix-dependent hygiene lanes and the
          # Node workspace contract, so it takes the full payload and is the sole cache writer.
          payload: ${{ matrix.unit == 'python' && 'python' || 'full' }}
          save-ready-cache: ${{ matrix.unit == 'frontend' && (needs.changes.outputs.broad == 'true' || github.event_name == 'push') }}
          node: ${{ env.NODE_SETUP_SELECTED }}
          full-node-workspace: ${{ needs.changes.outputs.lint_frontend == 'true' || needs.changes.outputs.lint_steiger == 'true' || needs.changes.outputs.typecheck_frontend == 'true' || needs.changes.outputs.frontend_tests == 'true' || needs.changes.outputs.edge_worker == 'true' || needs.changes.outputs.api_schema_freshness == 'true' }}
          skylos-cache: ${{ env.DEADCODE_SELECTED }}
          skylos-deploy-key: ${{ env.DEADCODE_SELECTED == 'true' && secrets.SKYLOS_DEPLOY_KEY || '' }}
          commit-class: ${{ needs.changes.outputs.commit_class }}
          base-sha: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.sha }}

      - name: Mark unique work start
        id: unique
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Protected-main smoke
        if: needs.changes.outputs.protected_main_smoke == 'true'
        run: nix develop .#ci --command uv run --no-sync ci-checks --help > /dev/null

      # Native groups are capped at two low-memory lanes. CPU-saturating tests, Biome,
      # typecheck, deptry, marker suites and Docker gitleaks remain standalone.
      - parallel:
          - name: Check flake
            if: matrix.unit == 'frontend' && needs.changes.outputs.protected_main_smoke != 'true' && (needs.changes.outputs.broad_unbounded == 'true' || needs.changes.outputs.nix == 'true')
            run: nix flake check

          - name: Check Lefthook version
            if: matrix.unit == 'frontend' && needs.changes.outputs.protected_main_smoke != 'true' && (needs.changes.outputs.broad_unbounded == 'true' || needs.changes.outputs.nix == 'true')
            env:
              LEFTHOOK_VERSION: '2.1.10'
            run: |
              actual="$(nix develop .#ci --command lefthook version)"
              test "$actual" = "$LEFTHOOK_VERSION" || {
                echo "expected Lefthook $LEFTHOOK_VERSION, got: $actual" >&2
                exit 1
              }

      - name: Lint Python
        if: matrix.unit == 'frontend' && needs.changes.outputs.protected_main_smoke != 'true' && (needs.changes.outputs.broad_unbounded == 'true' || needs.changes.outputs.lint_python == 'true')
        env:
          # Ruff runs before Skylos, which fingerprints the workspace by walking it and
          # hashing every file whose path components avoid its EXCLUDED_DIRS. `.ruff_cache`
          # is not in that set, so its ~283 files enter the fingerprint, and their contents
          # track source mtimes that every fresh checkout changes. Left in the workspace it
          # forces a Skylos inner-key miss on each hosted run even when the outer
          # actions/cache restore succeeds: measured 196s miss vs 9s hit.
          RUFF_CACHE_DIR: ${{ runner.temp }}/ruff-cache
          # Broad tests the whole tree, so it lints every file rather than the diff.
          RUFF_SCOPE: ${{ needs.changes.outputs.broad == 'true' && 'ALL' || 'CHANGED' }}
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          export UV_PROJECT_ENVIRONMENT=.venv
          if [[ "$RUFF_SCOPE" == ALL ]]; then
            nix develop .#ci --command uv run --no-sync ruff check --output-format=github \
              --exclude '**/alembic/**' --exclude '**/nohiki-domain-models/**' .
          else
            mapfile -d '' -t files < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA..$HEAD_SHA" -- \
              '*.py' ':(exclude)**/alembic/**' ':(exclude)**/nohiki-domain-models/**')
            ((${#files[@]} == 0)) || nix develop .#ci --command uv run --no-sync \
              ruff check --output-format=github "${files[@]}"
          fi

      - name: Check Python formatting
        if: matrix.unit == 'frontend' && needs.changes.outputs.protected_main_smoke != 'true' && (needs.changes.outputs.broad_unbounded == 'true' || needs.changes.outputs.lint_python == 'true')
        env:
          RUFF_CACHE_DIR: ${{ runner.temp }}/ruff-cache
          RUFF_SCOPE: ${{ needs.changes.outputs.broad == 'true' && 'ALL' || 'CHANGED' }}
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          export UV_PROJECT_ENVIRONMENT=.venv
          if [[ "$RUFF_SCOPE" == ALL ]]; then
            nix develop .#ci --command uv run --no-sync ruff format --check \
              --exclude '**/alembic/**' --exclude '**/nohiki-domain-models/**' .
          else
            mapfile -d '' -t files < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA..$HEAD_SHA" -- \
              '*.py' ':(exclude)**/alembic/**' ':(exclude)**/nohiki-domain-models/**')
            ((${#files[@]} == 0)) || nix develop .#ci --command uv run --no-sync \
              ruff format --check "${files[@]}"
          fi

      - name: Lint Markdown
        if: matrix.unit == 'frontend' && needs.changes.outputs.protected_main_smoke != 'true' && (needs.changes.outputs.broad_unbounded == 'true' || needs.changes.outputs.lint_markdown == 'true')
        env:
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mapfile -d '' -t files < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA..$HEAD_SHA" -- '*.md')
          ((${#files[@]} == 0)) || pnpm exec markdownlint-cli2 "${files[@]}"

      - name: Lint protos
        if: matrix.unit == 'frontend' && needs.changes.outputs.protected_main_smoke != 'true' && (needs.changes.outputs.broad_unbounded == 'true' || needs.changes.outputs.lint_proto == 'true')
        run: nix develop .#ci --command bash -euc 'cd proto && buf lint'

      - name: Lint workflows
        if: matrix.unit == 'frontend' && needs.changes.outputs.protected_main_smoke != 'true' && (needs.changes.outputs.broad_unbounded == 'true' || needs.changes.outputs.lint_workflows == 'true')
        run: |
          # Remove when rhysd/actionlint#694 and #695 reach pinned nixpkgs.
          nix develop .#ci --command actionlint \
            -ignore '^step must run script with "run" section or run action with "uses" section$'
          nix develop .#ci --command check-jsonschema \
            --builtin-schema vendor.github-workflows .github/workflows/*.yml

      - name: Lint frontend
        if: matrix.unit == 'frontend' && needs.changes.outputs.protected_main_smoke != 'true' && (needs.changes.outputs.broad_unbounded == 'true' || needs.changes.outputs.lint_frontend == 'true')
        run: pnpm --filter nohiki-frontend exec biome ci --reporter=github .

      - parallel:
          - name: Lint frontend architecture (Steiger)
            if: matrix.unit == 'frontend' && needs.changes.outputs.protected_main_smoke != 'true' && (needs.changes.outputs.broad_unbounded == 'true' || needs.changes.outputs.lint_steiger == 'true')
            run: pnpm --filter nohiki-frontend run lint:fsd

          - name: Check i18n keys
            if: matrix.unit == 'frontend' && needs.changes.outputs.protected_main_smoke != 'true' && (needs.changes.outputs.broad_unbounded == 'true' || needs.changes.outputs.lint_frontend == 'true')
            run: pnpm --filter nohiki-frontend run i18n:check

      - name: Lint Dockerfiles (hadolint)
        if: matrix.unit == 'frontend' && needs.changes.outputs.protected_main_smoke != 'true' && (needs.changes.outputs.broad_unbounded == 'true' || needs.changes.outputs.lint_docker == 'true')
        run: >
          git ls-files -z -- '*Dockerfile' '*Dockerfile.*'
          ':(exclude)*.dockerignore' ':(exclude)*.j2'
          | xargs -0 -r nix develop .#ci --command hadolint

      - name: Scan changed content for secrets
        if: env.DOCS_ONLY == 'true'
        env:
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          git diff --binary "$BASE_SHA..$HEAD_SHA" |
            docker run --rm -i --workdir /repo \
              -v "$PWD/.gitleaks.toml:/repo/.gitleaks.toml:ro" \
              ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
              stdin --config /repo/.gitleaks.toml --no-banner --redact

      - name: Scan repository for secrets
        if: matrix.unit == 'frontend' && env.DOCS_ONLY != 'true'
        run: |
          docker run --rm --workdir /repo -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source . --config .gitleaks.toml --no-banner --redact

      - name: Typecheck backend
        if: matrix.unit == 'frontend' && needs.changes.outputs.protected_main_smoke != 'true' && (needs.changes.outputs.broad_unbounded == 'true' || needs.changes.outputs.typecheck_backend == 'true')
        env:
          PACKAGE_SCOPE: ${{ needs.changes.outputs.broad == 'true' && 'ALL' || needs.changes.outputs.affected_packages }}
        run: |
          mapfile -t paths < <(nix develop .#ci --command uv run --no-sync python -c '
          import sys, tomllib
          selection = sys.argv[1]
          names = None if selection == "ALL" else set(selection.split(","))
          lock = tomllib.load(open("uv.lock", "rb"))
          print(*(p["source"]["editable"] for p in lock["package"]
                  if "editable" in p.get("source", {}) and (names is None or p["name"] in names)), sep="\n")
          ' "$PACKAGE_SCOPE")
          test "${#paths[@]}" -gt 0
          nix develop .#ci --command uv run --no-sync ty check "${paths[@]}" \
            --exclude '**/alembic/**' --exclude '**/nohiki-domain-models/**' --exclude '**/tests/**'

      - name: Check selected dead code
        if: env.DEADCODE_SELECTED == 'true'
        id: deadcode
        env:
          PACKAGE_SCOPE: ${{ needs.changes.outputs.broad == 'true' && 'ALL' || needs.changes.outputs.affected_packages }}
          # Hosted workers expose two cores; pinning jobs keeps the fork's cache identity stable.
          SKYLOS_JOBS: "2"
        run: |
          nix develop .#ci --command uv run --no-sync ci-checks deadcode \
            --scope all --packages "$PACKAGE_SCOPE" --ci --fail --no-provenance \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Save Skylos static analysis cache
        if: always() && (steps.deadcode.conclusion == 'success' || steps.deadcode.conclusion == 'failure') && steps.deadcode.outputs.static-result-published == 'true' && steps.setup-ci.outputs.skylos-cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.skylos
          key: ${{ steps.setup-ci.outputs.skylos-cache-primary-key }}

      - name: Typecheck frontend
        if: matrix.unit == 'frontend' && needs.changes.outputs.protected_main_smoke != 'true' && (needs.changes.outputs.broad_unbounded == 'true' || needs.changes.outputs.typecheck_frontend == 'true')
        run: pnpm -C typescript/apps/frontend type-check

      - name: Run selected Python tests
        if: matrix.unit == 'python' && needs.changes.outputs.protected_main_smoke != 'true' && (needs.changes.outputs.broad_unbounded == 'true' || needs.changes.outputs.python_any == 'true')
        env:
          TEST_PACKAGES: ${{ needs.changes.outputs.test_packages }}
          SUMMARY_TITLE: ${{ needs.changes.outputs.commit_class }}
          CI_CHECKS_SKIP_WORKSPACE_SYNC: "1"
          OTEL_SDK_DISABLED: "true"
          UV_NO_SYNC: "1"
          COVERAGE_CORE: "sysmon"
        run: |
          test -n "$TEST_PACKAGES"
          nix develop .#ci --command uv run --no-sync ci-checks tests all --scope all \
            --packages "$TEST_PACKAGES" --ci --workers 2 --summary "$GITHUB_STEP_SUMMARY" \
            --summary-title "$SUMMARY_TITLE"

      # These assert the Playwright config by executing it, so they need the installed pnpm
      # workspace and not just a `node` binary. The `python` payload restores no node_modules,
      # so selection follows the payload: they run in the unit that carries one. The gate names
      # their own inputs, which are the k8s Playwright config, the journeys it collects, the
      # workspace manifests that resolve the Playwright version, and the test module itself.
      - name: Run Node workspace contract tests
        if: matrix.unit == 'frontend' && needs.changes.outputs.protected_main_smoke != 'true' && (needs.changes.outputs.broad_unbounded == 'true' || needs.changes.outputs.node_workspace_contracts == 'true')
        run: >
          nix develop .#ci --command uv run --no-sync pytest
          scripts/ci/tests -m requires_node_modules

      # The analyzer is a private distribution held out of the shared environment closure, so it
      # exists only on the lanes where `setup-ci` installed it. This gate reads the same value
      # that decides that install, so the two cannot drift into the ModuleNotFoundError the
      # placement exists to prevent.
      - name: Run Skylos cache contract tests
        if: env.DEADCODE_SELECTED == 'true'
        run: >
          nix develop .#ci --command uv run --no-sync pytest
          scripts/ci/tests -m requires_skylos

      - name: Test frontend
        if: matrix.unit == 'frontend' && needs.changes.outputs.protected_main_smoke != 'true' && (needs.changes.outputs.broad_unbounded == 'true' || needs.changes.outputs.frontend_tests == 'true')
        # 50% resolves to ONE worker on the 2-vCPU runner, idling half the machine. Measured
        # under `taskset -c 0-1`: 1 worker 294s, 2 workers 260s (2212 tests, identical result).
        # Vitest appends its own `## Vitest Test Report` block, and the edge worker appends an
        # identical one below. The label names which suite the block that follows belongs to.
        run: |
          # shellcheck disable=SC2016 # Markdown code spans are literal.
          printf '#### Frontend app tests (Vitest)\n\n`typescript/apps/frontend`. Report follows.\n' \
            >> "$GITHUB_STEP_SUMMARY"
          pnpm -C typescript/apps/frontend test --run --maxWorkers=100%

      - name: Lint edge worker
        if: matrix.unit == 'frontend' && needs.changes.outputs.protected_main_smoke != 'true' && (needs.changes.outputs.broad_unbounded == 'true' || needs.changes.outputs.edge_worker == 'true')
        run: >
          pnpm --filter @nohiki/auth-listings-worker exec biome ci --reporter=github src/

      - name: Typecheck edge worker
        if: matrix.unit == 'frontend' && needs.changes.outputs.protected_main_smoke != 'true' && (needs.changes.outputs.broad_unbounded == 'true' || needs.changes.outputs.edge_worker == 'true')
        run: >
          pnpm --filter @nohiki/auth-listings-worker exec tsc --noEmit

      - name: Test edge worker
        if: matrix.unit == 'frontend' && needs.changes.outputs.protected_main_smoke != 'true' && (needs.changes.outputs.broad_unbounded == 'true' || needs.changes.outputs.edge_worker == 'true')
        run: |
          # shellcheck disable=SC2016 # Markdown code spans are literal.
          printf '#### Edge worker tests (Vitest)\n\n`@nohiki/auth-listings-worker`. Report follows.\n' \
            >> "$GITHUB_STEP_SUMMARY"
          pnpm --filter @nohiki/auth-listings-worker exec vitest run

      - name: Validate PR commit messages
        id: commitlint-range
        if: matrix.unit == 'frontend' && needs.changes.outputs.commitlint_expected == 'true'
        run: >
          pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Validate PR title (merge commit subject)
        if: matrix.unit == 'frontend' && needs.changes.outputs.commitlint_expected == 'true'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose

      - name: Check dependencies
        if: matrix.unit == 'frontend' && needs.changes.outputs.protected_main_smoke != 'true' && (needs.changes.outputs.broad_unbounded == 'true' || needs.changes.outputs.hygiene == 'true')
        env:
          PACKAGE_SCOPE: ${{ needs.changes.outputs.broad == 'true' && 'ALL' || needs.changes.outputs.affected_packages }}
        run: nix develop .#ci --command uv run --no-sync ci-checks deptry --packages "$PACKAGE_SCOPE" --ci

      - parallel:
          - name: Scan architecture
            if: matrix.unit == 'frontend' && needs.changes.outputs.protected_main_smoke != 'true' && (needs.changes.outputs.broad_unbounded == 'true' || needs.changes.outputs.hygiene == 'true')
            run: >
              nix develop .#ci --command env -u LD_LIBRARY_PATH
              uvx --override semgrep-overrides.txt semgrep scan
              --config semgrep.yml --error --no-git-ignore --metrics=off --disable-version-check backend/

          - name: Check build backends
            if: matrix.unit == 'frontend' && needs.changes.outputs.protected_main_smoke != 'true' && (needs.changes.outputs.broad_unbounded == 'true' || needs.changes.outputs.build_backend == 'true')
            env:
              AFFECTED_PACKAGES: ${{ needs.changes.outputs.affected_packages }}
            run: >
              nix develop .#ci --command uv run --no-sync ci-checks build-backend
              --packages "$AFFECTED_PACKAGES" --ci --strict

      - parallel:
          - name: Check API schema freshness
            if: matrix.unit == 'frontend' && needs.changes.outputs.protected_main_smoke != 'true' && (needs.changes.outputs.broad_unbounded == 'true' || needs.changes.outputs.api_schema_freshness == 'true')
            run: nix develop .#ci --command just api-schema-check

          - name: Check image matrix parity
            if: matrix.unit == 'frontend' && needs.changes.outputs.protected_main_smoke != 'true' && (needs.changes.outputs.broad_unbounded == 'true' || needs.changes.outputs.image_matrix_parity == 'true')
            run: nix develop .#ci --command just image-matrix-check

      - name: Check proto compatibility
        if: matrix.unit == 'frontend' && needs.changes.outputs.protected_main_smoke != 'true' && (needs.changes.outputs.broad_unbounded == 'true' || needs.changes.outputs.proto_breaking == 'true')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" && git ls-tree --name-only "$BASE_SHA" proto/ | grep -q .; then
            nix develop .#ci --command bash -euc "cd proto && buf breaking --against '../.git#commit=${BASE_SHA},subdir=proto'"
          else
            echo "Skipping: proto/ is absent from the checked-out base commit"
          fi

      - name: Report worker cost
        if: always()
        env:
          CACHE_OUTCOMES: ${{ steps.setup-ci.outputs.cache-telemetry }}
          JOB_STARTED: ${{ steps.timing.outputs.started }}
          UNIQUE_STARTED: ${{ steps.unique.outputs.started }}
          UNIT: ${{ matrix.unit }}
          SMOKE: ${{ needs.changes.outputs.protected_main_smoke }}
        run: |
          now="$(date +%s)"
          # A unit reports only what it actually ran. `all` runs everything; a broad unit runs
          # its own bin, so the owning unit is part of the claim, not just the router flag.
          commands=()
          record() {
            if [ "$SMOKE" != true ] && [ "$1" = true ] && [ "$UNIT" = "$2" ]; then
              commands+=("$3")
            fi
          }
          record "${{ needs.changes.outputs.nix }}" frontend 'nix flake check; lefthook version'
          record "${{ needs.changes.outputs.lint_python }}" frontend 'ruff check/format (whole tree on broad, changed files on standard)'
          record "${{ needs.changes.outputs.lint_markdown }}" frontend 'markdownlint-cli2 (changed Markdown files)'
          record "${{ needs.changes.outputs.lint_proto }}" frontend 'buf lint'
          record "${{ needs.changes.outputs.lint_workflows }}" frontend 'actionlint; check-jsonschema'
          record "${{ needs.changes.outputs.lint_docker }}" frontend 'hadolint (tracked Dockerfiles)'
          record "${{ needs.changes.outputs.lint_frontend }}" frontend 'Biome; i18n:check'
          record "${{ needs.changes.outputs.lint_steiger }}" frontend 'Steiger FSD architecture'
          record "${{ needs.changes.outputs.typecheck_backend }}" frontend 'ty check affected package closure'
          record "${{ needs.changes.outputs.typecheck_frontend }}" frontend 'frontend type-check'
          record "${{ needs.changes.outputs.python_any }}" python 'ci-checks tests affected package closure'
          record "${{ needs.changes.outputs.node_workspace_contracts }}" frontend 'pytest -m requires_node_modules'
          record "${{ needs.changes.outputs.frontend_tests }}" frontend 'frontend Vitest'
          record "${{ needs.changes.outputs.edge_worker }}" frontend 'Biome; tsc; Vitest edge worker'
          record "${{ needs.changes.outputs.hygiene }}" frontend 'ci-checks deptry --packages affected closure; Semgrep architecture scan'
          record "${{ needs.changes.outputs.build_backend }}" frontend 'ci-checks build-backend --packages affected closure'
          record "${{ needs.changes.outputs.api_schema_freshness }}" frontend 'just api-schema-check'
          record "${{ needs.changes.outputs.image_matrix_parity }}" frontend 'just image-matrix-check'
          record "${{ needs.changes.outputs.proto_breaking }}" frontend 'buf breaking'
          record "${{ needs.changes.outputs.commitlint_expected }}" frontend 'commitlint PR range; commitlint PR title'
          {
            # Results is filled by the tools that emit their own block. A bounded broad run
            # routinely selects none of them, so an empty section is the normal outcome and has to
            # read as one rather than as a report that failed to arrive.
            if [ "$SMOKE" = true ]; then
              echo
              echo "Protected-main smoke only. No check in this unit reports findings."
            elif ((${#commands[@]} == 0)); then
              echo
              echo "The gate selected no check for the \`$UNIT\` bin on this change, so there is"
              echo "nothing to report here. The secret scan below is the only work this unit did."
            fi
            echo
            echo "### Cost"
            echo
            echo "| Phase | Seconds |"
            echo "|---|---:|"
            echo "| Setup | $((UNIQUE_STARTED - JOB_STARTED)) |"
            echo "| Unique work | $((now - UNIQUE_STARTED)) |"
            echo
            echo "| Cache | Outcome | Key |"
            echo "|---|---|---|"
            read -ra entries <<< "${CACHE_OUTCOMES:-}"
            for entry in "${entries[@]}"; do
              name="${entry%%=*}"
              value="${entry#*=}"
              key="${value#*:}"
              state="${value%%:*}"
              if [ "$key" = none ]; then
                key="—"
              else
                # A 64-character hash tells a human nothing; the full key is in the job log.
                key="\`$(printf '%s' "$key" | sed -E 's/([0-9a-f]{8})[0-9a-f]{24,}/\1…/g')\`"
              fi
              printf '| %s | %s | %s |\n' "$name" "${state//-/ }" "$key"
            done
            echo
            echo "### Commands"
            echo
            if [ "$SMOKE" = true ]; then
              # shellcheck disable=SC2016 # Markdown code spans are literal.
              echo '- `ci-checks --help` (protected-main smoke)'
            fi
            for command in "${commands[@]}"; do
              echo "- \`$command\`"
            done
            # shellcheck disable=SC2016 # Markdown code spans are literal.
            echo '- changed-content or repository-wide `gitleaks` scan'
          } >> "$GITHUB_STEP_SUMMARY"

  container-contracts:
    name: Container contracts
    needs: [changes]
    if: needs.changes.outputs.protected_main_smoke != 'true' && needs.changes.outputs.title_only != 'true' && (needs.changes.outputs.broad_unbounded == 'true' || needs.changes.outputs.frontend_smoke == 'true' || needs.changes.outputs.otel_collector == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 13
    permissions:
      # This job saves no cache, so it purges none either. Its BuildKit `type=gha` layer cache
      # goes through the runtime cache service on ACTIONS_RUNTIME_TOKEN, not the job token,
      # exactly as `playwright-image` below already demonstrates on `contents: read` alone.
      contents: read
    steps:
      - name: Start worker timing
        id: timing
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open container contracts summary
        run: |
          {
            echo "## Container contracts"
            echo
            echo "Builds the production frontend image and validates the OpenTelemetry collector"
            echo "image against its rendered configs."
            echo
            echo "| Context | Value |"
            echo "|---|---|"
            echo "| Run | \`$GITHUB_RUN_ID\` |"
            echo "| Tested SHA | \`${GITHUB_SHA:0:7}\` |"
            echo
            echo "### Results"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        if: needs.changes.outputs.frontend_smoke == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Set up container contract environment
        id: setup-ci
        uses: ./.github/actions/setup-ci
        with:
          ready-cache: "true"
          # No `skylos-deploy-key`: this job runs no dead-code scan, so it needs no private fork.

      - name: Mark unique work start
        id: unique
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build production frontend image
        id: frontend-image
        if: needs.changes.outputs.frontend_smoke == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          # The action's own job summary is vendor advertising in a report we own.
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: typescript/apps/frontend/Dockerfile
          load: true
          tags: nohiki-frontend-smoke:ci
          cache-from: type=gha,scope=frontend-smoke
          cache-to: type=gha,scope=frontend-smoke,mode=max

      - name: Smoke production frontend container
        id: frontend-smoke
        if: needs.changes.outputs.frontend_smoke == 'true'
        run: >
          nix develop .#ci --command uv run --no-sync pytest
          scripts/ci/tests/test_frontend_delivery.py::test_frontend_container_build_and_hardened_runtime_smoke
        env:
          CONTAINER_RUNTIME: docker
          FRONTEND_SMOKE_IMAGE: nohiki-frontend-smoke:ci

      - name: Validate OpenTelemetry collector image and configs
        id: otel-collector
        if: needs.changes.outputs.otel_collector == 'true'
        run: >
          nix develop .#ci --command uv run --no-sync pytest
          scripts/ci/tests/test_otel_collector_manifest.py::test_otel_collector_rendered_configs_validate_with_pinned_binary

      - name: Report container contracts cost
        if: always()
        env:
          CACHE_OUTCOMES: ${{ steps.setup-ci.outputs.cache-telemetry }}
          JOB_STARTED: ${{ steps.timing.outputs.started }}
          UNIQUE_STARTED: ${{ steps.unique.outputs.started }}
          IMAGE_OUTCOME: ${{ steps.frontend-image.outcome }}
          SMOKE_OUTCOME: ${{ steps.frontend-smoke.outcome }}
          OTEL_OUTCOME: ${{ steps.otel-collector.outcome }}
        run: |
          now="$(date +%s)"
          # `skipped` is the runner's word for a step whose gate was false, which is a different
          # statement from a check that ran and passed. Both are reported, neither is inferred.
          outcome() { [ "$1" = skipped ] && echo "not selected" || echo "$1"; }
          # shellcheck disable=SC2016 # Markdown code spans are literal.
          {
            echo
            echo "| Check | Outcome |"
            echo "|---|---|"
            echo "| Production frontend image build | $(outcome "$IMAGE_OUTCOME") |"
            echo "| Frontend container hardened-runtime smoke | $(outcome "$SMOKE_OUTCOME") |"
            echo "| OpenTelemetry collector image and rendered configs | $(outcome "$OTEL_OUTCOME") |"
            echo
            echo "### Cost"
            echo
            echo "| Phase | Seconds |"
            echo "|---|---:|"
            echo "| Setup | $((UNIQUE_STARTED - JOB_STARTED)) |"
            echo "| Unique work | $((now - UNIQUE_STARTED)) |"
            echo
            echo "| Cache | Outcome | Key |"
            echo "|---|---|---|"
            read -ra entries <<< "${CACHE_OUTCOMES:-}"
            for entry in "${entries[@]}"; do
              name="${entry%%=*}"
              value="${entry#*=}"
              key="${value#*:}"
              state="${value%%:*}"
              if [ "$key" = none ]; then
                key="—"
              else
                # A 64-character hash tells a human nothing; the full key is in the job log.
                key="\`$(printf '%s' "$key" | sed -E 's/([0-9a-f]{8})[0-9a-f]{24,}/\1…/g')\`"
              fi
              printf '| %s | %s | %s |\n' "$name" "${state//-/ }" "$key"
            done
            echo
            echo "Image layers come from the BuildKit \`type=gha\` cache, which is not an"
            echo "\`actions/cache\` entry and reports its hit rate in the build step log."
            echo
            echo "### Commands"
            echo
            echo '- Buildx build of `typescript/apps/frontend/Dockerfile`'
            echo '- `pytest test_frontend_delivery.py::test_frontend_container_build_and_hardened_runtime_smoke`'
            echo '- `pytest test_otel_collector_manifest.py::test_otel_collector_rendered_configs_validate_with_pinned_binary`'
          } >> "$GITHUB_STEP_SUMMARY"

  playwright-image:
    name: Playwright runner image
    needs: [changes]
    if: needs.changes.outputs.protected_main_smoke != 'true' && needs.changes.outputs.title_only != 'true' && (needs.changes.outputs.broad_unbounded == 'true' || needs.changes.outputs.frontend_e2e == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    steps:
      - name: Start worker timing
        id: timing
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open Playwright runner image summary
        run: |
          {
            echo "## Playwright runner image"
            echo
            echo "Builds the Playwright runner image and asserts the bundled Playwright CLI runs"
            echo "inside it."
            echo
            echo "| Context | Value |"
            echo "|---|---|"
            echo "| Run | \`$GITHUB_RUN_ID\` |"
            echo "| Tested SHA | \`${GITHUB_SHA:0:7}\` |"
            echo
            echo "### Results"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Mark unique work start
        id: unique
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build Playwright runner image
        id: runner-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          # The action's own job summary is vendor advertising in a report we own.
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: typescript/apps/frontend/Dockerfile.playwright-runner
          load: true
          tags: nohiki-playwright-runner-smoke:ci
          cache-from: type=gha,scope=playwright-runner-smoke
          cache-to: type=gha,scope=playwright-runner-smoke,mode=max

      - name: Verify Playwright runner
        id: runner-verify
        run: >
          docker run --rm
          --entrypoint typescript/apps/frontend/node_modules/.bin/playwright
          nohiki-playwright-runner-smoke:ci --version

      - name: Report Playwright runner image cost
        if: always()
        env:
          JOB_STARTED: ${{ steps.timing.outputs.started }}
          UNIQUE_STARTED: ${{ steps.unique.outputs.started }}
          BUILD_OUTCOME: ${{ steps.runner-image.outcome }}
          VERIFY_OUTCOME: ${{ steps.runner-verify.outcome }}
        run: |
          now="$(date +%s)"
          # shellcheck disable=SC2016 # Markdown code spans are literal.
          {
            echo
            echo "| Check | Outcome |"
            echo "|---|---|"
            echo "| Playwright runner image build | $BUILD_OUTCOME |"
            echo "| \`playwright --version\` inside the built image | $VERIFY_OUTCOME |"
            echo
            echo "### Cost"
            echo
            echo "| Phase | Seconds |"
            echo "|---|---:|"
            echo "| Setup | $((UNIQUE_STARTED - JOB_STARTED)) |"
            echo "| Unique work | $((now - UNIQUE_STARTED)) |"
            echo
            # The previous report named a BuildKit cache outcome this job never queries and never
            # observed. A cache table with no rows would repeat that claim in a nicer shape.
            echo "This job restores no \`actions/cache\` entries. Image layers come from the"
            echo "BuildKit \`type=gha\` cache, which reports its hit rate in the build step log."
            echo
            echo "### Commands"
            echo
            echo '- Buildx build of `typescript/apps/frontend/Dockerfile.playwright-runner`'
            echo '- `playwright --version` inside the built image'
          } >> "$GITHUB_STEP_SUMMARY"

  # The only work an `edited` event can invalidate once the tree is proven. The PR title becomes
  # the merge commit subject, so it is re-linted on every edit; the attestation the router matched
  # covers everything else, including the commit range and the proto baseline, because the base is
  # bound too.
  title-policy:
    name: Title policy
    needs: [changes]
    if: needs.changes.outputs.title_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Start title policy timing
        id: timing
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open title policy summary
        env:
          REUSED_RUN_ID: ${{ needs.changes.outputs.reused_run_id }}
        run: |
          {
            echo "## Title policy"
            echo
            echo "Re-lints the pull request title, which becomes the merge commit subject and is the"
            echo "only thing an \`edited\` event can change. Run \`${REUSED_RUN_ID:-unknown}\` proves the tree."
            echo
            echo "| Context | Value |"
            echo "|---|---|"
            echo "| Run | \`$GITHUB_RUN_ID\` |"
            echo "| Tested SHA | \`${GITHUB_SHA:0:7}\` |"
            echo "| Proven by | \`${REUSED_RUN_ID:-unknown}\` |"
            echo
            echo "### Results"
          } >> "$GITHUB_STEP_SUMMARY"

      # commitlint is a root devDependency, so the lightweight Node-only path is enough and the
      # full pnpm workspace is never installed.
      - name: Set up commit policy environment
        id: setup-ci
        uses: ./.github/actions/setup-ci
        with:
          node: "true"

      - name: Mark unique work start
        id: unique
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Validate PR title (merge commit subject)
        id: title-lint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose

      - name: Report title policy cost
        if: always()
        env:
          CACHE_OUTCOMES: ${{ steps.setup-ci.outputs.cache-telemetry }}
          JOB_STARTED: ${{ steps.timing.outputs.started }}
          UNIQUE_STARTED: ${{ steps.unique.outputs.started }}
          TITLE_OUTCOME: ${{ steps.title-lint.outcome }}
        run: |
          now="$(date +%s)"
          # shellcheck disable=SC2016 # Markdown code spans are literal.
          {
            echo
            echo "| Check | Outcome |"
            echo "|---|---|"
            echo "| commitlint on the pull request title | $TITLE_OUTCOME |"
            echo
            echo "### Cost"
            echo
            echo "| Phase | Seconds |"
            echo "|---|---:|"
            echo "| Setup | $((UNIQUE_STARTED - JOB_STARTED)) |"
            echo "| Unique work | $((now - UNIQUE_STARTED)) |"
            echo
            echo "| Cache | Outcome | Key |"
            echo "|---|---|---|"
            read -ra entries <<< "${CACHE_OUTCOMES:-}"
            for entry in "${entries[@]}"; do
              name="${entry%%=*}"
              value="${entry#*=}"
              key="${value#*:}"
              state="${value%%:*}"
              if [ "$key" = none ]; then
                key="—"
              else
                # A 64-character hash tells a human nothing; the full key is in the job log.
                key="\`$(printf '%s' "$key" | sed -E 's/([0-9a-f]{8})[0-9a-f]{24,}/\1…/g')\`"
              fi
              printf '| %s | %s | %s |\n' "$name" "${state//-/ }" "$key"
            done
            echo
            echo "### Commands"
            echo
            echo '- `commitlint` on the pull request title'
          } >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Checks
    if: always()
    needs:
      - changes
      - worker
      - container-contracts
      - playwright-image
      - title-policy
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    steps:
      # No timing steps: a fan-in performs no setup and no unique work, so measuring its own
      # setup and work seconds only ever produced 0 and 1. Its cost is the run's, reported below.
      - name: Open fan-in summary
        env:
          EVENT_ACTION: ${{ github.event.action }}
          COMMIT_CLASS: ${{ needs.changes.outputs.commit_class }}
          TITLE_ONLY: ${{ needs.changes.outputs.title_only }}
          REUSED_RUN_ID: ${{ needs.changes.outputs.reused_run_id }}
        run: |
          {
            echo "## Checks"
            echo
            echo "Fan-in. Asserts every selected job reached the conclusion the gate required,"
            echo "validates the router attestation, and accounts for the run."
            echo
            echo "| Context | Value |"
            echo "|---|---|"
            echo "| Run | \`$GITHUB_RUN_ID\` |"
            echo "| Event | \`$GITHUB_EVENT_NAME\` (\`${EVENT_ACTION:-none}\`) |"
            echo "| Commit class | \`$COMMIT_CLASS\` |"
            if [ "$TITLE_ONLY" = true ]; then
              echo "| Reuse | title-only edit, tree proven by run \`${REUSED_RUN_ID:-unknown}\` |"
            fi
            echo
            echo "### Results"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require every selected check
        env:
          WORK_EXPECTED: ${{ (needs.changes.outputs.standard == 'true' || needs.changes.outputs.broad == 'true') && needs.changes.outputs.title_only != 'true' }}
          # A proven edit runs the title lint alone. Every work job must be skipped for the
          # reuse to be honest, so the fan-in enforces both halves rather than the claim.
          TITLE_POLICY_EXPECTED: ${{ needs.changes.outputs.title_only == 'true' }}
          # Commit policy runs on the `all` unit for standard and the `frontend` unit for broad,
          # so the claim tracks the router flag alone. Scoping it to one class would attest that
          # nothing ran on the class where it does.
          WORKER_COMMITLINT_EXPECTED: ${{ needs.changes.outputs.commitlint_expected == 'true' && needs.changes.outputs.title_only != 'true' }}
          WORKER_COMMITLINT: ${{ needs.worker.outputs.commitlint_executed }}
          # Mirrors the worker's own NODE_SETUP_SELECTED, which is what decides whether the
          # composite provisions the Node group, and is evaluated identically in both classes.
          NODE_GROUP_EXPECTED: ${{ needs.changes.outputs.protected_main_smoke != 'true' && needs.changes.outputs.title_only != 'true' && (needs.changes.outputs.commitlint_expected == 'true' || needs.changes.outputs.lint_markdown == 'true' || needs.changes.outputs.api_schema_freshness == 'true' || needs.changes.outputs.lint_frontend == 'true' || needs.changes.outputs.lint_steiger == 'true' || needs.changes.outputs.typecheck_frontend == 'true' || needs.changes.outputs.frontend_tests == 'true' || needs.changes.outputs.edge_worker == 'true') }}
          WORKER_NODE_GROUP: ${{ needs.worker.outputs.node_group_executed }}
          CONTAINER_EXPECTED: ${{ needs.changes.outputs.protected_main_smoke != 'true' && needs.changes.outputs.title_only != 'true' && (needs.changes.outputs.broad_unbounded == 'true' || needs.changes.outputs.frontend_smoke == 'true' || needs.changes.outputs.otel_collector == 'true') }}
          PLAYWRIGHT_EXPECTED: ${{ needs.changes.outputs.protected_main_smoke != 'true' && needs.changes.outputs.title_only != 'true' && (needs.changes.outputs.broad_unbounded == 'true' || needs.changes.outputs.frontend_e2e == 'true') }}
        run: |
          test '${{ needs.changes.result }}' = success
          test '${{ needs.changes.outputs.full }}' = '${{ needs.changes.outputs.broad }}'
          case '${{ needs.changes.outputs.commit_class }}' in
            standard)
              test '${{ needs.changes.outputs.standard }}' = true
              test '${{ needs.changes.outputs.broad }}' = false
              ;;
            broad)
              test '${{ needs.changes.outputs.standard }}' = false
              test '${{ needs.changes.outputs.broad }}' = true
              ;;
            *)
              echo "router emitted an invalid commit class" >&2
              exit 1
              ;;
          esac
          require() {
            result="$1"; expected="$2"; name="$3"
            if [ "$expected" = true ]; then
              test "$result" = success || {
                echo "$name was selected but concluded $result" >&2
                return 1
              }
            else
              test "$result" = skipped || {
                echo "$name was not selected but concluded $result" >&2
                return 1
              }
            fi
          }
          # One matrix result covers every selected unit: a failing unit fails the whole job.
          require '${{ needs.worker.result }}' "$WORK_EXPECTED" worker
          if [ "$WORKER_COMMITLINT_EXPECTED" = true ]; then
            test "$WORKER_COMMITLINT" = true || {
              echo "the selected worker did not execute commit policy" >&2
              exit 1
            }
          else
            test "$WORKER_COMMITLINT" != true
          fi
          if [ "$NODE_GROUP_EXPECTED" = true ]; then
            test "$WORKER_NODE_GROUP" = true || {
              echo "the selected worker did not execute the Node command group" >&2
              exit 1
            }
          else
            test "$WORKER_NODE_GROUP" != true
          fi
          require '${{ needs.container-contracts.result }}' "$CONTAINER_EXPECTED" container-contracts
          require '${{ needs.playwright-image.result }}' "$PLAYWRIGHT_EXPECTED" playwright-image
          require '${{ needs.title-policy.result }}' "$TITLE_POLICY_EXPECTED" title-policy

      - name: Download router attestation
        if: github.event_name == 'pull_request' && github.event.action != 'edited'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checks-attestation
          path: checks-attestation

      - name: Validate router attestation
        if: github.event_name == 'pull_request' && github.event.action != 'edited'
        env:
          COMMIT_CLASS: ${{ needs.changes.outputs.commit_class }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          jq -e \
            --arg commit_class "$COMMIT_CLASS" \
            --arg event_action "$EVENT_ACTION" \
            --argjson run_id "$GITHUB_RUN_ID" \
            '.run_id == $run_id
              and .event_action == $event_action
              and .commit_class == $commit_class
              and (.tested_tree_sha | test("^[0-9a-f]{40}$"))' \
            checks-attestation/checks-attestation.json > /dev/null

      - name: Report workflow accounting
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REUSED_RUN_ID: ${{ needs.changes.outputs.reused_run_id }}
          WORK_EXPECTED: ${{ (needs.changes.outputs.standard == 'true' || needs.changes.outputs.broad == 'true') && needs.changes.outputs.title_only != 'true' }}
          CONTAINER_EXPECTED: ${{ needs.changes.outputs.protected_main_smoke != 'true' && needs.changes.outputs.title_only != 'true' && (needs.changes.outputs.broad_unbounded == 'true' || needs.changes.outputs.frontend_smoke == 'true' || needs.changes.outputs.otel_collector == 'true') }}
          PLAYWRIGHT_EXPECTED: ${{ needs.changes.outputs.protected_main_smoke != 'true' && needs.changes.outputs.title_only != 'true' && (needs.changes.outputs.broad_unbounded == 'true' || needs.changes.outputs.frontend_e2e == 'true') }}
          TITLE_POLICY_EXPECTED: ${{ needs.changes.outputs.title_only == 'true' }}
          # First consumer of the worker's ready-cache signal. Both legs share one outputs map, so
          # each name is written by the single leg whose expression is non-empty.
          WORKER_READY_CACHE_MISSED: ${{ needs.worker.outputs.ready_cache_missed }}
          WORKER_READY_CACHE_HIT: ${{ needs.worker.outputs.ready_cache_hit }}
        run: |
          now_iso="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          run="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          run_started="$(jq -r '.run_started_at' <<< "$run")"
          pages="$(gh api --paginate --slurp "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100")"
          accounting_epoch="$(date -u -d "$now_iso" +%s)"
          run_started_epoch="$(date -u -d "$run_started" +%s)"
          run_wall_seconds=$((accounting_epoch - run_started_epoch))
          first_job_started_epoch="$(jq -r '
            [.[] | .jobs[] | select(.conclusion != "skipped")] as $eligible
            | [$eligible[] | try (.started_at | fromdateiso8601) catch empty] as $starts
            | if ($eligible | length) > 0 and ($starts | length) == ($eligible | length)
              then ($starts | min)
              else empty
              end
          ' <<< "$pages" 2>/dev/null || true)"
          if [[ "$first_job_started_epoch" =~ ^[0-9]+$ ]] \
            && ((first_job_started_epoch >= run_started_epoch \
              && first_job_started_epoch <= accounting_epoch)); then
            controllable_wall_seconds=$((accounting_epoch - first_job_started_epoch))
            dispatch_seconds=$((first_job_started_epoch - run_started_epoch))
            accounting_start_basis="first non-skipped job start from the Actions jobs API"
          else
            controllable_wall_seconds=$run_wall_seconds
            dispatch_seconds=0
            accounting_start_basis="run_started_at fallback: first non-skipped job start unavailable or invalid"
          fi
          jobs="$(jq -c '[.[] | .jobs[] | select(.started_at != null)]' <<< "$pages")"
          billable_minutes="$(jq --arg now "$now_iso" '
            [.[]
              | (((.completed_at // $now) | fromdateiso8601) - (.started_at | fromdateiso8601))
              | (. / 60 | ceil)
            ] | add // 0
          ' <<< "$jobs")"
          case '${{ needs.changes.outputs.commit_class }}' in
            standard|broad)
              # S-90 replaced one budget with two, selected by ready-cache warmth. Warm keeps the
              # owner's under-10-minutes target; cold carries the measured cold-run surcharge.
              warm_wall_budget_seconds=600
              cold_wall_budget_seconds=844
              ;;
            *)
              echo "cannot account for an invalid commit class" >&2
              exit 1
              ;;
          esac
          # One missed leg makes the whole run cold: the wall is the span across every leg, so the
          # run paid cold setup even where a sibling leg restored. An absent or empty signal is cold
          # too, because the warm budget would bind a run that never reported a chance of meeting it.
          if [ "${WORKER_READY_CACHE_MISSED:-}" = true ]; then
            wall_budget_seconds=$cold_wall_budget_seconds
            wall_budget_class=cold
            wall_budget_basis="a worker leg missed the ready-cache primary key"
          elif [ "${WORKER_READY_CACHE_HIT:-}" = true ]; then
            wall_budget_seconds=$warm_wall_budget_seconds
            wall_budget_class=warm
            wall_budget_basis="every reporting worker leg restored the ready-cache primary key"
          else
            wall_budget_seconds=$cold_wall_budget_seconds
            wall_budget_class=cold
            wall_budget_basis="no worker leg reported ready-cache warmth"
          fi
          # $0.006/min, Linux x64 2-vCPU, verified against this account's own July billing.
          estimated_cost_usd="$(printf '%d.%03d' \
            "$((billable_minutes * 6 / 1000))" "$((billable_minutes * 6 % 1000))")"
          # A bare `skipped` conflates two opposite facts: the gate declining work, and the gate
          # asserting a prior run already proved this tree. The expectation bits separate them.
          expected="$(jq -n \
            --argjson worker "$WORK_EXPECTED" \
            --argjson container "$CONTAINER_EXPECTED" \
            --argjson playwright "$PLAYWRIGHT_EXPECTED" \
            --argjson title "$TITLE_POLICY_EXPECTED" \
            '{worker: $worker, "Container contracts": $container,
              "Playwright runner image": $playwright, "Title policy": $title,
              "Router": true, "Checks": true}')"
          {
            echo
            echo "| Job | Exact seconds | Rounded billable minutes | Conclusion |"
            echo "|---|---:|---:|---|"
            jq -r --arg now "$now_iso" --arg reused "${REUSED_RUN_ID:-}" --argjson expected "$expected" '
              .[] |
              (((.completed_at // $now) | fromdateiso8601) - (.started_at | fromdateiso8601)) as $seconds |
              (if (.name | startswith("Scoped worker")) then $expected.worker
               else ($expected[.name] // false) end) as $wanted |
              (if .conclusion == null then "running (this job)"
               elif .conclusion != "skipped" then .conclusion
               elif $wanted and $reused != "" then "skipped: already proven by run \($reused)"
               elif $wanted then "skipped: expected to run"
               else "skipped: not selected" end) as $concl |
              "| \(.name) | \($seconds) | \(($seconds / 60) | ceil) | \($concl) |"
            ' <<< "$jobs"
            echo
            echo "### Cost"
            echo
            echo "A fan-in performs no setup and no unique work; its cost is the run's."
            echo
            echo "| Measure | Value |"
            echo "|---|---:|"
            echo "| Run wall seconds (includes GitHub dispatch) | $run_wall_seconds |"
            echo "| Controllable wall seconds (budgeted) | $controllable_wall_seconds |"
            echo "| GitHub dispatch seconds (not budgeted) | $dispatch_seconds |"
            echo "| Accounting start | $accounting_start_basis |"
            echo "| Wall budget seconds | $wall_budget_seconds |"
            echo "| Wall budget class | $wall_budget_class |"
            echo "| Wall budget basis | $wall_budget_basis |"
            echo "| Reconstructed billable minutes | $billable_minutes |"
            echo "| Estimated cost USD | $estimated_cost_usd |"
            echo
            echo "### Commands"
            echo
            echo "- router attestation validation"
            echo "- jobs API accounting aggregation"
          } >> "$GITHUB_STEP_SUMMARY"
          if ((controllable_wall_seconds >= wall_budget_seconds)); then
            echo "wall budget breached: class=${wall_budget_class}" \
              "observed_controllable=${controllable_wall_seconds}s" \
              "budget<${wall_budget_seconds}s basis=${wall_budget_basis}" >&2
            exit 1
          fi
