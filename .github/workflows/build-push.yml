# .github/workflows/build-push.yml
name: CI - Build and Push Nohiki Services
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: 'Push images to container registry? (false = build + scan only)'
        type: boolean
        default: false
      image_tag:
        description: 'Common image tag for all services (e.g., manual-build-v1; only if pushing images)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  # Never cancel an in-flight publish; queued runs coalesce per ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  event-validation:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.name == 'Checks' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          vars.IMAGE_PUBLICATION_ENABLED == 'true'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
    outputs:
      authorized: ${{ steps.authorize.outputs.authorized }}
      source_sha: ${{ steps.validate-event.outputs.source_sha }}
      short_source_sha: ${{ steps.validate-event.outputs.short_source_sha }}
      should_push: ${{ steps.validate-event.outputs.should_push }}
      image_tags_metadata_string: ${{ steps.validate-event.outputs.tags_metadata_string }}
      common_image_tag_output: ${{ steps.validate-event.outputs.common_tag }}
    steps:
      - name: Validate publication event
        id: validate-event
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHECKS_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CHECKS_EVENT: ${{ github.event.workflow_run.event }}
          CHECKS_NAME: ${{ github.event.workflow_run.name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          PUSH_TO_REGISTRY: ${{ github.event.inputs.push_to_registry }}
          PUBLICATION_ENABLED: ${{ vars.IMAGE_PUBLICATION_ENABLED }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          common_tag=""
          tags_metadata_string=""

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            [[ "$CHECKS_NAME" == "Checks" ]]
            [[ "$CHECKS_EVENT" == "push" ]]
            [[ "$CHECKS_CONCLUSION" == "success" ]]
            [[ "$HEAD_BRANCH" == "main" ]]
            [[ "$HEAD_REPOSITORY" == "$REPOSITORY" ]]
            [[ "$PUBLICATION_ENABLED" == "true" ]]
            [[ "$WORKFLOW_RUN_SHA" =~ ^[0-9a-f]{40}$ ]]
            source_sha="$WORKFLOW_RUN_SHA"
            should_push="true"
          else
            [[ "$EVENT_NAME" == "workflow_dispatch" ]]
            [[ "$DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]]
            source_sha="$DISPATCH_SHA"
            should_push="$PUSH_TO_REGISTRY"
            if [[ "$should_push" == "true" ]]; then
              [[ -n "$IMAGE_TAG" ]] || {
                echo "Error: Image tag must be provided when registry publication is enabled." >&2
                exit 1
              }
              [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || {
                echo "Error: Image tag must match the OCI tag policy." >&2
                exit 1
              }
              common_tag="$IMAGE_TAG"
              tags_metadata_string="type=raw,value=${IMAGE_TAG},enable=true"
            else
              [[ "$should_push" == "false" ]]
            fi
          fi

          short_source_sha="${source_sha:0:7}"
          [[ "$short_source_sha" =~ ^[0-9a-f]{7}$ ]]

          {
            echo "source_sha=$source_sha"
            echo "short_source_sha=$short_source_sha"
            echo "should_push=$should_push"
            echo "tags_metadata_string=$tags_metadata_string"
            echo "common_tag=$common_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Check out publication source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.validate-event.outputs.source_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Authorize source publication
        id: authorize
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ steps.validate-event.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          authorized="true"
          if [[ "$EVENT_NAME" == "workflow_run" ]] && git rev-parse --verify "$SOURCE_SHA^2^{commit}" >/dev/null 2>&1; then
            changed_paths="$(git diff-tree --no-commit-id --name-only -r "$SOURCE_SHA^" "$SOURCE_SHA")"
            if [[ "$changed_paths" == "infra/k8s/helm/values.prod.digests.yaml" ]]; then
              echo "Digest-overlay-only Checks run; image publication is not required."
              authorized="false"
            fi
          fi
          echo "authorized=$authorized" >> "$GITHUB_OUTPUT"

  build-push:
    needs: [ event-validation ]
    if: needs.event-validation.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: user-auth-service, dockerfile: backend/services/user-auth-service/Dockerfile, lockfile: uv.lock }
          - { name: user-pref-service, dockerfile: backend/services/user-pref-service/Dockerfile, lockfile: uv.lock }
          - { name: user-upload-service, dockerfile: backend/services/user-upload-service/Dockerfile, lockfile: uv.lock }
          - { name: user-entitlement-service, dockerfile: backend/services/user-entitlement-service/Dockerfile, lockfile: uv.lock }
          - { name: job-storage-service, dockerfile: backend/services/job-storage-service/Dockerfile, lockfile: uv.lock }
          - { name: job-ingest-discovery-service, dockerfile: backend/services/job-ingest-discovery-service/Dockerfile, lockfile: uv.lock }
          - { name: job-ingest-schedule-service, dockerfile: backend/services/job-ingest-schedule-service/Dockerfile, lockfile: uv.lock }
          - { name: job-ingest-enrichment-service, dockerfile: backend/services/job-ingest-enrichment-service/Dockerfile, lockfile: uv.lock }
          - { name: job-query-composition-service, dockerfile: backend/services/job-query-composition-service/Dockerfile, lockfile: uv.lock }
          - { name: job-correlation-evaluation-service, dockerfile: backend/services/job-correlation-evaluation-service/Dockerfile, lockfile: uv.lock }
          - { name: skill-graph-service, dockerfile: backend/services/skill-graph-service/Dockerfile, lockfile: uv.lock }
          - { name: doc-template-service, dockerfile: backend/services/doc-template-service/Dockerfile, lockfile: uv.lock }
          - { name: doc-content-service, dockerfile: backend/services/doc-content-service/Dockerfile, lockfile: uv.lock }
          - { name: doc-process-service, dockerfile: backend/services/doc-process-service/Dockerfile, lockfile: uv.lock }
          - { name: notification-service, dockerfile: backend/services/notification-service/Dockerfile, lockfile: uv.lock }
          - { name: bff-service, dockerfile: backend/services/bff-service/Dockerfile, lockfile: uv.lock }
          - { name: frontend, context: ., dockerfile: typescript/apps/frontend/Dockerfile, lockfile: pnpm-lock.yaml }
          - { name: api-verification-runner, context: ., dockerfile: tests/Dockerfile.api-runner, lockfile: uv.lock }
          - { name: playwright-verification-runner, context: ., dockerfile: typescript/apps/frontend/Dockerfile.playwright-runner, lockfile: pnpm-lock.yaml }
          - { name: health-runner, context: ., dockerfile: scripts/util/health_check/Dockerfile, lockfile: uv.lock }
          - { name: ml-gateway-service, dockerfile: backend/services/ml-gateway-service/Dockerfile, lockfile: uv.lock }
          - { name: ml-compute-service, dockerfile: backend/services/ml-compute-service/Dockerfile, lockfile: uv.lock }
          # Production GPU variant: same Dockerfile + single lockfile, built via the
          # CUDA builder stage (torch +cu130). Distinct image name so its digest keys a
          # separate global.imageDigests entry; only values.prod.yaml points ml-compute
          # at it, keeping local/staging on the CPU ml-compute-service image.
          - { name: ml-compute-service-gpu, dockerfile: backend/services/ml-compute-service/Dockerfile, build_args: ML_COMPUTE_BUILDER=sync-gpu, lockfile: uv.lock }
          - { name: sys-tick-job, dockerfile: backend/jobs/sys-tick-job/Dockerfile, lockfile: uv.lock }
          - { name: snapshot-refresh-job, dockerfile: backend/jobs/snapshot-refresh-job/Dockerfile, lockfile: uv.lock }
          - { name: qdrant-init, dockerfile: infra/shared/qdrant-init/Dockerfile, lockfile: uv.lock }
          - { name: kafka-connect, context: infra/k8s/kafka-connect, dockerfile: infra/k8s/kafka-connect/Dockerfile, lockfile: infra/k8s/kafka-connect/smt/build.gradle.kts }
    timeout-minutes: 16
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.event-validation.outputs.source_sha }}
          persist-credentials: false

      - name: Verify checked-out source
        env:
          SOURCE_SHA: ${{ needs.event-validation.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]

      - name: Reclaim runner disk for GPU image
        if: matrix.name == 'ml-compute-service-gpu'
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Determine push mode
        id: mode
        env:
          SHOULD_PUSH: ${{ needs.event-validation.outputs.should_push }}
        run: |
          set -euo pipefail
          [[ "$SHOULD_PUSH" == "true" || "$SHOULD_PUSH" == "false" ]]
          echo "push=$SHOULD_PUSH" >> "$GITHUB_OUTPUT"

      - name: Set image base path (lowercase repository)
        id: image-base-path
        run: |
          # Image name format: ghcr.io/OWNER/MONOREPO_NAME/SERVICE_NAME
          imageBasePath="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image_base_path=$imageBasePath" >> "$GITHUB_OUTPUT"

      - name: Log into GitHub Container Registry
        if: steps.mode.outputs.push == 'true' || matrix.name == 'ml-compute-service-gpu'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare container metadata for ${{ matrix.name }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ steps.image-base-path.outputs.image_base_path }}/${{ matrix.name }}
          tags: |
            type=raw,value=sha-${{ needs.event-validation.outputs.short_source_sha }},enable=true
            type=raw,value=latest,enable={{is_default_branch}}
            ${{ needs.event-validation.outputs.image_tags_metadata_string }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build container image for ${{ matrix.name }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: ${{ matrix.context || '.' }} # Most images require the monorepo workspace; Kafka Connect is self-contained.
          file: ./${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: ${{ steps.mode.outputs.push == 'true' }}
          load: ${{ steps.mode.outputs.push != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ matrix.name == 'ml-compute-service-gpu' && format('type=registry,ref={0}/{1}:buildcache-{2}', steps.image-base-path.outputs.image_base_path, matrix.name, hashFiles(matrix.dockerfile, matrix.lockfile)) || format('type=gha,scope={0}-{1}', matrix.name, hashFiles(matrix.dockerfile, matrix.lockfile)) }}
          # GPU registry cache is global: import always, export only on authorized pushes.
          cache-to: ${{ matrix.name == 'ml-compute-service-gpu' && (steps.mode.outputs.push == 'true' && format('type=registry,ref={0}/{1}:buildcache-{2},mode=max', steps.image-base-path.outputs.image_base_path, matrix.name, hashFiles(matrix.dockerfile, matrix.lockfile)) || '') || format('type=gha,mode=max,scope={0}-{1}', matrix.name, hashFiles(matrix.dockerfile, matrix.lockfile)) }}
          platforms: linux/amd64
          provenance: ${{ steps.mode.outputs.push == 'true' }}

      - name: Capture pushed image digest
        id: capture-digest
        if: steps.mode.outputs.push == 'true'
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_REF: ${{ steps.image-base-path.outputs.image_base_path }}/${{ matrix.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ needs.event-validation.outputs.source_sha }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/ci/image_digests.py record --output "digest-records/${IMAGE_NAME}.json"

      - name: Upload pushed image digest
        id: upload-digest
        if: steps.mode.outputs.push == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.name }}
          path: digest-records/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Reclaim build cache before scan
        run: docker buildx prune --all --force

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DISABLE_TELEMETRY: "true"
          TRIVY_SKIP_VERSION_CHECK: "true"
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-results-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: trivy-results-${{ matrix.name }}
          path: trivy-results-${{ matrix.name }}.sarif
          if-no-files-found: error
          retention-days: 30

  aggregate-digests:
    needs: [ event-validation, build-push ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      DIGESTS_ENABLED: >-
        ${{
          needs.event-validation.outputs.authorized == 'true' &&
          needs.build-push.result == 'success' &&
          (github.event_name != 'workflow_dispatch' || github.event.inputs.push_to_registry == 'true')
        }}
      PROPOSAL_ENABLED: >-
        ${{
          github.event_name == 'workflow_run' &&
          needs.event-validation.outputs.authorized == 'true' &&
          needs.build-push.result == 'success'
        }}
    steps:
      # GitHub Actions has no workflow timeout; block mutations after pathological delay.
      - name: Assert whole-workflow wall budget before digest mutation
        if: env.DIGESTS_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          run_started_at="$(
            gh api \
              --method GET \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --jq '.run_started_at'
          )"
          run_started_epoch="$(date -u --date="$run_started_at" +%s)"
          elapsed_seconds="$(($(date -u +%s) - run_started_epoch))"
          echo "Build-push workflow wall at mutation entry: ${elapsed_seconds}s"

          if (( elapsed_seconds >= 1140 )); then
            echo "Build-push workflow wall reached the 19-minute assertion ceiling before digest mutation." >&2
            exit 1
          fi

      - name: Checkout source
        if: env.DIGESTS_ENABLED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.event-validation.outputs.source_sha }}
          persist-credentials: false

      - name: Download image digest records
        if: env.DIGESTS_ENABLED == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-*
          path: digest-records
          merge-multiple: true

      - name: Assemble and validate production digests
        if: env.DIGESTS_ENABLED == 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/ci/image_digests.py assemble --records digest-records --repository "$GITHUB_REPOSITORY" --output infra/k8s/helm/values.prod.digests.yaml

      - name: Upload aggregate production digests
        if: env.DIGESTS_ENABLED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-image-digests
          path: infra/k8s/helm/values.prod.digests.yaml
          if-no-files-found: error
          retention-days: 30

      - name: Verify production digest overlay path
        if: env.PROPOSAL_ENABLED == 'true'
        run: test -s infra/k8s/helm/values.prod.digests.yaml

      - name: Create or update digest PR
        if: env.PROPOSAL_ENABLED == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: bot/update-production-image-digests
          base: main
          add-paths: infra/k8s/helm/values.prod.digests.yaml
          commit-message: 'chore(deploy): update production image digests'
          title: 'chore(deploy): update production image digests'
          body: |
            Automated immutable first-party image digests from a successful main build.

            Source revision: `${{ needs.event-validation.outputs.source_sha }}`
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Review and merge this generated overlay to promote the images.
          delete-branch: true

      - name: Summarize workflow wall and billable time
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          run_json="$(
            gh api \
              --method GET \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          )"
          jobs_json="$(
            gh api \
              --method GET \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=latest&per_page=100"
          )"
          run_started_at="$(jq -r '.run_started_at' <<< "$run_json")"
          run_started_epoch="$(date -u --date="$run_started_at" +%s)"
          observed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          observed_epoch="$(date -u --date="$observed_at" +%s)"
          workflow_wall_seconds="$((observed_epoch - run_started_epoch))"
          rows_file="${RUNNER_TEMP}/build-push-job-timings.md"
          : > "$rows_file"
          billable_total=0

          while IFS=$'\t' read -r name started_at completed_at conclusion status; do
            completed_for_duration="$completed_at"
            completed_display="$completed_at"
            conclusion_display="$conclusion"
            if [[ "$completed_at" == "pending" ]]; then
              completed_for_duration="$observed_at"
              completed_display="${observed_at} (observed)"
              conclusion_display="$FINAL_JOB_STATUS"
            fi
            if [[ "$conclusion_display" == "pending" ]]; then
              conclusion_display="$status"
            fi

            started_epoch="$(date -u --date="$started_at" +%s)"
            completed_epoch="$(date -u --date="$completed_for_duration" +%s)"
            duration_seconds="$((completed_epoch - started_epoch))"
            billable_minutes="$(((duration_seconds + 59) / 60))"
            billable_total="$((billable_total + billable_minutes))"
            printf '| %s | %s | %s | %s | %ss | %sm |\n' \
              "$name" "$started_at" "$completed_display" "$conclusion_display" \
              "$duration_seconds" "$billable_minutes" >> "$rows_file"
          done < <(
            jq -r \
              '.jobs[] | [.name, .started_at, (.completed_at // "pending"), (.conclusion // "pending"), .status] | @tsv' \
              <<< "$jobs_json"
          )

          ratio="$(
            jq -nr \
              --argjson billable "$billable_total" \
              --argjson wall "$workflow_wall_seconds" \
              'if $wall > 0 then ($billable * 60 / $wall) else 0 end'
          )"
          ratio="$(printf '%.3f' "$ratio")"

          {
            echo "### Build-push workflow timing"
            echo
            echo "| Job | Started (UTC) | Completed (UTC) | Conclusion | Duration | Rounded billable |"
            echo "|---|---|---|---|---:|---:|"
            cat "$rows_file"
            echo
            echo "- Workflow wall: ${workflow_wall_seconds}s"
            echo "- Rounded billable total: ${billable_total}m"
            echo "- R = B/W: ${ratio}"
            echo
            echo "_The final job is measured through summary emission; GitHub records its completion afterward._"
          } >> "$GITHUB_STEP_SUMMARY"
