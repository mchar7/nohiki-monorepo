name: Digest freshness

on:
  schedule:
    # Weekly; catches registry-side GC of pinned base manifests while a fix
    # is still cheap instead of inside a release build.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digest-freshness
  cancel-in-progress: false

jobs:
  probe:
    name: Probe pinned base digests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write

    steps:
      - name: Start job timing
        id: timing
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      - name: Cache nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 4G

      - name: Cache uv downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache workspace virtual environment
        id: venv-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', '**/pyproject.toml', '.python-version', 'flake.nix', 'flake.lock') }}

      - name: Install workspace (all packages + extras)
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          # shellcheck disable=SC2016 # $(command -v python) must expand inside the nix shell, not here
          nix develop .#ci --command bash -euc '
            export UV_PYTHON="$(command -v python)"
            uv sync --all-packages --all-extras --no-extra cuda --locked
          '

      - name: Start unique work timing
        id: unique
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Probe pinned digests
        id: probe
        run: nix develop .#ci --command uv run --no-sync ci-checks image-freshness

      - name: Open or update rot issue
        if: failure() && steps.probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Pinned base-image digest no longer resolves"
          body="Scheduled probe run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} found at least one dead pinned base digest. Repin via a protected PR before the next image build."
          existing=$(gh issue list --repo "${{ github.repository }}" --label digest-rot --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh label create digest-rot --repo "${{ github.repository }}" --force --color B60205 --description "Pinned base-image digest vanished upstream"
            gh issue create --repo "${{ github.repository }}" --title "$title" --label digest-rot --body "$body"
          fi

      - name: Report probe and workflow accounting
        if: always()
        env:
          CACHE_HIT: ${{ steps.venv-cache.outputs.cache-hit }}
          GH_TOKEN: ${{ github.token }}
          JOB_STARTED: ${{ steps.timing.outputs.started }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          UNIQUE_STARTED: ${{ steps.unique.outputs.started || steps.timing.outputs.started }}
        run: |
          now_iso="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          observed_epoch="$(date -u -d "$now_iso" +%s)"
          run="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          run_started="$(jq -r '.run_started_at' <<< "$run")"
          wall_seconds=$((observed_epoch - $(date -u -d "$run_started" +%s)))
          pages="$(gh api --paginate --slurp "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100")"
          jobs="$(jq -c '[.[] | .jobs[] | select(.started_at != null)]' <<< "$pages")"
          billable_minutes="$(jq --arg now "$now_iso" '
            [.[]
              | (((.completed_at // $now) | fromdateiso8601) - (.started_at | fromdateiso8601))
              | (. / 60 | ceil)
            ] | add // 0
          ' <<< "$jobs")"
          ratio="$(jq -nr --argjson billable "$billable_minutes" --argjson wall "$wall_seconds" '
            if $wall == 0 then 0 else ($billable * 60 / $wall) end
          ')"
          {
            echo "### Digest freshness workflow accounting"
            echo
            echo "| Job | Exact seconds | Rounded billable minutes | Conclusion |"
            echo "|---|---:|---:|---|"
            jq -r --arg now "$now_iso" '
              .[] |
              (((.completed_at // $now) | fromdateiso8601) - (.started_at | fromdateiso8601)) as $seconds |
              "| \(.name) | \($seconds) | \(($seconds / 60) | ceil) | \(.conclusion // \"in_progress\") |"
            ' <<< "$jobs"
            echo
            echo "- run_id=$RUN_ID"
            echo "- wall_seconds=$wall_seconds"
            echo "- reconstructed_billable_minutes=$billable_minutes"
            echo "- R=$ratio"
            echo "- cache_hit=${CACHE_HIT:-unknown}"
            echo "- setup_seconds=$((UNIQUE_STARTED - JOB_STARTED))"
            echo "- unique_work_seconds=$((observed_epoch - UNIQUE_STARTED))"
            echo "- command_inventory=ci-checks image-freshness; digest rot issue synchronization; jobs API accounting aggregation"
          } >> "$GITHUB_STEP_SUMMARY"
