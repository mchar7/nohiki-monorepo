name: Renovate

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      log_level:
        description: Renovate log level; debug exposes dependency-lookup and abandonment detail the dashboard truncates
        type: choice
        default: info
        options: [info, debug]

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: nohiki-monorepo

      # The first live run verifies Action grouping because tokenless local lookup cannot.
      - uses: renovatebot/github-action@1a96852b0384df1837619d04c60b2d10d1f9ff08 # v46.1.21
        with:
          configurationFile: .github/renovate.json5
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          RENOVATE_GITHUB_COM_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_USE_CLOUD_METADATA_SERVICES: "false"
          OTEL_NODE_RESOURCE_DETECTORS: "none"
          OTEL_EXPORTER_OTLP_ENDPOINT: ""
          RENOVATE_MERGE_CONFIDENCE_DATASOURCES: "[]"
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
