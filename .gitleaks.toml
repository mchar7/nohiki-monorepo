# Gitleaks configuration for Nohiki Monorepo
# https://github.com/gitleaks/gitleaks
#
# NOTE: gitleaks protect --staged automatically skips gitignored files.
# Do NOT duplicate gitignore patterns here.

title = "Nohiki Gitleaks Config"

[extend]
useDefault = true

# ADDITIONAL RULES: Project-specific API key patterns

[[rules]]
id = "openrouter-api-key"
description = "OpenRouter API Key"
regex = '''sk-or-v1-[a-zA-Z0-9]{64}'''
keywords = ["sk-or-v1"]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API Key"
regex = '''sk-ant-api[a-zA-Z0-9\-_]{90,}'''
keywords = ["sk-ant-api"]

# Public Gateway API bundle digests are SHA-256 checksums, not credentials.
# Scope this to the exact checksum declarations and the default rule that misclassifies them.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Allow the public Gateway API bundle digest in its checksum-owner tests"
condition = "AND"
regexTarget = "line"
regexes = [
    '''_GATEWAY_API_(?:BUNDLE_)?EXPECTED_HEX\s*=\s*"[0-9a-f]{64}"''',
]
paths = [
    '''^scripts/ci/tests/test_(?:declarative_foundation|gateway_sse_route|workflow_download_checksums)\.py$''',
]

# ALLOWLIST: Exact public release digest only
[allowlist]
regexes = [
    '''^3e7a27e4456ff3d68606a6a8516306aaff354d6f0950b32bb31930669b7bf8b8$''',
]
