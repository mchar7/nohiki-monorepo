sonar.projectKey=nohiki-monorepo
sonar.projectName=Nohiki Monorepo
sonar.sources=backend
sonar.exclusions=**/alembic/**,**/__pycache__/**,**/tests/**,**/*.egg-info/**,**/*.html,.vulture_allowlist.py,**/nohiki-domain-models/**
sonar.python.version=3.13
sonar.sourceEncoding=UTF-8
sonar.host.url=http://localhost:9000
# Token should be provided via SONAR_TOKEN environment variable or -Dsonar.token CLI argument

# Disable rules that produce false positives or style preferences
# S7497: CancelledError re-raise - not needed in shutdown handlers
# S7503: Async without await - intentional for interface consistency
# S5869: Regex duplicates - false positive for Unicode ranges
# S3516: Always returns same value - false positive for validation functions that return input or raise
# S6796: TypeVar vs generic type parameter - style preference, TypeVar is still valid Python
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S7497
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.e4.ruleKey=python:S3516
sonar.issue.ignore.multicriteria.e4.resourceKey=**/errors.py
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S5869
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.e5.ruleKey=python:S6796
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*.py

# Test-specific rule relaxation:
# S1186: Empty methods in abstract base classes and test stubs are intentional