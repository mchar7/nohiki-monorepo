  nohiki-vol-phoenix:
  nohiki-vol-tei-models:
  ml-model-cache:
  nohiki-vol-secret-database:
  nohiki-vol-secret-redis:
  nohiki-vol-secret-s3:
  nohiki-vol-secret-jwt:
  nohiki-vol-secret-oauth:
  nohiki-vol-secret-jsearch:
  nohiki-vol-secret-llm:
  nohiki-vol-secret-email:
  nohiki-vol-secret-qdrant:
