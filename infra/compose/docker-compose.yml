      USER_UPLOAD_KAFKA__CONSUMER_GROUP: user-upload-service-consumer
      USER_UPLOAD_S3__ENDPOINT: http://nohiki-infra-rustfs:9000
      USER_UPLOAD_S3__BUCKET: nohiki-attachments
      USER_UPLOAD_S3__REGION: us-east-1
    depends_on:
