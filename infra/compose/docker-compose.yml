  # MLOps infrastructure (nohiki-mlops-*)

  nohiki-mlops-mlflow:
    <<: *common-infrastructure
    image: ghcr.io/mlflow/mlflow:v3.14.0-full@sha256:73365f742d67ef9e59e50118010bf14ff825a157c8244051baea887b8587e772
    ports:
      - "${NOHIKI_HOST_IP:-127.0.0.1}:${NOHIKI_PORT_MLFLOW:-5000}:5000"
    volumes:
      - nohiki-vol-postgres-service-secrets:/run/secrets/postgres-services:ro
      - *vol-s3-mlflow
    environment:
      # RustFS artifact store (S3-compatible)
      MLFLOW_ARTIFACTS_DESTINATION: s3://nohiki-mlflow-artifacts
      MLFLOW_S3_ENDPOINT_URL: http://nohiki-infra-rustfs:9000
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export AWS_ACCESS_KEY_ID="$$(cat /run/secrets/s3/access_key)"
        export AWS_SECRET_ACCESS_KEY="$$(cat /run/secrets/s3/secret_key)"
        DB_PASSWORD="$$(python -c 'from pathlib import Path; from urllib.parse import quote; print(quote(Path("/run/secrets/postgres-services/mlflow_password").read_text(), safe=""))')"
        exec mlflow server \
          --host 0.0.0.0 \
          --port 5000 \
          --backend-store-uri "postgresql://mlflow:$${DB_PASSWORD}@nohiki-infra-postgres:5432/mlflow" \
          --default-artifact-root s3://nohiki-mlflow-artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=2)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      <<: *depends-on-secrets
      nohiki-infra-postgres-init:
        condition: service_completed_successfully
      nohiki-infra-rustfs-init:
        condition: service_completed_successfully
    profiles:
      - mlops

  # Observability (nohiki-obs-*)

  nohiki-obs-loki:
    <<: *common-infrastructure
    image: docker.io/grafana/loki:3.7.3@sha256:70b9f699fc9bb868b62f1cfd4f787dfa50242f1fd92e6089787d5d7daea75fe8
    ports:
      - "${NOHIKI_HOST_IP:-127.0.0.1}:${NOHIKI_PORT_LOKI:-3100}:3100"
    command: -config.file=/etc/loki/local-config.yaml
    # Shellless image; readiness is checked by nohiki-obs-readiness.
    volumes:
      - ./observability/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - nohiki-vol-loki:/loki
    profiles:
      - observability

  nohiki-obs-tempo:
    <<: *common-infrastructure
    image: docker.io/grafana/tempo:3.0.2@sha256:cda87c212d8c584dc0b89e337e7ed648a5100feb657e5d528480ee4fa03dbbe3
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "${NOHIKI_HOST_IP:-127.0.0.1}:${NOHIKI_PORT_TEMPO:-3200}:3200"
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - nohiki-vol-tempo:/var/tempo
    profiles:
      - observability

  nohiki-obs-mimir:
    <<: *common-infrastructure
    image: docker.io/grafana/mimir:3.1.3@sha256:c906a6fc334ba401b901230b34f660cb1bb1818ef1b169d90e7e4033b97c4f59
    command: ["-config.file=/etc/mimir/mimir.yaml", "-target=all"]
    ports:
      - "${NOHIKI_HOST_IP:-127.0.0.1}:${NOHIKI_PORT_MIMIR:-9009}:9009"
    volumes:
      - ./observability/mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro
      - nohiki-vol-mimir:/data
    profiles:
      - observability

  nohiki-obs-pyroscope:
    <<: *common-infrastructure
    image: docker.io/grafana/pyroscope:2.1.1@sha256:c8ad9891fc8562c794c946883c8324b7e48f4eda58d243387c7b6254f9f061fb
    ports:
      - "${NOHIKI_HOST_IP:-127.0.0.1}:${NOHIKI_PORT_PYROSCOPE:-4040}:4040"
    command:
      - "server"
    environment:
      - PYROSCOPE_LOG_LEVEL=debug
    volumes:
      - nohiki-vol-pyroscope:/var/lib/pyroscope
    profiles:
      - observability

  nohiki-obs-otel-collector:
    <<: *common-infrastructure
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.156.0@sha256:125bdbeb7590cc1952c5b3430ecf14063568980c2c93d5b38676cc0446ed8108
    ports:
      - "${NOHIKI_HOST_IP:-127.0.0.1}:${NOHIKI_PORT_OTEL_GRPC:-4317}:4317"
      - "${NOHIKI_HOST_IP:-127.0.0.1}:${NOHIKI_PORT_OTEL_HTTP:-4318}:4318"
      - "${NOHIKI_HOST_IP:-127.0.0.1}:${NOHIKI_PORT_OTEL_PROM:-8889}:8889"
      - "${NOHIKI_HOST_IP:-127.0.0.1}:${NOHIKI_PORT_OTEL_HEALTH:-13133}:13133"
    volumes:
      - ./observability/otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    profiles:
      - observability

  nohiki-obs-phoenix:
    <<: *common-infrastructure
    image: docker.io/arizephoenix/phoenix:19.2.0@sha256:e90f05fc04d7507a948128ddd701d89ad1816a1b6fcccfb9feebd0f77d5e86a3
    ports:
      - "${NOHIKI_HOST_IP:-127.0.0.1}:${NOHIKI_PORT_PHOENIX_UI:-6006}:6006"
      - "${NOHIKI_HOST_IP:-127.0.0.1}:${NOHIKI_PORT_PHOENIX_OTLP:-4320}:4317"
    environment:
      - PHOENIX_WORKING_DIR=/phoenix
      - PHOENIX_ENABLE_AUTH=false
    volumes:
      - nohiki-vol-postgres-service-secrets:/run/secrets/postgres-services:ro
      - nohiki-vol-phoenix:/phoenix
    entrypoint: ["/usr/bin/python3.13", "-c"]
    command:
      - |
        import os
        from pathlib import Path
        from urllib.parse import quote

        password = quote(Path("/run/secrets/postgres-services/phoenix_password").read_text(), safe="")
        os.environ["PHOENIX_SQL_DATABASE_URL"] = (
            f"postgresql://phoenix:{password}@nohiki-infra-postgres:5432/phoenix"
        )
        os.execv(
            "/usr/bin/python3.13",
            ["python3.13", "-m", "phoenix.server.main", "serve"],
        )
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006/healthz', timeout=2)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      <<: *depends-on-secrets
      nohiki-infra-postgres-init:
        condition: service_completed_successfully
    profiles:
      - observability
      - llm-observability

  nohiki-obs-prometheus:
    <<: *common-infrastructure
    image: quay.io/prometheus/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    ports:
      - "${NOHIKI_HOST_IP:-127.0.0.1}:${NOHIKI_PORT_PROMETHEUS:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - nohiki-vol-prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - nohiki-obs-otel-collector
    profiles:
      - observability

  nohiki-obs-readiness:
    <<: *common-infrastructure
    image: docker.io/curlimages/curl:8.21.0@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
    entrypoint: ["sleep"]
    command: ["2147483647"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error --max-time 5 http://nohiki-obs-loki:3100/ready >/dev/null &&
          curl --fail --silent --show-error --max-time 5 http://nohiki-obs-tempo:3200/ready >/dev/null &&
          curl --fail --silent --show-error --max-time 5 http://nohiki-obs-mimir:9009/ready >/dev/null
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    depends_on:
      nohiki-obs-loki: {condition: service_started}
      nohiki-obs-tempo: {condition: service_started}
      nohiki-obs-mimir: {condition: service_started}
    profiles:
      - observability

  nohiki-obs-grafana:
    <<: *common-infrastructure
    image: docker.io/grafana/grafana:13.1.0@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
    ports:
      - "${NOHIKI_HOST_IP:-127.0.0.1}:${NOHIKI_PORT_GRAFANA:-3001}:3000"
    environment:
      # DEV ONLY: production overrides via SOPS-encrypted values; Grafana is observability-only on local.
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_DEFAULT_THEME=dark
      - GF_USERS_HOME_PAGE=dashboard
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_UID=nohiki-overview
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      # Dashboard JSONs above are symlinks into infra/shared/dashboards (single source of truth); they resolve to /shared/dashboards in-container
      - ../shared/dashboards:/shared/dashboards:ro
      - nohiki-vol-grafana:/var/lib/grafana
    depends_on:
      nohiki-obs-prometheus: {condition: service_healthy}
      nohiki-obs-readiness: {condition: service_healthy}
      nohiki-obs-pyroscope: {condition: service_started}
    profiles:
      - observability

# Networks

networks:
  nohiki-network:
