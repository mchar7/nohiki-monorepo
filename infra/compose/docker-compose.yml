  nohiki-svc-doc-process:
    <<: *common-microservice
    build: {context: ../../, dockerfile: backend/services/doc-process-service/Dockerfile}
    image: doc-process-service:latest
    volumes: [*vol-redis, *vol-s3]
    environment:
