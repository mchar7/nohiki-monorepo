      USER_PREF_QDRANT__HOST: nohiki-infra-qdrant
      USER_PREF_QDRANT__GRPC_PORT: "6334"
      USER_PREF_QDRANT__USE_TLS: "false"
    depends_on:
      <<: *depends-on-secrets
