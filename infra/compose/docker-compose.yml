      ENVIRONMENT: development
      SERVICE_NAME: doc-process-service
      DOC_PROCESS_KAFKA__DSN: kafka://nohiki-cp-kafka:29092
      DOC_PROCESS_KAFKA__CONSUMER_GROUP: doc-process-service-consumer
      DOC_PROCESS_S3__ENDPOINT: http://nohiki-infra-rustfs:9000
      DOC_PROCESS_S3__BUCKET: nohiki-attachments
      DOC_PROCESS_S3__REGION: us-east-1
      DOC_PROCESS_DOCLING__BASE_URL: http://nohiki-infra-docling:5001
    depends_on:
      <<: *depends-on-secrets
      nohiki-cp-kafka-init: {condition: service_completed_successfully}
      nohiki-infra-valkey: {condition: service_healthy}
      nohiki-infra-rustfs-init: {condition: service_completed_successfully}
      nohiki-infra-docling: {condition: service_healthy}

  nohiki-svc-notification:
    <<: *common-microservice
    build: {context: ../../, dockerfile: backend/services/notification-service/Dockerfile}
    image: notification-service:latest
    volumes:
      - *vol-database
      - *vol-redis
      - *vol-email
    environment:
      <<: *observability-env
      ENVIRONMENT: development
      SERVICE_NAME: notification-service
      NOTIFICATION_DATABASE__SCHEMA_NAME: notification_schema
      NOTIFICATION_KAFKA__DSN: kafka://nohiki-cp-kafka:29092
      NOTIFICATION_KAFKA__CONSUMER_GROUP: notification-service-consumer
    depends_on:
      <<: *depends-on-secrets
      nohiki-infra-postgres: {condition: service_healthy}
      nohiki-infra-valkey: {condition: service_healthy}
      nohiki-cp-kafka-init: {condition: service_completed_successfully}

  nohiki-svc-ml-gateway:
    <<: *common-microservice
    build: {context: ../../, dockerfile: backend/services/ml-gateway-service/Dockerfile}
    image: ml-gateway-service:latest
    volumes: [*vol-redis]
    environment:
      <<: *observability-env
      ENVIRONMENT: development
      SERVICE_NAME: ml-gateway-service
      ML_GATEWAY_KAFKA__DSN: kafka://nohiki-cp-kafka:29092
      ML_GATEWAY_KAFKA__CONSUMER_GROUP: ml-gateway-service-consumer
    depends_on:
      <<: *depends-on-secrets
      nohiki-cp-kafka-init: {condition: service_completed_successfully}
      nohiki-infra-valkey: {condition: service_healthy}
    labels: ["traefik.enable=false"]

  nohiki-svc-ml-compute:
    <<: *common-microservice
    build: {context: ../../, dockerfile: backend/services/ml-compute-service/Dockerfile}
    image: ml-compute-service:latest
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=2)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s
    volumes:
      - *vol-redis
      - *vol-s3
      - ../../data/config/semantic_representation_manifest.json:/app/data/config/semantic_representation_manifest.json:ro
      - ml-model-cache:/home/app/.cache
    environment:
      <<: *observability-env
      ENVIRONMENT: development
      SERVICE_NAME: ml-compute-service
      ML_COMPUTE_KAFKA__DSN: kafka://nohiki-cp-kafka:29092
      ML_COMPUTE_KAFKA__CONSUMER_GROUP: ml-compute-service-consumer
      ML_COMPUTE_KAFKA__CONSUMER__SESSION_TIMEOUT_MS: "120000"
      ML_COMPUTE_KAFKA__CONSUMER__HEARTBEAT_INTERVAL_MS: "10000"
      ML_COMPUTE_KAFKA__CONSUMER__MAX_POLL_INTERVAL_MS: "600000"
      ML_COMPUTE_S3__ENDPOINT: http://nohiki-infra-rustfs:9000
      ML_COMPUTE_S3__BUCKET: nohiki-ml-artifacts
      ML_COMPUTE_S3__REGION: us-east-1
      S3_ENDPOINT: http://nohiki-infra-rustfs:9000
      S3_BUCKET: nohiki-ml-artifacts
      S3_REGION: us-east-1
      FASTEMBED_CACHE_PATH: /home/app/.cache/fastembed
      HF_HOME: /home/app/.cache/huggingface
      ML_COMPUTE_REDIS__DSN: redis://nohiki-infra-valkey:6379
    depends_on:
      <<: *depends-on-secrets
      nohiki-cp-kafka-init: {condition: service_completed_successfully}
      nohiki-infra-valkey: {condition: service_healthy}
      nohiki-infra-rustfs-init: {condition: service_completed_successfully}
    labels: ["traefik.enable=false"]

  # Jobs (nohiki-job-*)

  nohiki-job-schedule-tick:
    <<: *common-infrastructure
    build: {context: ../../, dockerfile: backend/jobs/sys-tick-job/Dockerfile}
    image: sys-tick-job:latest
    entrypoint: ["supercronic", "-json", "-passthrough-logs", "/etc/crontab"]
    volumes:
      - ./crontabs/schedule-tick.crontab:/etc/crontab:ro
    environment:
      KAFKA_BOOTSTRAP_SERVERS: nohiki-cp-kafka:29092
      SCHEDULE_TICK_SOURCE_SERVICE: sys-tick-compose
      SCHEDULE_TICK_BATCH_LIMIT: "0"
    depends_on:
      nohiki-cp-kafka-init: {condition: service_completed_successfully}

  nohiki-job-snapshot-refresh:
    <<: *common-infrastructure
    build: {context: ../../, dockerfile: backend/jobs/snapshot-refresh-job/Dockerfile}
    image: snapshot-refresh-job:latest
    environment:
      KAFKA_BOOTSTRAP_SERVERS: nohiki-cp-kafka:29092
      REFRESH_TOPIC: job-listing.cmd.snapshot-refresh-requested.v1
      REFRESH_REASON: "manual trigger"
    depends_on:
      nohiki-cp-kafka-init: {condition: service_completed_successfully}
    restart: "no"
    profiles:
      - tools

  nohiki-job-skill-graph-seed:
    <<: *common-infrastructure
    build: {context: ../../, dockerfile: backend/services/skill-graph-service/Dockerfile}
    image: skill-graph-service:latest
    entrypoint: ["python", "-m", "skill_graph_service.seeding.cli"]
    volumes:
      - *vol-database
      - ../../data/tabiya:/data/tabiya:ro
      - ../../data/config/semantic_representation_manifest.json:/app/data/config/semantic_representation_manifest.json:ro
    environment:
      <<: *observability-env
      ENVIRONMENT: development
      SERVICE_NAME: bootstrap-skill-graph
      SKILL_GRAPH_DATABASE__SCHEMA_NAME: skill_graph_schema
      SKILL_GRAPH_DATABASE__MIGRATE_ON_STARTUP: "false"
      SKILL_GRAPH_KAFKA__DSN: kafka://nohiki-cp-kafka:29092
      SKILL_GRAPH_KAFKA__CONSUMER_GROUP: bootstrap-skill-graph
      SKILL_GRAPH_QDRANT__HOST: nohiki-infra-qdrant
      SKILL_GRAPH_QDRANT__GRPC_PORT: "6334"
      SKILL_GRAPH_QDRANT__USE_TLS: "false"
      TABIYA_SKILLS_CSV: /data/tabiya/skills.csv
      TABIYA_SOURCE_VERSION: "1.1.1"
      TABIYA_RELATIONSHIPS_CSV: /data/tabiya/skill_skill_relations.csv
      TABIYA_OCCUPATION_SKILLS_CSV: /data/tabiya/occupation_skill_relations.csv
      TABIYA_OCCUPATIONS_CSV: /data/tabiya/occupations.csv
      TABIYA_SKILL_GROUPS_CSV: /data/tabiya/skillGroups.csv
      TABIYA_SKILLS_HIERARCHY_CSV: /data/tabiya/skills_hierarchy.csv
    depends_on:
      <<: *depends-on-secrets
      nohiki-infra-postgres: {condition: service_healthy}
      nohiki-cp-kafka-init: {condition: service_completed_successfully}
      nohiki-infra-qdrant: {condition: service_healthy}
    restart: "no"

  # Infrastructure (nohiki-infra-*)

  nohiki-infra-gotenberg:
    <<: *common-infrastructure
    image: docker.io/gotenberg/gotenberg:8.34.0@sha256:67097317623a503ba2a6a7e9ae8db6929a1f7e1bbd88077bacf2d325fbdab923
    hostname: nohiki-infra-gotenberg
    # Keep Chromium warm between requests; cold-start latency on the screenshot
    # endpoint causes concurrent requests to exceed Gotenberg's 30s context
    # deadline, producing 503s.
    command:
      - "gotenberg"
      - "--chromium-auto-start=true"
      - "--chromium-restart-after=0"
    ports:
      - "${NOHIKI_HOST_IP:-127.0.0.1}:${NOHIKI_PORT_GOTENBERG:-3000}:3000"  # operates on internal network, but this allows us to use it for things like `scripts/util/tailor`
    networks:
      nohiki-network:
        aliases:
          - gotenberg
          - nohiki-infra-gotenberg
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  nohiki-infra-docling:
    <<: *common-infrastructure
    image: quay.io/docling-project/docling-serve-cpu:v1.27.0@sha256:a70cd391c5d9e7ad23e8d76adffa5e5f03c536b4d1ea007f512c94e0b435ba45
    hostname: nohiki-infra-docling
    ports:
      - "${NOHIKI_HOST_IP:-127.0.0.1}:${NOHIKI_PORT_DOCLING:-5001}:5001"
    networks:
      nohiki-network:
        aliases:
          - docling
          - docling-serve
          - nohiki-infra-docling
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "true"
      DOCLING_SERVE_ALLOW_CUSTOM_PICTURE_DESCRIPTION_CONFIG: "true"
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: "true"
      UVICORN_WORKERS: "2"
      # Telemetry
      DOCLING_SERVE_OTEL_ENABLE_METRICS: "true"
      DOCLING_SERVE_OTEL_ENABLE_TRACES: "true"
      DOCLING_SERVE_OTEL_ENABLE_PROMETHEUS: "true"
      DOCLING_SERVE_OTEL_SERVICE_NAME: "docling-serve"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://nohiki-obs-otel-collector:4317"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/readyz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  nohiki-infra-traefik:
    <<: *common-infrastructure
    image: public.ecr.aws/docker/library/traefik:v3.7.7@sha256:1cb3845d7a05e1473c9086351426597e911db49db382b6e4769f9b0744962ac8
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "${NOHIKI_HOST_IP:-127.0.0.1}:${NOHIKI_PORT_TRAEFIK_HTTP:-8000}:80"
      - "${NOHIKI_HOST_IP:-127.0.0.1}:${NOHIKI_PORT_TRAEFIK_HTTPS:-8443}:443"
      - "${NOHIKI_HOST_IP:-127.0.0.1}:${NOHIKI_PORT_TRAEFIK_DASHBOARD:-8080}:8080"
    volumes:
      - ./traefik:/etc/traefik/dynamic_conf:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nohiki-infra-postgres:
    <<: *common-infrastructure
    image: public.ecr.aws/docker/library/postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    ports:
      - "${NOHIKI_HOST_IP:-127.0.0.1}:${NOHIKI_PORT_POSTGRES:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/database/password
      POSTGRES_DB: nohiki_db
      LANG: en_US.utf8
      LC_ALL: en_US.utf8
    command:
      - postgres
      # I/O concurrency for NVMe/SSD
      - -c
      - effective_io_concurrency=200
      - -c
      - maintenance_io_concurrency=10
      # Parallelism settings
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - max_parallel_workers=8
      - -c
      - max_parallel_maintenance_workers=4
      # WAL settings for logical replication (Debezium CDC)
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=16
      - -c
      - max_wal_senders=16
      # Memory settings
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
    volumes:
      - nohiki-vol-postgres:/var/lib/postgresql
      - *vol-database
    depends_on:
      <<: *depends-on-secrets
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nohiki_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Idempotent bootstrap for both fresh and existing Postgres volumes.
  nohiki-infra-postgres-init:
    <<: *common-infrastructure
    image: public.ecr.aws/docker/library/postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    volumes:
      - *vol-database
      - ./scripts/postgres-init:/bootstrap:ro
      - nohiki-vol-postgres-service-secrets:/run/secrets/postgres-services
    environment:
      PGHOST: nohiki-infra-postgres
      PGUSER: postgres
      PGDATABASE: nohiki_db
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        mkdir -p /run/secrets/postgres-services
        for role in mlflow phoenix; do
          password_file="/run/secrets/postgres-services/$${role}_password"
          if [ ! -s "$${password_file}" ]; then
            od -An -N32 -tx1 /dev/urandom | tr -d ' \n' > "$${password_file}"
          fi
        done
        chmod 0444 /run/secrets/postgres-services/*_password
        export PGPASSWORD="$$(cat /run/secrets/database/password)"
        export MLFLOW_DB_PASSWORD="$$(cat /run/secrets/postgres-services/mlflow_password)"
        export PHOENIX_DB_PASSWORD="$$(cat /run/secrets/postgres-services/phoenix_password)"
        psql --set=ON_ERROR_STOP=1 --file=/bootstrap/01-create-extra-databases.sql
        PGPASSWORD="$${MLFLOW_DB_PASSWORD}" psql --username=mlflow --dbname=mlflow --command='SELECT 1' >/dev/null
        PGPASSWORD="$${PHOENIX_DB_PASSWORD}" psql --username=phoenix --dbname=phoenix --command='SELECT 1' >/dev/null
    depends_on:
      <<: *depends-on-secrets
      nohiki-infra-postgres: {condition: service_healthy}
    restart: "no"

  nohiki-infra-pgadmin:
    <<: *common-infrastructure
    image: docker.io/dpage/pgadmin4:9.16@sha256:40fa840c5bb7c8463957f1255b01283732c2d8c9396a956d180f8e6c296753b3
    environment:
      PGADMIN_DEFAULT_EMAIL: 'admin@admin.com'
      # DEV ONLY: production overrides via SOPS-encrypted values; pgAdmin is gated by `dev` profile.
      PGADMIN_DEFAULT_PASSWORD: 'admin'
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - nohiki-vol-pgadmin:/var/lib/pgadmin
    ports:
      - "${NOHIKI_HOST_IP:-127.0.0.1}:${NOHIKI_PORT_PGADMIN:-5050}:80"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/misc/ping', timeout=2)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      nohiki-infra-postgres:
        condition: service_healthy
    profiles:
      - dev

  # Confluent Platform (nohiki-cp-*)

  nohiki-cp-kafka:
    <<: *common-infrastructure
    image: docker.io/confluentinc/cp-kafka:8.3.0@sha256:c2cedb691aec9963114fb0b4e45fa49a47bb374a89c241c4ecb68a5fc904e5e3
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@nohiki-cp-kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://nohiki-cp-kafka:29092,HOST://localhost:${NOHIKI_PORT_KAFKA:-29092}"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      CLUSTER_ID: GgXxHSpoTUGySgYUR5AZUw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_CONSUMER_SESSION_TIMEOUT_MS: 45000
      KAFKA_GROUP_CONSUMER_HEARTBEAT_INTERVAL_MS: 5000
    ports:
      - "${NOHIKI_HOST_IP:-127.0.0.1}:${NOHIKI_PORT_KAFKA:-29092}:9092"
    volumes:
      - nohiki-vol-kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  nohiki-cp-kafka-init:
    <<: *common-infrastructure
    image: docker.io/confluentinc/cp-kafka:8.3.0@sha256:c2cedb691aec9963114fb0b4e45fa49a47bb374a89c241c4ecb68a5fc904e5e3
    depends_on:
      nohiki-cp-kafka: {condition: service_healthy}
    volumes:
      - ./scripts/kafka-init.sh:/kafka-init.sh:ro
    environment:
      BOOTSTRAP_SERVER: nohiki-cp-kafka:29092
    entrypoint: ["bash", "/kafka-init.sh"]
    restart: "no"

  nohiki-cp-kafka-connect:
    <<: *common-infrastructure
    build: {context: ../k8s/kafka-connect, dockerfile: Dockerfile}
    image: nohiki-kafka-connect:latest
    volumes: [*vol-database, *vol-qdrant]
    environment:
      BOOTSTRAP_SERVERS: nohiki-cp-kafka:29092
      GROUP_ID: nohiki-connect-cluster
      CONFIG_STORAGE_TOPIC: _nohiki_connect_configs
      OFFSET_STORAGE_TOPIC: _nohiki_connect_offsets
      STATUS_STORAGE_TOPIC: _nohiki_connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      LOG_LEVEL: INFO
      SCHEDULED_REBALANCE_MAX_DELAY_MS: "0"
      # Commit offsets every 10s (Connect default 60s). Faster commits shrink the replay
      # window on container restart and keep consumer lag visibly low in steady state.
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: "10000"
    ports:
      - "${NOHIKI_HOST_IP:-127.0.0.1}:${NOHIKI_PORT_KAFKA_CONNECT:-8083}:8083"
    depends_on:
      <<: *depends-on-secrets
      nohiki-cp-kafka-init:
        condition: service_completed_successfully
      nohiki-infra-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:8083/connectors?expand=status' | python3 -c 'import sys,json; d=json.load(sys.stdin); running=[k for k,v in d.items() if v.get(\"status\",{}).get(\"connector\",{}).get(\"state\")==\"RUNNING\"]; exit(0 if len(running)>0 and len(running)==len(d) else 1)'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  nohiki-cp-kafka-ui:
    <<: *common-infrastructure
    image: public.ecr.aws/kafbat/kafka-ui:v1.5.0@sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1
    environment:
      KAFKA_CLUSTERS_0_NAME: nohiki-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: nohiki-cp-kafka:29092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: nohiki-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://nohiki-cp-kafka-connect:8083
      DYNAMIC_CONFIG_ENABLED: true
    ports:
      - "${NOHIKI_HOST_IP:-127.0.0.1}:${NOHIKI_PORT_KAFKA_UI:-8082}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      nohiki-cp-kafka:
        condition: service_healthy
      nohiki-cp-kafka-connect:
        condition: service_healthy
    profiles:
      - dev

  nohiki-infra-valkey:
    <<: *common-infrastructure
    image: docker.io/valkey/valkey:9.1.0-alpine@sha256:c9b77919daeba2c02ad954d0c844cc4e7142069d177b89c5fd771f405daf9e02
    hostname: nohiki-infra-valkey
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - nohiki-vol-valkey:/data
    ports:
      - "${NOHIKI_HOST_IP:-127.0.0.1}:${NOHIKI_PORT_VALKEY:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nohiki-infra-rustfs:
    <<: *common-infrastructure
    # No stable RustFS release exists as of 2026-07-11; beta.8 is the latest upstream release:
    # https://github.com/rustfs/rustfs/releases/tag/1.0.0-beta.8
    image: docker.io/rustfs/rustfs:1.0.0-beta.8@sha256:fa19210ac4697c79d7ccca1ec9b0eb91aebacc6691991ffb14014bb3c67e6cc3
    command: server /data --console-address ":9001"
    env_file:
      # RUSTFS_ROOT_USER / RUSTFS_ROOT_PASSWORD; generated by the setup in
      # infra/shared/secrets/README.md, never tracked
      - ../shared/secrets/s3/rustfs-root.env
    volumes:
      - nohiki-vol-rustfs:/data
    ports:
      - "${NOHIKI_HOST_IP:-127.0.0.1}:${NOHIKI_PORT_RUSTFS_API:-9002}:9000"
      - "${NOHIKI_HOST_IP:-127.0.0.1}:${NOHIKI_PORT_RUSTFS_CONSOLE:-9003}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/ -o /dev/null -w '%{http_code}' | grep -qE '^(200|403)'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nohiki-infra-rustfs-init:
    <<: *common-infrastructure
    image: docker.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      nohiki-infra-rustfs: {condition: service_healthy}
    volumes:
      - ./rustfs-policies:/policies:ro
      - ./scripts/rustfs-init.sh:/rustfs-init.sh:ro
    environment:
      RUSTFS_HOST: nohiki-infra-rustfs
      RUSTFS_PORT: "9000"
      POLICIES_DIR: /policies
    env_file:
      - ../shared/secrets/s3/rustfs-root.env
    entrypoint: ["sh", "/rustfs-init.sh"]
    restart: "no"

  nohiki-infra-qdrant:
    <<: *common-infrastructure
    image: ghcr.io/qdrant/qdrant/qdrant:v1.18.3-unprivileged@sha256:baf54c666825f6834a94facc5def76524d978212cbfc69b21dce9f32df386167
    ports:
      - "${NOHIKI_HOST_IP:-127.0.0.1}:${NOHIKI_PORT_QDRANT_REST:-6333}:6333"   # REST API
      - "${NOHIKI_HOST_IP:-127.0.0.1}:${NOHIKI_PORT_QDRANT_GRPC:-6334}:6334"   # gRPC API
    volumes:
      - nohiki-vol-qdrant:/qdrant/storage
    environment:
      - QDRANT__LOG_LEVEL=INFO
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nohiki-infra-qdrant-init:
    <<: *common-infrastructure
    build:
      context: ../../
      dockerfile: infra/shared/qdrant-init/Dockerfile
    image: qdrant-init:latest
    volumes:
      - ../../data/config/semantic_representation_manifest.json:/config/semantic_representation_manifest.json:ro
    environment:
      QDRANT_URL: http://nohiki-infra-qdrant:6333
      MANIFEST_PATH: /config/semantic_representation_manifest.json
    command: ["init", "--manifest", "/config/semantic_representation_manifest.json", "--qdrant-url", "http://nohiki-infra-qdrant:6333", "--wait"]
    depends_on:
      nohiki-infra-qdrant: {condition: service_healthy}
    restart: "no"

