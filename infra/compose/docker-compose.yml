# Nohiki Docker Compose. Secrets live as files under ../shared/secrets/ (see
# infra/shared/secrets/README.md); schema differentiation via DATABASE__SCHEMA.

# YAML anchors

x-llm-provider-endpoints:
  NOHIKI_LLM_OPENAI_BASE_URL: "${NOHIKI_LLM_OPENAI_BASE_URL:?set NOHIKI_LLM_OPENAI_BASE_URL}"
  NOHIKI_LLM_ANTHROPIC_BASE_URL: "${NOHIKI_LLM_ANTHROPIC_BASE_URL:-}"

x-common-microservice: &common-microservice
  networks: [nohiki-network]
  restart: unless-stopped
  stop_grace_period: 30s
  healthcheck:
    test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=2)\""]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 60s

x-common-infrastructure: &common-infrastructure
  networks: [nohiki-network]
  restart: unless-stopped

x-observability-env: &observability-env
  OTEL_COLLECTOR_GRPC_ENDPOINT: http://nohiki-obs-otel-collector:4317
  OTEL_EXPORTER_INSECURE: "true"
  OTEL_ENABLED: "false"
  PHOENIX_COLLECTOR_ENDPOINT: http://nohiki-obs-phoenix:4317
  PHOENIX_ENABLED: "false"
  PHOENIX_PROJECT_NAME: nohiki

# Shared secret volume mounts
x-vol-database: &vol-database nohiki-vol-secret-database:/run/secrets/database:ro
x-vol-redis: &vol-redis nohiki-vol-secret-redis:/run/secrets/redis:ro
x-vol-s3: &vol-s3 nohiki-vol-secret-s3:/run/secrets/s3:ro
x-vol-jwt: &vol-jwt nohiki-vol-secret-jwt:/run/secrets/jwt:ro
x-vol-oauth: &vol-oauth nohiki-vol-secret-oauth:/run/secrets/oauth:ro
x-vol-jsearch: &vol-jsearch nohiki-vol-secret-jsearch:/run/secrets/jsearch:ro
x-vol-llm: &vol-llm nohiki-vol-secret-llm:/run/secrets/llm:ro
x-vol-email: &vol-email nohiki-vol-secret-email:/run/secrets/email:ro
x-vol-qdrant: &vol-qdrant nohiki-vol-secret-qdrant:/run/secrets/qdrant:ro
x-vol-s3-mlflow: &vol-s3-mlflow nohiki-vol-secret-s3-mlflow:/run/secrets/s3:ro

x-depends-on-secrets: &depends-on-secrets
  nohiki-infra-secrets-init: {condition: service_completed_successfully}

services:
  nohiki-infra-secrets-init:
    image: docker.io/library/busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
    network_mode: none
    restart: "no"

    read_only: true
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ../shared/secrets/database:/source/database:ro
      - ../shared/secrets/redis:/source/redis:ro
      - ../shared/secrets/s3-mlflow:/source/s3-mlflow:ro

      - ../shared/secrets/s3:/source/s3:ro
      - ../shared/secrets/jwt:/source/jwt:ro
      - ../shared/secrets/oauth:/source/oauth:ro
      - ../shared/secrets/jsearch:/source/jsearch:ro
      - ../shared/secrets/llm:/source/llm:ro
      - ../shared/secrets/email:/source/email:ro
      - ../shared/secrets/qdrant:/source/qdrant:ro
      - nohiki-vol-secret-database:/target/database
      - nohiki-vol-secret-redis:/target/redis
      - nohiki-vol-secret-s3:/target/s3
      - nohiki-vol-secret-jwt:/target/jwt
      - nohiki-vol-secret-oauth:/target/oauth
      - nohiki-vol-secret-jsearch:/target/jsearch
      - nohiki-vol-secret-llm:/target/llm
      - nohiki-vol-secret-email:/target/email
      - nohiki-vol-secret-qdrant:/target/qdrant
      - nohiki-vol-secret-s3-mlflow:/target/s3-mlflow
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for category in database redis s3 jwt oauth jsearch llm email qdrant s3-mlflow; do
          chmod 0700 "/target/$${category}"
          find "/target/$${category}" -mindepth 1 -delete
          cp -R "/source/$${category}/." "/target/$${category}/"
          find "/target/$${category}" -type d -exec chmod 0555 {} \;
          find "/target/$${category}" -type f -exec chmod 0444 {} \;
        done
    healthcheck:
      test: ["CMD", "test", "-r", "/target/database/dsn"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 1s

  # Microservices (nohiki-svc-*)

  nohiki-svc-user-auth:
    <<: *common-microservice
    build: {context: ../../, dockerfile: backend/services/user-auth-service/Dockerfile}
    image: user-auth-service:latest
    volumes:
      - *vol-database
      - *vol-redis
      - *vol-jwt
      - *vol-oauth
    environment:
      <<: *observability-env
      ENVIRONMENT: development
      SERVICE_NAME: user-auth-service
      USER_AUTH_DATABASE__SCHEMA_NAME: user_auth_schema
      USER_AUTH_KAFKA__DSN: kafka://nohiki-cp-kafka:29092
      USER_AUTH_KAFKA__CONSUMER_GROUP: user-auth-service-consumer
      USER_AUTH_JWT__ISSUER: "${NOHIKI_PUBLIC_API_URL:-http://localhost:${NOHIKI_PORT_TRAEFIK_HTTP:-8000}}"
      USER_AUTH_JWT__AUDIENCE: nohiki-api
      USER_AUTH_JWT__KEY_ID: local-dev-key-1
      USER_AUTH_JWT__PRIVATE_KEY_PATH: /run/secrets/jwt/private_key
      USER_AUTH_COOKIE__SECURE: "false"
      USER_AUTH_OAUTH__GITHUB__ENABLED: "false"
      USER_AUTH_OAUTH__GOOGLE__ENABLED: "false"
      USER_AUTH_OAUTH__CALLBACK_BASE_URL: "${NOHIKI_PUBLIC_API_URL:-http://localhost:${NOHIKI_PORT_TRAEFIK_HTTP:-8000}}"
      USER_AUTH_OAUTH__SUCCESS_REDIRECT_URL: "${NOHIKI_FRONTEND_ORIGIN:-http://localhost:5173}/auth/callback"
      USER_AUTH_OAUTH__ERROR_REDIRECT_URL: "${NOHIKI_FRONTEND_ORIGIN:-http://localhost:5173}/auth/callback"
    depends_on:
      <<: *depends-on-secrets
      nohiki-infra-postgres: {condition: service_healthy}
      nohiki-cp-kafka-init: {condition: service_completed_successfully}
      nohiki-infra-valkey: {condition: service_healthy}
    labels: ["traefik.enable=true"]

  nohiki-svc-bff:
    <<: *common-microservice
    build: {context: ../../, dockerfile: backend/services/bff-service/Dockerfile}
    image: bff-service:latest
    volumes: [*vol-database, *vol-redis, *vol-s3]
    environment:
      <<: *observability-env
      ENVIRONMENT: development
      SERVICE_NAME: bff-service
      BFF_DATABASE__SCHEMA_NAME: bff_schema
      BFF_KAFKA__DSN: kafka://nohiki-cp-kafka:29092
      BFF_KAFKA__CONSUMER_GROUP: bff-service-consumer
      BFF_JWT__JWKS_URL: http://nohiki-svc-user-auth:8000/.well-known/jwks.json
      BFF_JWT__ISSUER: "${NOHIKI_PUBLIC_API_URL:-http://localhost:${NOHIKI_PORT_TRAEFIK_HTTP:-8000}}"
      BFF_JWT__AUDIENCE: nohiki-api
      BFF_S3__ENDPOINT: http://nohiki-infra-rustfs:9000
      BFF_S3__PUBLIC_URL: "${NOHIKI_S3_PUBLIC_URL:-http://localhost:${NOHIKI_PORT_RUSTFS_API:-9002}}"
      BFF_S3__BUCKET: nohiki-attachments
      BFF_S3__REGION: us-east-1
      BFF_AUTH_LISTINGS__SECRET: ${BFF_AUTH_LISTINGS__SECRET:-dev-test-secret-qa-only}
      BFF_ORIGINS__CORS_ORIGINS: "${NOHIKI_FRONTEND_ORIGIN:-http://localhost:5173},http://localhost:3000"
      BFF_ORIGINS__CSRF_ORIGINS: "${NOHIKI_FRONTEND_ORIGIN:-http://localhost:5173},http://localhost:3000"
    depends_on:
      <<: *depends-on-secrets
      nohiki-infra-postgres: {condition: service_healthy}
      nohiki-cp-kafka-init: {condition: service_completed_successfully}
      nohiki-infra-valkey: {condition: service_healthy}
      nohiki-svc-user-auth: {condition: service_healthy}
      nohiki-infra-rustfs-init: {condition: service_completed_successfully}
    labels: ["traefik.enable=true"]

  nohiki-svc-user-upload:
    <<: *common-microservice
    build: {context: ../../, dockerfile: backend/services/user-upload-service/Dockerfile}
