apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://nohiki-obs-loki:3100
    editable: true
    jsonData:
      derivedFields:
        - name: "TraceID"
          matcherRegex: "trace_id\":\"([^\"]+)\""
          url: "$${__value.raw}"
          datasourceUid: tempo
          urlDisplayLabel: "View Trace"
