server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: local-dev
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://nohiki-obs-mimir:9009/api/v1/push
        headers:
          X-Scope-OrgID: nohiki
  processor:
    span_metrics:
      dimensions:
        - service.name
        - service.namespace
        - http.method
        - http.status_code
        - cache_status
        - country
    service_graphs:
      dimensions:
        - service.name

overrides:
  defaults:
    metrics_generator:
      processors:
        - span-metrics
        - service-graphs
