# Override file: enable OTEL telemetry export for all services when observability profile is active.
# Usage: COMPOSE_PROFILE=observability COMPOSE_OVERRIDE_FILE=docker-compose.observability.yml sh scripts/preflight.sh up -d
#
# Each service gets its OTEL endpoint via its settings prefix + OBSERVABILITY__OTEL_ENDPOINT,
# which pydantic-settings resolves to observability.otel_endpoint (enabling OTel export).

services:
  nohiki-svc-user-auth:
    environment:
      USER_AUTH_OBSERVABILITY__OTEL_ENDPOINT: http://nohiki-obs-otel-collector:4317
    depends_on:
      nohiki-obs-otel-collector:
        condition: service_started

  nohiki-svc-bff:
    environment:
      BFF_OBSERVABILITY__OTEL_ENDPOINT: http://nohiki-obs-otel-collector:4317
