[project]
name = "qdrant-init"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Qdrant collection initialization from semantic representation manifest"
requires-python = ">=3.14"
dependencies = [
    "nohiki-ml-core>=0.1.0",
    "nohiki-ml-manifest>=0.1.0",
    "httpx>=0.28.0",
    "typer>=0.15.0",
    "structlog>=25.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]

[project.scripts]
qdrant-init = "qdrant_init.cli:app"

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
