apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: nohiki-grafana
  labels:
    dashboards: nohiki
spec:
  version: "12.4.0"

  deployment:
    spec:
      replicas: 1
      template:
        spec:
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 472
            runAsGroup: 472
            fsGroup: 472
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: grafana
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                readOnlyRootFilesystem: false
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi

  config:
    server:
      serve_from_sub_path: "false"

    auth:
      disable_login_form: "false"

    auth.anonymous:
      enabled: "false"

    security:
      admin_user: admin
      disable_gravatar: "true"

    users:
      allow_sign_up: "false"
      auto_assign_org: "true"
      auto_assign_org_role: Viewer

    analytics:
      reporting_enabled: "false"
      check_for_updates: "false"

    log:
      mode: console
      level: info

    feature_toggles:
      enable: "traceToMetrics traceToLogs"
