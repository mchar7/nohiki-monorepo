apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nohiki-collector-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: nohiki-collector
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
        - port: 8888
          protocol: TCP
