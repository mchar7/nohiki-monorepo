apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability-storage-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: nohiki-secret-store
  target:
    name: observability-storage-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ .accessKey }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secretKey }}"
        AWS_REGION: "{{ .region }}"
  data:
    - secretKey: accessKey
      remoteRef:
        key: s3-access-key
    - secretKey: secretKey
      remoteRef:
        key: s3-secret-key
    - secretKey: region
      remoteRef:
        key: s3-region
