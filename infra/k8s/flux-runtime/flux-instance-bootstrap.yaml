apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    version: "2.9.2"
    registry: "ghcr.io/fluxcd"
  sync:
    kind: GitRepository
    url: "ssh://git@github.com/mchar7/nohiki-monorepo.git"
    ref: "refs/heads/${RUNTIME_CONTROL_BRANCH}"
    path: "infra/k8s/gitops/clusters/local/bootstrap"
    pullSecret: "flux-system"
  kustomize:
    patches:
      - target:
          kind: Kustomization
          name: flux-system
        patch: |-
          - op: add
            path: /spec/decryption
            value:
              provider: sops
              secretRef:
                name: flux-sops
          - op: add
            path: /spec/postBuild
            value:
              substituteFrom:
                - kind: ConfigMap
                  name: nohiki-verification-attempt
                  optional: false
