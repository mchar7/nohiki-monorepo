apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  url: ssh://git@github.com/mchar7/nohiki-monorepo.git
  ref:
    name: refs/heads/${RUNTIME_CONTROL_BRANCH}
  secretRef:
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infra/k8s/gitops/clusters/local
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: flux-sops
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: nohiki-verification-attempt
        optional: false
