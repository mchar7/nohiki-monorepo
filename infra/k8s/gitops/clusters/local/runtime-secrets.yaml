apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: runtime-secrets
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 10m
  retryInterval: 1m
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infra/k8s/gitops/secrets/local
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: flux-sops
  healthChecks:
    - apiVersion: v1
      kind: Secret
      name: nohiki-llm-runtime
      namespace: nohiki
    - apiVersion: v1
      kind: Secret
      name: nohiki-model-egress-tls-source
      namespace: nohiki
    - apiVersion: external-secrets.io/v1
      kind: SecretStore
      name: nohiki-local-secret-store
      namespace: nohiki
