apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: health-verification
  namespace: flux-system
spec:
  dependsOn:
    - name: observability
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./infra/k8s/gitops/verification
  prune: true
  wait: true
  force: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: nohiki-health-verification
      namespace: flux-system
    - apiVersion: batch/v1
      kind: Job
      name: nohiki-health-verification
      namespace: nohiki
