apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nohiki-api-verification
  namespace: flux-system
spec:
  interval: 1h
  timeout: 65m
  releaseName: nohiki-api-verification
  targetNamespace: nohiki-verification
  chart:
    spec:
      chart: infra/k8s/gitops/verification
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: true
    remediation: {retries: 0}
  upgrade:
    force: true
    remediation: {retries: 0}
  values:
    stage: api
  valuesFrom:
    - kind: ConfigMap
      name: nohiki-image-digests
      valuesKey: values.yaml
      optional: false
