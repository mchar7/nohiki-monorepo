apiVersion: v1
kind: Namespace
metadata:
  name: nohiki-verification
  labels:
    app.kubernetes.io/part-of: nohiki
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nohiki-verification
  namespace: nohiki-verification
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nohiki-verification-read
  namespace: nohiki
rules:
  - apiGroups: [""]
    resources: [services, endpoints, pods]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes]
    verbs: [get, list]
  - apiGroups: [gateway.kgateway.dev]
    resources: [trafficpolicies]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nohiki-verification-read
  namespace: nohiki
subjects:
  - kind: ServiceAccount
    name: nohiki-verification
    namespace: nohiki-verification
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nohiki-verification-read
