apiVersion: batch/v1
kind: Job
metadata:
  name: nohiki-playwright-verification-v1
  namespace: nohiki-verification
  labels:
    app.kubernetes.io/name: nohiki-playwright-verification
    nohiki.io/verification-stage: browser
  annotations:
    verification.nohiki.dev/revision: "v1"
    verification.nohiki.dev/runner-image-digest: {{ required "global.imageDigests.playwright-verification-runner is required" (index .Values.global.imageDigests "playwright-verification-runner") | quote }}
    verification.nohiki.dev/gateway-url: "http://nohiki.localhost"
    verification.nohiki.dev/suite-digest: "sha256:988fcce4cd323ed67679fc2339588ba56573d55e213fb992e8ab73aab4430fc6"
    verification.nohiki.dev/remediation: "inspect /artifacts/playwright/result.json, HTML, traces, screenshots and videos; fix source or cluster, bump revision, reconcile"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nohiki-playwright-verification
        nohiki.io/verification-stage: browser
    spec:
      serviceAccountName: nohiki-verification
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      hostAliases:
        - ip: 127.0.0.1
          hostnames: [nohiki.localhost, s3.nohiki.localhost]
      initContainers:
        - name: gateway-proxy
          image: {{ include "verification.image" (dict "root" . "name" "api-verification-runner") | quote }}
          args: [proxy]
          restartPolicy: Always
          env:
            - {name: NOHIKI_GATEWAY_UPSTREAM, value: http://nohiki-gateway.nohiki.svc.cluster.local:80}
            - {name: NOHIKI_PROXY_LISTEN_HOST, value: 127.0.0.1}
            - {name: NOHIKI_PROXY_LISTEN_PORT, value: "80"}
            - {name: NOHIKI_PROXY_ALLOWED_HOSTS, value: "nohiki.localhost,s3.nohiki.localhost"}
          startupProbe:
            httpGet:
              host: 127.0.0.1
              port: 80
              path: /api/ping
              httpHeaders:
                - {name: Host, value: nohiki.localhost}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              host: 127.0.0.1
              port: 80
              path: /api/ping
              httpHeaders:
                - {name: Host, value: nohiki.localhost}
            periodSeconds: 2
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: {drop: [ALL], add: [NET_BIND_SERVICE]}
      containers:
        - name: playwright-verification
          image: {{ include "verification.image" (dict "root" . "name" "playwright-verification-runner") | quote }}
          env:
            - {name: CI, value: "true"}
            - {name: E2E_BASE_URL, value: http://nohiki.localhost}
            - {name: E2E_ORIGIN, value: http://nohiki.localhost}
            - {name: NOHIKI_S3_PUBLIC_URL, value: http://s3.nohiki.localhost}
          volumeMounts:
            - {name: artifacts, mountPath: /artifacts}
            - {name: browser-state, mountPath: /workspace/typescript/apps/frontend/e2e/.output}
            - {name: tmp, mountPath: /tmp}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 4Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities: {drop: [ALL], add: []}
      volumes:
        - name: artifacts
          persistentVolumeClaim: {claimName: nohiki-playwright-verification-artifacts-v1}
        - name: browser-state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
