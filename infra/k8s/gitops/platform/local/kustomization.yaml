apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
configMapGenerator:
  - name: nohiki-image-digests
    namespace: flux-system
    files:
      - values.yaml=image-digests.values.yaml
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: nohiki
    patch: |-
      - op: add
        path: /spec/valuesFrom
        value:
          - kind: ConfigMap
            name: nohiki-image-digests
            valuesKey: values.yaml
            optional: false
