apiVersion: v1
kind: ServiceAccount
metadata:
  name: nohiki-local-secret-reader
  namespace: nohiki
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nohiki-local-secret-reader
  namespace: nohiki
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - nohiki-llm-runtime
      - nohiki-llm-proxy-source
      - nohiki-model-egress-tls-source
    verbs: ["get"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nohiki-local-secret-reader
  namespace: nohiki
subjects:
  - kind: ServiceAccount
    name: nohiki-local-secret-reader
    namespace: nohiki
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nohiki-local-secret-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: nohiki-local-secret-store
  namespace: nohiki
spec:
  provider:
    kubernetes:
      remoteNamespace: nohiki
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: nohiki-local-secret-reader
