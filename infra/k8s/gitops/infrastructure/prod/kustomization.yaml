apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Production sources the chart from the commit-pinned release source.
  - target:
      kind: HelmRelease
      name: nohiki-foundation
    patch: |-
      - op: replace
        path: /spec/chart/spec/sourceRef/name
        value: gitops-release
      - op: add
        path: /spec/chart/spec/valuesFiles
        value:
          - infra/k8s/helm/values.prod.identity.yaml
  - target:
      kind: HelmRelease
      name: nohiki-cloudnative-pg
    patch: |-
      - op: replace
        path: /spec/chart/spec/sourceRef/name
        value: gitops-release
