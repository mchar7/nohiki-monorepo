apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - target:
      kind: HelmRelease
      name: nohiki-foundation
    patch: |-
      - op: add
        path: /spec/values
        value:
          cert-manager:
            serviceAccount:
              annotations:
                azure.workload.identity/client-id: ${cert_manager_client_id}
            podLabels:
              azure.workload.identity/use: "true"
          managedClusterIssuer:
            enabled: true
            name: letsencrypt-dev
            azureDNS:
              clientID: ${cert_manager_client_id}
              subscriptionID: ${cert_manager_subscription_id}
              tenantID: ${cert_manager_tenant_id}
              resourceGroupName: ${cert_manager_dns_resource_group}
              hostedZoneName: ${cert_manager_dns_zone_name}
