apiVersion: v1
kind: Service
metadata:
  name: nohiki-registry
  namespace: nohiki-registry
  labels:
    app.kubernetes.io/name: nohiki-registry
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: nohiki-registry
  ports:
    - name: registry
      port: 5000
      targetPort: registry
      nodePort: 30500
      protocol: TCP
