# Observability stack (production: Azure native, HA replicas, secure)

kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      remoteWrite:
        - url: http://nohiki-mimir-nginx.nohiki-prod.svc:80/api/v1/push
          headers:
            X-Scope-OrgID: nohiki

mimir-distributed:
  minio:
    enabled: false
  mimir:
    structuredConfig:
      common:
        storage:
          backend: azure
          azure:
            account_name: nohikiprodobs
            container_name: nohiki-prod-mimir
      limits:
        max_global_series_per_user: 5000000
        ingestion_rate: 500000
  distributor:
    replicas: 3
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  ingester:
    replicas: 3
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi
  querier:
    replicas: 3
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
  query_frontend:
    replicas: 2
  store_gateway:
    replicas: 3
  compactor:
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
  ruler:
    replicas: 2

tempo:
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
