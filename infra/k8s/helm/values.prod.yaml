# Production overrides: Azure AKS.
# Secrets: provisioned via External Secrets Operator syncing from Azure Key Vault.
# Infrastructure: PostgreSQL, Redis, Kafka, S3 are all Azure-managed services.
# Scaling: KEDA enabled; HTTP services always-on, Kafka services scale-to-zero.

global:
  environment: prod
  imageTag: sha-933dda3
  modelEgress:
    rateLimitsEnabled: true
  # Standard NetworkPolicy cannot select Azure service FQDNs. Public endpoint
  # operation therefore uses 0.0.0.0/0, but each rule is emitted only for a
  # workload declaring that dependency and is restricted to its exact port.
  # Replace individual cidrs lists with private endpoint CIDRs after rollout.
  networkPolicy:
    managedEgress:
      database:
        cidrs: [0.0.0.0/0]
      kafka:
        cidrs: [0.0.0.0/0]
      redis:
        cidrs: [0.0.0.0/0]
      s3:
        cidrs: [0.0.0.0/0]
      qdrant:
        cidrs: [0.0.0.0/0]

  eso:
    # ESO operator+CRDs live in the foundation chart; this flag emits the
    # chart-managed external-secrets-sa, nohiki-secret-store, and ExternalSecrets.
    externalSecretsEnabled: true
    azure:
      keyVaultUrl: ""
      clientId: ""
      tenantId: ""
    remoteRefs:
      shared:
        nohiki-redis-credentials: {dsn: redis-dsn}
        nohiki-jwt-keys: {private_key: jwt-private-key}
        nohiki-oauth-credentials: {github_client_id: oauth-github-client-id, github_client_secret: oauth-github-client-secret, google_client_id: oauth-google-client-id, google_client_secret: oauth-google-client-secret}
        nohiki-email-api-keys: {resend_api_key: resend-api-key}
        nohiki-jsearch-api-keys: {api_key: jsearch-api-key}
        nohiki-s3-credentials: {access_key: s3-access-key, secret_key: s3-secret-key}
        qdrant-api-key: {api-key: qdrant-api-key}
        auth-listings-secret: {secret: auth-listings-secret}
        kafka-sasl-credentials: {username: kafka-sasl-username, password: kafka-sasl-password, mechanism: kafka-sasl-mechanism}
      modelEgress:
        nohiki-model-egress-openai: {Authorization: model-egress-openai-authorization}
        nohiki-model-egress-anthropic: {Authorization: model-egress-anthropic-authorization}
        nohiki-model-egress-openrouter: {Authorization: model-egress-openrouter-authorization}
        nohiki-model-egress-tls: {tls.crt: model-egress-tls-crt, tls.key: model-egress-tls-key}
        nohiki-model-egress-ca: {ca.crt: model-egress-ca-crt}

  database:
    host: nohiki-prod-postgres.postgres.database.azure.com
    port: 5432

  redis:
    host: nohiki-prod-redis.redis.cache.windows.net
    port: 6380

  kafka:
    port: 9093
    bootstrapServers: nohiki-prod-kafka.servicebus.windows.net:9093
    dsn: "kafka://nohiki-prod-kafka.servicebus.windows.net:9093"
    security:
      protocol: SASL_SSL
      sasl:
        mechanism: PLAIN
        secretName: kafka-sasl-credentials


  s3:
    provider: azure_blob
    port: 443
    endpoint: https://nohikiprod.blob.core.windows.net
    region: eastus

  qdrant:
    host: nohiki-prod-qdrant.qdrant.cloud
    grpcPort: "6334"
    useTls: true
    apiKeySecret: qdrant-api-key

  observability:
    enabled: true
    prometheus:
      enabled: true
    otel:
      enabled: false
    otelEndpoint: https://nohiki-collector-collector.nohiki-prod.svc.cluster.local:4317
    otelInsecure: "false"
    otelEnabled: "true"
    phoenixEndpoint: ""
    phoenixEnabled: "false"
    phoenixProjectName: nohiki
    otelTls:
      enabled: true
      secretName: otel-receiver-tls
      mountPath: /etc/otel/ca
      certificatePath: /etc/otel/ca/ca.crt

  scaling:
    minReplicas: 1
    maxReplicas: 20
    cooldownPeriod: 300

  ingress:
    enabled: true
    gatewayClass: kgateway
    host: nohiki.com
    tls:
      enabled: true
      secretName: nohiki-tls
      secretProvisioned: false

# Disable in-cluster infrastructure (Azure-managed in production)
strimzi:
  enabled: false
kafkaCluster:
  enabled: false


# HTTP-exposed services (always-on, HA)

user-auth-service:
  replicaCount: 2
  networkPolicy:
    allowGatewayIngress: true
    allowBffIngress: true
  monitoring:
    enabled: true
  extraEnv:
    - name: USER_AUTH_JWT__ISSUER
      value: "http://{{ .Release.Name }}-user-auth-service.{{ .Release.Namespace }}.svc.cluster.local:8000"
    - name: USER_AUTH_JWT__AUDIENCE
      value: "nohiki-api"
    - name: USER_AUTH_JWT__KEY_ID
      value: "nohiki-auth-key-1"
    - name: USER_AUTH_JWT__PRIVATE_KEY_PATH
      value: "/run/secrets/jwt/private_key"
    - name: USER_AUTH_COOKIE__SECURE
      value: "true"
    - name: USER_AUTH_OAUTH__GITHUB__ENABLED
      value: "false"
    - name: USER_AUTH_OAUTH__GOOGLE__ENABLED
      value: "false"
    - name: USER_AUTH_TRUSTED_PROXY_CIDRS
      value: '["10.244.0.0/16"]'
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

bff-service:
  replicaCount: 2
  networkPolicy:
    allowGatewayIngress: true
    allowAuthEgress: true
  monitoring:
    enabled: true
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  extraEnv:
    - name: BFF_JWT__JWKS_URL
      value: "http://{{ .Release.Name }}-user-auth-service.{{ .Release.Namespace }}.svc.cluster.local:8000/.well-known/jwks.json"
    - name: BFF_JWT__ISSUER
      value: "http://{{ .Release.Name }}-user-auth-service.{{ .Release.Namespace }}.svc.cluster.local:8000"
    - name: BFF_JWT__AUDIENCE
      value: "nohiki-api"
    - name: BFF_ORIGINS__CORS_ORIGINS
      value: "https://nohiki.com"
    - name: BFF_ORIGINS__CSRF_ORIGINS
      value: "https://nohiki.com"
    - name: NOHIKI_TRUSTED_PROXY_CIDRS
      value: "10.42.0.0/20"
    - name: BFF_S3__PUBLIC_URL
      value: "https://nohikiprod.blob.core.windows.net"
    - name: BFF_AUTH_LISTINGS__SECRET
      valueFrom:
        secretKeyRef:
          name: auth-listings-secret
          key: secret
  secrets:
    s3: false
  serviceAccount:
    create: false
    name: nohiki-storage
  podLabels:
    azure.workload.identity/use: "true"

frontend:
  replicaCount: 2
  scaling:
    enabled: false
  monitoring:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

