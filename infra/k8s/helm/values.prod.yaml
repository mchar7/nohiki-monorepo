ml-compute-service:
  # Accelerator = the single production switch. mode: cuda selects the CUDA-13.0
  # image variant, one nvidia.com/gpu, the GPU node-pool selector+toleration, the
  # NVIDIA device plugin, and the gpu compute backend, all derived by
  # nohiki-common.accelerator.normalize. To run ml-compute on CPU in production,
  # flip this ONE field to `cpu` (nothing else changes); local/staging omit it and
  # stay CPU. Keep the Terraform GPU node pool in lockstep: cuda here requires
  # aks_gpu_node_pool_enabled=true (its prod default), cpu allows it disabled.
  accelerator:
    mode: cuda
  scaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
  monitoring:
    enabled: true
  resources:
    # CPU/memory envelope for the replica. The nvidia.com/gpu count is derived
    # from accelerator.mode; never set resources.gpu by hand.
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  secrets:
    s3: false
  serviceAccount:
    create: false
    name: nohiki-storage
  podLabels:
    azure.workload.identity/use: "true"

