# Observability stack (staging: Azure Blob storage, lower replicas than prod)

kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      remoteWrite:
        - url: http://nohiki-mimir-nginx.nohiki-staging.svc:80/api/v1/push
          headers:
            X-Scope-OrgID: nohiki

mimir-distributed:
  mimir:
    structuredConfig:
      common:
        storage:
          backend: azure
          azure:
            account_name: nohikistagingobs
            container_name: nohiki-staging-mimir
  distributor:
    replicas: 2
  ingester:
    replicas: 2
  querier:
    replicas: 2
  query_frontend:
    replicas: 1
  store_gateway:
    replicas: 2
  compactor:
    replicas: 1
  ruler:
    replicas: 1

tempo:
  config:
    storage:
      trace:
        backend: azure
        azure:
          storage_account_name: nohikistagingobs
          container_name: nohiki-staging-tempo
    metrics_generator:
      storage:
        remote_write:
          - url: http://nohiki-mimir-nginx.nohiki-staging.svc:80/api/v1/push
            headers:
              X-Scope-OrgID: nohiki

loki:
  loki:
    storage:
      type: azure
      bucketNames:
        chunks: nohiki-staging-loki-chunks
        ruler: nohiki-staging-loki-ruler
        admin: nohiki-staging-loki-admin
      azure:
        accountName: nohikistagingobs
  write:
    replicas: 2
  read:
    replicas: 2
  backend:
    replicas: 1

pyroscope:
  pyroscope:
    structuredConfig:
      storage:
        backend: azure
        azure:
          storage_account_name: nohikistagingobs
          container_name: nohiki-staging-pyroscope
  replicas: 1
