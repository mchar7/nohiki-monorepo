# Staging overrides: Azure AKS, in-cluster infrastructure.
# Unlike prod (which uses Azure-managed PostgreSQL/Redis/Event Hubs/Blob),
# staging runs IN-CLUSTER Strimzi Kafka, Valkey, Qdrant, and RustFS (inherited
# from values.yaml); do NOT add prod-style disables (strimzi.enabled: false,
# etc.) here. PostgreSQL is the exception: staging consumes the OpenTofu
# Azure Database for PostgreSQL, so CNPG is disabled below.
#
# Staging-specific overrides: per-service replica counts, ingress hostname,
# and Azure Blob-backed observability storage for Mimir/Tempo/Loki/Pyroscope.

global:
  environment: staging
  imageTag: sha-933dda3
  modelEgress:
    rateLimitsEnabled: true
  eso:
    externalSecretsEnabled: true
    # azure.{keyVaultUrl,clientId,tenantId} arrive at runtime via the Flux
    # HelmRelease; existingStoreName is intentionally absent so the platform
    # chart creates external-secrets-sa and the nohiki-secret-store store.
    remoteRefs:
      shared:
        nohiki-redis-credentials: {dsn: redis-dsn}
        nohiki-jwt-keys: {private_key: jwt-private-key}
        nohiki-oauth-credentials: {github_client_id: oauth-github-client-id, github_client_secret: oauth-github-client-secret, google_client_id: oauth-google-client-id, google_client_secret: oauth-google-client-secret}
        nohiki-email-api-keys: {resend_api_key: resend-api-key}
        nohiki-jsearch-api-keys: {api_key: jsearch-api-key}
        nohiki-s3-credentials: {access_key: s3-access-key, secret_key: s3-secret-key}
        qdrant-api-key: {api-key: qdrant-api-key}
        auth-listings-secret: {secret: auth-listings-secret}
        kafka-sasl-credentials: {username: kafka-sasl-username, password: kafka-sasl-password, mechanism: kafka-sasl-mechanism}
      modelEgress:
        nohiki-model-egress-openai: {Authorization: model-egress-openai-authorization}
        nohiki-model-egress-anthropic: {Authorization: model-egress-anthropic-authorization}
        nohiki-model-egress-openrouter: {Authorization: model-egress-openrouter-authorization}
        nohiki-model-egress-tls: {tls.crt: model-egress-tls-crt, tls.key: model-egress-tls-key}
        nohiki-model-egress-ca: {ca.crt: model-egress-ca-crt}

  observability:
    enabled: true
    prometheus:
      enabled: true
    otel:
      enabled: false
    logLevel: INFO

  scaling:
    minReplicas: 1
    maxReplicas: 5
    cooldownPeriod: 180

  ingress:
    gatewayClass: kgateway
    host: staging.nohiki.com
    tls:
      enabled: true
      secretName: staging-nohiki-tls
      secretProvisioned: false

# Staging consumes the OpenTofu-provisioned Azure Database for PostgreSQL, so the
# in-cluster CloudNativePG Cluster is disabled here. The CNPG operator is still
# installed cluster-wide by the foundation chart but has no Cluster to reconcile.
cnpgCluster:
  enabled: false

# HTTP-exposed services (always-on, HA)

user-auth-service:
  replicaCount: 2
  scaling:
    minReplicas: 1
    maxReplicas: 5
  # Helm replaces lists; keep the complete service environment when overriding.
  extraEnv:
    - name: USER_AUTH_JWT__ISSUER
      value: "http://{{ .Release.Name }}-user-auth-service.{{ .Release.Namespace }}.svc.cluster.local:8000"
    - name: USER_AUTH_JWT__AUDIENCE
      value: "nohiki-api"
    - name: USER_AUTH_JWT__KEY_ID
      value: "nohiki-auth-key-1"
    - name: USER_AUTH_JWT__PRIVATE_KEY_PATH
      value: "/run/secrets/jwt/private_key"
    - name: USER_AUTH_COOKIE__SECURE
      value: "true"
    - name: USER_AUTH_OAUTH__GITHUB__ENABLED
      value: "false"
    - name: USER_AUTH_OAUTH__GOOGLE__ENABLED
      value: "false"

bff-service:
  replicaCount: 2
  scaling:
    minReplicas: 1
    maxReplicas: 5
  # Helm merges lists by replacement, not append. This list must include
  # every env var from charts/bff-service/values.yaml:extraEnv plus
  # staging-specific additions, otherwise the chart defaults are dropped.
  extraEnv:
    - name: BFF_JWT__JWKS_URL
      value: "http://{{ .Release.Name }}-user-auth-service.{{ .Release.Namespace }}.svc.cluster.local:8000/.well-known/jwks.json"
    - name: BFF_JWT__ISSUER
      value: "http://{{ .Release.Name }}-user-auth-service.{{ .Release.Namespace }}.svc.cluster.local:8000"
    - name: BFF_JWT__AUDIENCE
      value: "nohiki-api"
    - name: BFF_ORIGINS__CORS_ORIGINS
      value: "https://staging.nohiki.com"
    - name: BFF_ORIGINS__CSRF_ORIGINS
      value: "https://staging.nohiki.com"
    - name: NOHIKI_TRUSTED_PROXY_CIDRS
      value: "10.42.0.0/20"
    - name: BFF_AUTH_LISTINGS__SECRET
      valueFrom:
        secretKeyRef:
          name: auth-listings-secret
          key: secret

frontend:
  replicaCount: 2
  scaling:
    minReplicas: 1
    maxReplicas: 5

