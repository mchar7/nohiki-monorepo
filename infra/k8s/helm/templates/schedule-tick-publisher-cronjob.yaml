{{- $cfg := .Values.scheduleTickPublisher | default dict }}
{{- if $cfg.enabled }}
{{- $glob := .Values.global | default dict }}
{{- $globKafka := $glob.kafka | default dict }}
{{- $bootstrapServers := required "scheduleTickPublisher requires global.kafka.bootstrapServers" $globKafka.bootstrapServers }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-schedule-tick-publisher
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: schedule-tick-publisher
    app.kubernetes.io/component: cronjob
    app.kubernetes.io/part-of: nohiki
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  schedule: {{ $cfg.schedule | default "*/1 * * * *" | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 60
      ttlSecondsAfterFinished: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: schedule-tick-publisher
            app.kubernetes.io/part-of: nohiki
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: schedule-tick-publisher
              image: {{ include "nohiki.jobImage" (dict "glob" $glob "cfg" $cfg "default" "sys-tick-job") | quote }}
              imagePullPolicy: {{ include "nohiki.jobImagePullPolicy" (dict "glob" $glob "cfg" $cfg) }}
              command: ["python", "-m", "sys_tick_job.publish_schedule_tick"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              env:
                - name: KAFKA_BOOTSTRAP_SERVERS
                  value: {{ $bootstrapServers | quote }}
                - name: SCHEDULE_TICK_SOURCE_SERVICE
                  value: {{ $cfg.sourceService | default "sys-tick-cronjob" | quote }}
                - name: SCHEDULE_TICK_BATCH_LIMIT
                  value: {{ $cfg.batchLimit | default 0 | quote }}
{{- end }}
