{{- $eso := .Values.global.eso | default dict }}
{{- $managed := $eso.externalSecretsEnabled | default false }}
{{- $localStoreName := $eso.localStoreName | default "" }}
{{- $root := . }}
{{- $providerCredentials := .Values.global.modelEgress.providerCredentials | default list }}
{{- $disabledBackends := .Values.global.modelEgress.disabledBackends | default list }}
{{- $readinessNames := list }}
{{- if $managed }}
{{- $refs := required "managed ESO requires global.eso.remoteRefs" $eso.remoteRefs }}
{{- $storeName := $eso.existingStoreName | default "nohiki-secret-store" }}
{{- $sharedRefs := required "managed ESO requires global.eso.remoteRefs.shared" $refs.shared }}
{{- $modelRefs := required "managed ESO requires global.eso.remoteRefs.modelEgress" $refs.modelEgress }}
{{- range $groupName, $group := dict "shared" $sharedRefs "modelEgress" $modelRefs }}
{{- range $name, $spec := $group }}
{{- $readinessNames = append $readinessNames $name }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $root.Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: {{ $storeName }}, kind: ClusterSecretStore}
  target:
    name: {{ $name }}
    creationPolicy: Owner
  data:
  {{- range $key, $remote := $spec }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ required (printf "global.eso.remoteRefs.%s.%s.%s is required" $groupName $name $key) $remote | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- range $svcName, $svcValues := .Values }}
{{- if eq (include "nohiki.hasDatabaseEnabled" $svcValues) "true" }}
{{- $readinessNames = append $readinessNames (printf "%s-db-credentials" $svcName) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $svcName }}-db-credentials
  namespace: {{ $root.Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: {{ $storeName }}, kind: ClusterSecretStore}
  target:
    name: {{ $svcName }}-db-credentials
    creationPolicy: Owner
  data:
    - {secretKey: host, remoteRef: {key: database-host}}
    - {secretKey: port, remoteRef: {key: database-port}}
    - {secretKey: user, remoteRef: {key: database-user}}
    - {secretKey: username, remoteRef: {key: database-user}}
    - {secretKey: password, remoteRef: {key: database-password}}
    - {secretKey: database, remoteRef: {key: database-name}}
    - {secretKey: dbname, remoteRef: {key: database-name}}
    - {secretKey: dsn, remoteRef: {key: database-dsn}}
    - {secretKey: uri, remoteRef: {key: database-dsn}}
{{- end }}
{{- end }}
{{- end }}
{{- if or $managed $localStoreName }}
{{- if $localStoreName }}
{{- if has "openai" $providerCredentials }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nohiki-model-egress-openai
  namespace: {{ $root.Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: {{ $localStoreName }}, kind: SecretStore}
  target: {name: nohiki-model-egress-openai, creationPolicy: Owner}
  data:
    - {secretKey: Authorization, remoteRef: {key: nohiki-llm-runtime, property: openai_api_key}}
{{- end }}
{{- if has "anthropic" $providerCredentials }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nohiki-model-egress-anthropic
  namespace: {{ $root.Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: {{ $localStoreName }}, kind: SecretStore}
  target: {name: nohiki-model-egress-anthropic, creationPolicy: Owner}
  data:
    - {secretKey: Authorization, remoteRef: {key: nohiki-llm-runtime, property: anthropic_api_key}}
{{- end }}
{{- if has "openrouter" $providerCredentials }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nohiki-model-egress-openrouter
  namespace: {{ $root.Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: {{ $localStoreName }}, kind: SecretStore}
  target: {name: nohiki-model-egress-openrouter, creationPolicy: Owner}
  data:
    - {secretKey: Authorization, remoteRef: {key: nohiki-llm-runtime, property: openrouter_api_key}}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nohiki-model-egress-tls
  namespace: {{ $root.Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: {{ $localStoreName }}, kind: SecretStore}
  target:
    name: nohiki-model-egress-tls
    creationPolicy: Owner
    template: {type: kubernetes.io/tls}
  data:
    - {secretKey: tls.crt, remoteRef: {key: nohiki-model-egress-tls-source, property: tls.crt}}
    - {secretKey: tls.key, remoteRef: {key: nohiki-model-egress-tls-source, property: tls.key}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nohiki-model-egress-ca
  namespace: {{ $root.Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: {{ $localStoreName }}, kind: SecretStore}
  target: {name: nohiki-model-egress-ca, creationPolicy: Owner}
  data:
    - {secretKey: ca.crt, remoteRef: {key: nohiki-model-egress-tls-source, property: ca.crt}}
{{- end }}
{{- end }}
{{- if or $managed $localStoreName }}
{{- $enabledRoutes := dict }}
{{- range $backend := $root.Values.global.modelEgress.backends | default list }}
{{- if and (ne $backend.enabled false) (not (has $backend.name $disabledBackends)) }}
{{- $_ := set $enabledRoutes (required "modelEgress backend name is required" $backend.name) true }}
{{- end }}
{{- end }}
{{- range $client := $root.Values.global.modelEgress.clients | default list }}
{{- $clientName := required "modelEgress client name is required" $client.name }}
{{- $secretName := required (printf "modelEgress client %s requires secretName" $clientName) $client.secretName }}
{{- $secretKey := required (printf "modelEgress client %s requires secretKey" $clientName) $client.secretKey }}
{{- $allowedRoutes := required (printf "modelEgress client %s requires non-empty allowedRoutes" $clientName) $client.allowedRoutes }}
{{- if eq (len $allowedRoutes) 0 }}
{{- fail (printf "modelEgress client %s must allow at least one route" $clientName) }}
{{- end }}
{{- range $route := $allowedRoutes }}
{{- if not (hasKey $enabledRoutes $route) }}
{{- fail (printf "modelEgress client %s references unknown or disabled route %s" $clientName $route) }}
{{- end }}
{{- end }}
{{- $readinessNames = append $readinessNames $secretName }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $secretName }}
  namespace: {{ $root.Release.Namespace }}
spec:
  length: 48
  digits: 8
  symbols: 0
  allowRepeat: true
  encoding: base64url
  secretKeys:
    - {{ $secretKey }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  namespace: {{ $root.Release.Namespace }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ $secretName }}
    creationPolicy: Owner
    template:
      metadata:
        labels:
          {{- range $route := $allowedRoutes }}
          {{ printf "nohiki.io/model-egress-route-%s" $route }}: "true"
          {{- end }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $secretName }}
{{- end }}
{{- end }}
{{- if $localStoreName }}
{{- $localProviderNames := list }}
{{- range $credential := $providerCredentials }}
{{- $localProviderNames = append $localProviderNames (printf "nohiki-model-egress-%s" $credential) }}
{{- end }}
{{- $readinessNames = concat $localProviderNames (list
  "nohiki-model-egress-tls"
  "nohiki-model-egress-ca"
) $readinessNames }}
{{- end }}
{{- if and (gt (len $readinessNames) 0) (or $managed $localStoreName) }}
{{- $readinessImage := required "secret readiness requires global.eso.readinessImage" $eso.readinessImage }}
{{- $readinessRepository := required "secret readiness requires global.eso.readinessImage.repository" $readinessImage.repository }}
{{- $readinessTag := required "secret readiness requires global.eso.readinessImage.tag" $readinessImage.tag }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nohiki-external-secret-readiness
  namespace: {{ $root.Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: nohiki
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nohiki-external-secret-readiness
  namespace: {{ $root.Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: nohiki
rules:
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    resourceNames:
    {{- range $name := $readinessNames }}
      - {{ $name }}
    {{- end }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nohiki-external-secret-readiness
  namespace: {{ $root.Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: nohiki
subjects:
  - kind: ServiceAccount
    name: nohiki-external-secret-readiness
    namespace: {{ $root.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nohiki-external-secret-readiness
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nohiki-external-secret-readiness
  namespace: {{ $root.Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: nohiki
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 180
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: nohiki
    spec:
      automountServiceAccountToken: true
      restartPolicy: Never
      serviceAccountName: nohiki-external-secret-readiness
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: wait
          image: {{ printf "%s:%s" $readinessRepository $readinessTag | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              for name in "$@"; do
                ready=false
                for attempt in $(seq 1 75); do
                  status="$(kubectl get externalsecret "${name}" \
                    --namespace "${POD_NAMESPACE}" \
                    --output 'jsonpath={.metadata.generation}{"\n"}{.status.syncedResourceVersion}{"\n"}{.status.conditions[?(@.type=="Ready")].status}' \
                    2>/dev/null || true)"
                  generation="$(printf '%s\n' "${status}" | sed -n '1p')"
                  synced_resource_version="$(printf '%s\n' "${status}" | sed -n '2p')"
                  condition_status="$(printf '%s\n' "${status}" | sed -n '3p')"
                  current_generation=false
                  case "${synced_resource_version}" in
                    "${generation}-"?*) current_generation=true ;;
                  esac
                  if [ -n "${generation}" ] && [ "${current_generation}" = true ] && \
                    [ "${condition_status}" = True ]; then
                    ready=true
                    break
                  fi
                  sleep 2
                done
                if [ "${ready}" != true ]; then
                  echo "Timed out waiting for ExternalSecret ${name} Ready condition for its current generation." >&2
                  exit 1
                fi
              done
            - wait-external-secrets
            {{- range $name := $readinessNames }}
            - {{ $name }}
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
{{- end }}
