{{/*
Local bootstrap-gated ScaledObjects are Helm hooks and therefore are not part
of release deletion. Sweep only this release's local scalers before upgrades
and uninstall; enabled scalers are recreated by their later post hook.
*/}}
{{- $global := .Values.global | default dict -}}
{{- $kafka := $global.kafka | default dict -}}
{{- $gate := $kafka.bootstrapGate | default dict -}}
{{- if eq ($global.environment | default "") "local" }}
{{- $cleanupName := printf "%s-kafka-scaler-hook-cleanup" .Release.Name -}}
{{- $eso := $global.eso | default dict -}}
{{- $cleanupImage := required "local scaler hook cleanup requires global.eso.readinessImage" $eso.readinessImage -}}
{{- $cleanupRepository := required "local scaler hook cleanup requires global.eso.readinessImage.repository" $cleanupImage.repository -}}
{{- $cleanupTag := required "local scaler hook cleanup requires global.eso.readinessImage.tag" $cleanupImage.tag -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $cleanupName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-upgrade,pre-delete
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: autoscaling
    app.kubernetes.io/part-of: nohiki
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $cleanupName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-upgrade,pre-delete
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: autoscaling
    app.kubernetes.io/part-of: nohiki
rules:
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    verbs: ["delete", "deletecollection", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $cleanupName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-upgrade,pre-delete
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: autoscaling
    app.kubernetes.io/part-of: nohiki
subjects:
  - kind: ServiceAccount
    name: {{ $cleanupName }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $cleanupName }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $cleanupName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-upgrade,pre-delete
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: autoscaling
    app.kubernetes.io/part-of: nohiki
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: autoscaling
        app.kubernetes.io/part-of: nohiki
    spec:
      automountServiceAccountToken: true
      restartPolicy: Never
      serviceAccountName: {{ $cleanupName }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: delete-hook-scaledobjects
          image: {{ printf "%s:%s" $cleanupRepository $cleanupTag | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              kubectl delete scaledobjects.keda.sh \
                --namespace "${POD_NAMESPACE}" \
                --selector "app.kubernetes.io/instance=${HELM_RELEASE},app.kubernetes.io/part-of=nohiki,environment=local" \
                --ignore-not-found=true \
                --wait=true \
                --timeout=90s
          env:
            - name: HELM_RELEASE
              value: {{ .Release.Name | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
{{- end }}
{{- if $gate.enabled }}
---
{{- $address := splitList ":" $kafka.bootstrapServers }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-kafka-scaler-bootstrap-gate
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
  labels:
    app.kubernetes.io/name: kafka-scaler-bootstrap-gate
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: autoscaling
    app.kubernetes.io/part-of: nohiki
spec:
  activeDeadlineSeconds: 1800
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-scaler-bootstrap-gate
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: autoscaling
        app.kubernetes.io/part-of: nohiki
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wait-for-kafka-bootstrap
          image: busybox:1.37.0@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until nc -z -w 2 "${KAFKA_BOOTSTRAP_HOST}" "${KAFKA_BOOTSTRAP_PORT}" >/dev/null 2>&1; do
                sleep 2
              done
          env:
            - name: KAFKA_BOOTSTRAP_HOST
              value: {{ first $address | quote }}
            - name: KAFKA_BOOTSTRAP_PORT
              value: {{ last $address | quote }}
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
{{- end }}
