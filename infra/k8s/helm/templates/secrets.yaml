{{/*
Kubernetes Secrets - declaratively managed by Helm.

Local/dev: Secret values are provided via a gitignored values.secrets.yaml file
  passed at deploy time with `helm upgrade -f values.secrets.yaml`.
  See values.secrets.yaml.example for the expected structure.

Production: external-secrets.io resources supply these Secrets, so
  global.eso.externalSecretsEnabled skips these inline manifests.
*/}}
{{- $glob := .Values.global | default dict }}
{{- $globSecrets := $glob.secrets | default dict }}
{{- $modelEgress := $glob.modelEgress | default dict }}
{{- $globObs := $glob.observability | default dict }}
{{- $globObsSecrets := $globObs.secrets | default dict }}
{{- $secretValues := .Values.secretValues | default dict }}
{{- $eso := $glob.eso | default dict }}
{{- $managedExternalSecrets := $eso.externalSecretsEnabled | default false }}
{{- $inlineSecretsEnabled := true }}
{{- if hasKey $globSecrets "inlineSecretsEnabled" }}
{{- $inlineSecretsEnabled = $globSecrets.inlineSecretsEnabled }}
{{- end }}
{{- if and (not $managedExternalSecrets) $inlineSecretsEnabled }}
{{- $db := $secretValues.database | default dict }}
{{- $redis := $secretValues.redis | default dict }}
{{- $jwt := $secretValues.jwt | default dict }}
{{- $oauth := $secretValues.oauth | default dict }}
{{- $llm := $secretValues.llm | default dict }}
{{- $email := $secretValues.email | default dict }}
{{- $jsearch := $secretValues.jsearch | default dict }}
{{- $s3 := $secretValues.s3 | default dict }}
{{- $authListings := $secretValues.authListings | default dict }}
{{- if not ($eso.externalSecretsEnabled | default false) }}
{{- $dbSecretName := $globSecrets.databaseSecretName | default "nohiki-database-credentials" }}
{{- $existingDbSecret := lookup "v1" "Secret" .Release.Namespace $dbSecretName }}
{{- $globDb := $glob.database | default dict }}
{{- $dbHost := required "global.database.host is required" $globDb.host }}
{{- $dbPort := required "global.database.port is required" $globDb.port }}
{{- $dbUser := $db.user | default "nohiki" }}
{{- $dbPass := $db.password | default "" }}
{{- $dbName := $db.name | default "nohiki_db" }}
{{- if not $existingDbSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $dbSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: nohiki
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
type: Opaque
{{- $pgAppSecret := lookup "v1" "Secret" .Release.Namespace "nohiki-pg-app" }}
{{- $resolvedDbHost := $dbHost }}
{{- if and $pgAppSecret (hasKey $pgAppSecret.data "host") }}
{{- $resolvedDbHost = (index $pgAppSecret.data "host" | b64dec) }}
{{- end }}
{{- $resolvedDbPort := $dbPort }}
{{- if and $pgAppSecret (hasKey $pgAppSecret.data "port") }}
{{- $resolvedDbPort = (index $pgAppSecret.data "port" | b64dec) }}
{{- end }}
{{- $resolvedDbUser := $dbUser }}
{{- if and $pgAppSecret (hasKey $pgAppSecret.data "user") }}
{{- $resolvedDbUser = (index $pgAppSecret.data "user" | b64dec) }}
{{- end }}
{{- $resolvedDbPass := $dbPass }}
{{- if and $pgAppSecret (hasKey $pgAppSecret.data "password") }}
{{- $resolvedDbPass = (index $pgAppSecret.data "password" | b64dec) }}
{{- end }}
{{- $resolvedDbName := $dbName }}
{{- if and $pgAppSecret (hasKey $pgAppSecret.data "dbname") }}
{{- $resolvedDbName = (index $pgAppSecret.data "dbname" | b64dec) }}
{{- end }}
{{- $resolvedDbDsn := printf "postgresql://%s:%s@%s:%s/%s?sslmode=disable" $resolvedDbUser $resolvedDbPass $resolvedDbHost (toString $resolvedDbPort) $resolvedDbName }}
{{- if and $pgAppSecret (hasKey $pgAppSecret.data "uri") }}
{{- $resolvedDbDsn = (index $pgAppSecret.data "uri" | b64dec) }}
{{- end }}
stringData:
  host: {{ $resolvedDbHost | quote }}
  port: {{ $resolvedDbPort | quote }}
  user: {{ $resolvedDbUser | quote }}
  password: {{ $resolvedDbPass | quote }}
  database: {{ $resolvedDbName | quote }}
  dsn: {{ $resolvedDbDsn | quote }}
{{- end }}
{{- range $svcName, $svcValues := .Values }}
{{- if eq (include "nohiki.hasDatabaseEnabled" $svcValues) "true" }}
{{- $dbName := include "nohiki.dbName" (dict "svcName" $svcName "svcValues" $svcValues) }}
{{- $appRole := include "nohiki.dbAppRole" (dict "svcName" $svcName "svcValues" $svcValues) }}
{{- $debeziumRole := include "nohiki.dbDebeziumRole" (dict "svcName" $svcName "svcValues" $svcValues) }}
{{- $appSecretName := include "nohiki.dbAppSecretName" (dict "svcName" $svcName) }}
{{- $debeziumSecretName := include "nohiki.dbDebeziumSecretName" (dict "svcName" $svcName) }}
{{- $appPassword := dig "database" "localPasswords" "app" (printf "%s-local-dev-password" $appRole) $svcValues }}
{{- $debeziumPassword := dig "database" "localPasswords" "debezium" (printf "%s-local-dev-password" $debeziumRole) $svcValues }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $appSecretName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: nohiki
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/component: {{ $svcName }}
    cnpg.io/reload: "true"
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
type: kubernetes.io/basic-auth
stringData:
  host: {{ $dbHost | quote }}
  port: {{ $dbPort | quote }}
  user: {{ $appRole | quote }}
  username: {{ $appRole | quote }}
  password: {{ $appPassword | quote }}
  database: {{ $dbName | quote }}
  dbname: {{ $dbName | quote }}
  dsn: {{ printf "postgresql://%s:%s@%s:%s/%s?sslmode=disable" $appRole $appPassword $dbHost (toString $dbPort) $dbName | quote }}
  uri: {{ printf "postgresql://%s:%s@%s:%s/%s" $appRole $appPassword $dbHost (toString $dbPort) $dbName | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $debeziumSecretName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: nohiki
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/component: {{ $svcName }}
    cnpg.io/reload: "true"
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
type: kubernetes.io/basic-auth
stringData:
  host: {{ $dbHost | quote }}
  port: {{ $dbPort | quote }}
  user: {{ $debeziumRole | quote }}
  username: {{ $debeziumRole | quote }}
  password: {{ $debeziumPassword | quote }}
  database: {{ $dbName | quote }}
  dbname: {{ $dbName | quote }}
  dsn: {{ printf "postgresql://%s:%s@%s:%s/%s?sslmode=disable" $debeziumRole $debeziumPassword $dbHost (toString $dbPort) $dbName | quote }}
  uri: {{ printf "postgresql://%s:%s@%s:%s/%s" $debeziumRole $debeziumPassword $dbHost (toString $dbPort) $dbName | quote }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $globSecrets.redisSecretName | default "nohiki-redis-credentials" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: nohiki
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
type: Opaque
{{- $globRedis := $glob.redis | default dict }}
{{- $redisHost := $globRedis.host | default "nohiki-valkey-master" }}
{{- $redisPort := $globRedis.port | default "6379" }}
{{- $redisPass := $redis.password | default "" }}
{{- $redisDb := $redis.db | default "0" }}
stringData:
  password: {{ $redisPass | quote }}
  {{- if $redisPass }}
  dsn: {{ printf "redis://:%s@%s:%s/%s" $redisPass $redisHost (toString $redisPort) $redisDb | quote }}
  {{- else }}
  dsn: {{ printf "redis://%s:%s/%s" $redisHost (toString $redisPort) $redisDb | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $globSecrets.jwtSecretName | default "nohiki-jwt-keys" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: nohiki
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
type: Opaque
stringData:
  private_key: {{ $jwt.privateKey | default "" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $globSecrets.oauthSecretName | default "nohiki-oauth-credentials" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: nohiki
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
type: Opaque
stringData:
  github_client_id: {{ $oauth.githubClientId | default "" | quote }}
  github_client_secret: {{ $oauth.githubClientSecret | default "" | quote }}
  google_client_id: {{ $oauth.googleClientId | default "" | quote }}
  google_client_secret: {{ $oauth.googleClientSecret | default "" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $globSecrets.emailSecretName | default "nohiki-email-api-keys" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: nohiki
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
type: Opaque
stringData:
  resend_api_key: {{ $email.resendApiKey | default "" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $globSecrets.jsearchSecretName | default "nohiki-jsearch-api-keys" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: nohiki
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
type: Opaque
stringData:
  api_key: {{ $jsearch.apiKey | default "" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $globSecrets.s3SecretName | default "nohiki-s3-credentials" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: nohiki
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
type: Opaque
stringData:
  access_key: {{ $s3.accessKey | default "" | quote }}
  secret_key: {{ $s3.secretKey | default "" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $globObsSecrets.storage | default "observability-storage-credentials" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: nohiki
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ $s3.accessKey | default "" | quote }}
  AWS_SECRET_ACCESS_KEY: {{ $s3.secretKey | default "" | quote }}
  AWS_REGION: {{ $glob.s3.region | default "local" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-listings-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: nohiki
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
type: Opaque
stringData:
  secret: {{ $authListings.secret | default "dev-test-secret-qa-only" | quote }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $globSecrets.kafkaSecretName | default "nohiki-kafka-credentials" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: nohiki
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
type: Opaque
{{- $globKafka := $glob.kafka | default dict }}
{{- $kafkaBootstrap := $globKafka.bootstrapServers | default "nohiki-kafka-kafka-bootstrap:9092" }}
stringData:
  bootstrap_servers: {{ $kafkaBootstrap | quote }}
  dsn: {{ printf "kafka://%s" $kafkaBootstrap | quote }}
{{- end }}
