{{- $global := .Values.global | default dict }}
{{- $eso := $global.eso | default dict }}
{{- $azure := $eso.azure | default dict }}
{{- $storageEnabled := false }}
{{- range $name, $values := .Values }}
  {{- if and (kindIs "map" $values) (dig "s3" "enabled" false $values) }}
    {{- $storageEnabled = true }}
  {{- end }}
{{- end }}
{{- if and $storageEnabled ($eso.externalSecretsEnabled | default false) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nohiki-storage
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: nohiki
    azure.workload.identity/use: "true"
  annotations:
    azure.workload.identity/client-id: {{ required "managed storage workload identity requires global.eso.azure.clientId" $azure.clientId | quote }}
automountServiceAccountToken: false
{{- end }}
