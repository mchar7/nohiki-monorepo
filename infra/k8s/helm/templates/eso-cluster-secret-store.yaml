{{- $eso := .Values.global.eso | default dict }}
{{- if and ($eso.externalSecretsEnabled | default false) (not ($eso.existingStoreName | default "")) }}
{{- $azure := required "managed ESO requires global.eso.azure" $eso.azure }}
{{- $vaultUrl := required "managed ESO requires global.eso.azure.keyVaultUrl" $azure.keyVaultUrl }}
{{- $clientId := required "managed ESO requires global.eso.azure.clientId" $azure.clientId }}
{{- $tenantId := required "managed ESO requires global.eso.azure.tenantId" $azure.tenantId }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: {{ .Release.Namespace }}
  labels:
    azure.workload.identity/use: "true"
    app.kubernetes.io/part-of: nohiki
  annotations:
    azure.workload.identity/client-id: {{ $clientId | quote }}
    azure.workload.identity/tenant-id: {{ $tenantId | quote }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: nohiki-secret-store
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: {{ $vaultUrl | quote }}
      serviceAccountRef:
        name: external-secrets-sa
        namespace: {{ .Release.Namespace }}
{{- end }}
