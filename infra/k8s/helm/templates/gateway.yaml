{{/*
Gateway API entry point for Nohiki.
kgateway chosen via benchmarks: 25x less memory, 20x faster route propagation, zero errors.
*/}}
{{- if $.Values.global.ingress.enabled }}
{{- $gatewayClass := .Values.global.ingress.gatewayClass | default "kgateway" }}
{{- $ingressHost := .Values.global.ingress.host | default "" }}
{{- $tls := .Values.global.ingress.tls | default dict }}
{{- $s3Ingress := .Values.global.ingress.s3 | default dict }}
{{- $tlsReady := and ($tls.enabled | default false) ($tls.secretProvisioned | default false) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Release.Name }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-gateway
    app.kubernetes.io/part-of: nohiki
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  gatewayClassName: {{ $gatewayClass }}
  listeners:
    {{- if not $tlsReady }}
    - name: http
      protocol: HTTP
      port: 80
      {{- if $ingressHost }}
      hostname: {{ $ingressHost | quote }}
      {{- end }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
    {{- if and ($s3Ingress.enabled | default false) (not $tlsReady) }}
    - name: s3-http
      protocol: HTTP
      port: 80
      hostname: {{ required "global.ingress.s3.host is required when the local S3 route is enabled" $s3Ingress.host | quote }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
    {{- if $tlsReady }}
    - name: https
      protocol: HTTPS
      port: 443
      {{- if $ingressHost }}
      hostname: {{ $ingressHost | quote }}
      {{- end }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.global.ingress.tls.secretName | default (printf "%s-tls" .Release.Name) }}
            kind: Secret
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
{{- end }}
