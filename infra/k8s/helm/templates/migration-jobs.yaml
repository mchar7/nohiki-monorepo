{{/*
Per-service Alembic migration Jobs, one per enabled database-backed service.
Jobs are independent of the in-cluster CNPG lifecycle because remote managed
PostgreSQL environments require the same migration contract. Failed Jobs are
retained for inspection; successful ones are pruned by the next hook run.
*/}}
{{- $root := . }}

{{- range $svcName, $svcValues := .Values }}
{{- if eq (include "nohiki.hasDatabaseEnabled" $svcValues) "true" }}
{{- $dbSchema := include "nohiki.dbSchema" (dict "svcName" $svcName "svcValues" $svcValues) }}
{{- $migration := dig "migration" dict $svcValues }}
{{- $migrationEnabled := dig "enabled" true $migration }}
{{- if $migrationEnabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $svcName }}-db-migrate
  namespace: {{ $root.Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: nohiki
    app.kubernetes.io/managed-by: {{ $root.Release.Service }}
    app.kubernetes.io/component: {{ $svcName }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ dig "migration" "backoffLimit" 3 $svcValues }}
  activeDeadlineSeconds: {{ dig "migration" "activeDeadlineSeconds" 300 $svcValues }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $svcName }}-migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      securityContext:
        {{- include "nohiki-common.defaultPodSecurityContext" $root | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "nohiki.jobImage" (dict "glob" $root.Values.global "cfg" $svcValues "default" $svcName) | quote }}
          imagePullPolicy: {{ include "nohiki.jobImagePullPolicy" (dict "glob" $root.Values.global "cfg" $svcValues) }}
          command: ["alembic", "upgrade", "head"]
          workingDir: /app
          securityContext:
            {{- include "nohiki-common.defaultSecurityContext" $root | nindent 12 }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $svcName }}-db-credentials
                  key: uri
            - name: DATABASE__SCHEMA_NAME
              value: {{ $dbSchema | quote }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
{{- end }}
{{- end }}
