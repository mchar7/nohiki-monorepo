{{- $security := .Values.global.kafka.security | default dict }}
{{- $sasl := $security.sasl | default dict }}
{{- if $sasl.secretName }}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ .Release.Name }}-kafka-auth
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nohiki-kafka-auth
    app.kubernetes.io/part-of: nohiki
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  secretTargetRef:
    - parameter: sasl
      name: {{ $sasl.secretName }}
      key: mechanism
    - parameter: username
      name: {{ $sasl.secretName }}
      key: username
    - parameter: password
      name: {{ $sasl.secretName }}
      key: password
{{- end }}
