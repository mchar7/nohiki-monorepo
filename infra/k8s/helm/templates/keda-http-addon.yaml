{{- if .Values.keda.httpAddon.enabled }}
# KEDA HTTP Add-on Interceptor Proxy
# Enables HTTP-based scaling with scale-to-zero capability.
# Requests are proxied through the interceptor which holds them during scale-up.
# Note: Requires KEDA HTTP Add-on to be installed in cluster:
#   helm install http-add-on kedacore/keda-add-ons-http
apiVersion: http.keda.sh/v1alpha1
kind: HTTPInterceptorProxy
metadata:
  name: {{ .Release.Name }}-http-interceptor
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nohiki-http-interceptor
    app.kubernetes.io/part-of: nohiki
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.keda.httpAddon.interceptorReplicas | default 2 }}
  config:
    waitTimeout: {{ .Values.keda.httpAddon.waitTimeout | default "30s" | quote }}
{{- end }}
