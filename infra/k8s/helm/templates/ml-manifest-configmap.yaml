{{/*
ML Semantic Representation Manifest ConfigMap.
The chart packages the canonical manifest so direct Flux HelmRelease installs
do not depend on an out-of-band values injection. mlManifestContent remains an
optional override for deployments that need a different manifest.
*/}}
{{- $content := required "ML manifest content must not be empty" (.Values.mlManifestContent | default (.Files.Get "files/semantic_representation_manifest.json")) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: nohiki-ml-manifest
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nohiki.labels" . | nindent 4 }}
data:
  semantic_representation_manifest.json: |-
    {{- $content | trim | nindent 4 }}
