enabled: true
replicaCount: 1

envPrefix: "ML_GATEWAY_"

mlManifest:
  enabled: true
  configMapName: nohiki-ml-manifest
  mountPath: /app/data/config/semantic_representation_manifest.json

image:
  name: ml-gateway-service
  tag: ""

service:
  name: ml-gateway-service
  type: ClusterIP
  port: 8000
  targetPort: 8000

secrets:
  enabled: true
  redis: true

database:
  enabled: false

redis:
  enabled: true

kafka:
  enabled: true
  consumerGroup: ml-gateway-service-consumer

observability:
  enabled: true

scaling:
  enabled: false
  type: kafka
  minReplicas: "0"
  maxReplicas: 3
  pollingInterval: 15
  cooldownPeriod: 300
  kafka:
    lagThreshold: "10"
    topics:
      - name: ml.cmd.batch-embedding-requested.v1
      - name: ml.cmd.embedding-requested.v1
      - name: ml.cmd.rerank-requested.v1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    enabled: true
    path: /healthz
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /readyz
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3

serviceAccount:
  create: true
  annotations: {}
  name: ""
