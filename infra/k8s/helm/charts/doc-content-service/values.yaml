enabled: true
replicaCount: 1


envPrefix: "DOC_CONTENT_"

llm:
  enabled: true
  provider:
    models:
      - model: openai:gpt-5.6-sol
        reasoningEffort: high
    temperature: "0.3"
    timeoutSeconds: "180"
  chains:
    doc_tailoring:
      models:
        - model: openai:gpt-5.6-sol
          reasoningEffort: high
      temperature: "0.3"
      timeoutSeconds: "180"
  caching:
    enabled: "true"

image:
  name: doc-content-service
  tag: ""

service:
  name: doc-content-service
  type: ClusterIP
  port: 8000
  targetPort: 8000

secrets:
  enabled: true
  llm: true
  s3: true

database:
  enabled: false

redis:
  enabled: false

kafka:
  enabled: true
  consumerGroup: doc-content-service-consumer

s3:
  enabled: true
  bucket: nohiki-tailored-docs

observability:
  enabled: true

scaling:
  enabled: false
  type: kafka
  minReplicas: 0
  maxReplicas: 5
  pollingInterval: 15
  cooldownPeriod: 300
  kafka:
    lagThreshold: "10"

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1536Mi

probes:
  liveness:
    enabled: true
    path: /healthz
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /readyz
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3

serviceAccount:
  create: true
  annotations: {}
  name: ""
