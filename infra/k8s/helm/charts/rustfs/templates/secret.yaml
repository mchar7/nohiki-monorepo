{{- if not (.Values.secret.existingSecret | default "") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-rustfs-credentials
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: object-storage
    app.kubernetes.io/part-of: nohiki
type: Opaque
stringData:
  root-user: {{ .Values.auth.rootUser | default "rustfs_admin" | quote }}
  root-password: {{ .Values.auth.rootPassword | default "rustfs_secret" | quote }}
  access-key: {{ .Values.auth.rootUser | default "rustfs_admin" | quote }}
  secret-key: {{ .Values.auth.rootPassword | default "rustfs_secret" | quote }}
{{- end }}
