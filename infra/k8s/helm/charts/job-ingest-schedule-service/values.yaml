enabled: true
replicaCount: 1

envPrefix: "JOB_INGEST_SCHEDULE_"

image:
  name: job-ingest-schedule-service
  tag: ""

service:
  name: job-ingest-schedule-service
  type: ClusterIP
  port: 8000
  targetPort: 8000

secrets:
  enabled: true
  database: true
  redis: true

database:
  enabled: true
  schema: job_schedule_schema

redis:
  enabled: true

kafka:
  enabled: true
  consumerGroup: job-ingest-schedule-service-consumer

observability:
  enabled: true

scaling:
  enabled: false
  type: kafka
  minReplicas: 0
  maxReplicas: 5
  pollingInterval: 15
  cooldownPeriod: 300
  kafka:
    lagThreshold: "10"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    enabled: true
    path: /healthz
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /readyz
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3

serviceAccount:
  create: true
  annotations: {}
  name: ""
