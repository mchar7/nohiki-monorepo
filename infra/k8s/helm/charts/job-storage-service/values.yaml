# job-storage-service values
enabled: true
replicaCount: 1

envPrefix: "JOB_STORAGE_"

mlManifest:
  enabled: true
  configMapName: nohiki-ml-manifest
  mountPath: /app/data/config/semantic_representation_manifest.json

image:
  name: job-storage-service
  tag: ""

service:
  name: job-storage-service
  type: ClusterIP
  port: 8000
  targetPort: 8000

secrets:
  enabled: true
  database: true

database:
  enabled: true
  schema: job_storage_schema

redis:
  enabled: false

kafka:
  enabled: true
  consumerGroup: job-storage-service-consumer

qdrant:
  enabled: true

observability:
  enabled: true

scaling:
  enabled: false
  type: kafka
  minReplicas: 0
  maxReplicas: 5
  pollingInterval: 15
  cooldownPeriod: 300
  kafka:
    lagThreshold: "10"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    enabled: true
    path: /healthz
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /readyz
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3

serviceAccount:
  create: true
  annotations: {}
  name: ""

extraEnv:
  - name: JOB_STORAGE_BACKFILL__DEFAULT_MAX_LISTINGS
    value: "500"
  - name: JOB_STORAGE_BACKFILL__DEFAULT_SINCE_DAYS
    value: "30"
  - name: JOB_STORAGE_BACKFILL__BATCH_SIZE
    value: "50"
