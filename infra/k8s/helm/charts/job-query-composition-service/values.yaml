enabled: true
replicaCount: 1

envPrefix: "JOB_QUERY_COMPOSITION_"

image:
  name: job-query-composition-service
  tag: ""

service:
  name: job-query-composition-service
  type: ClusterIP
  port: 8000
  targetPort: 8000

secrets:
  enabled: true
  database: true
  redis: true

database:
  enabled: true
  schema: job_query_schema

redis:
  enabled: true

kafka:
  enabled: true
  consumerGroup: job-query-composition-service-consumer

observability:
  enabled: true

scaling:
  enabled: false
  type: kafka
  minReplicas: "0"
  maxReplicas: 3
  pollingInterval: 15
  cooldownPeriod: 300
  kafka:
    lagThreshold: "10"
    topics:
      - name: user-pref.cdc.pref-created.v1
      - name: user-pref.cdc.pref-updated.v1
      - name: user-pref.cdc.pref-deleted.v1
      - name: user-entitlement.cdc.entitlement-changed.v1
      - name: user-auth.cdc.account-deleted.v1
      - name: user-auth.fct.activity.v1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    enabled: true
    path: /healthz
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /readyz
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3

serviceAccount:
  create: true
  annotations: {}
  name: ""
