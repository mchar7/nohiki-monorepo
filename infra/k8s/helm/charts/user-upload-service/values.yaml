enabled: true
replicaCount: 1

envPrefix: "USER_UPLOAD_"

image:
  name: user-upload-service
  tag: ""

service:
  name: user-upload-service
  type: ClusterIP
  port: 8000
  targetPort: 8000

secrets:
  enabled: true
  database: true
  s3: true

database:
  enabled: true
  schema: user_upload_schema

redis:
  enabled: false

kafka:
  enabled: true
  consumerGroup: user-upload-service-consumer

s3:
  enabled: true
  bucket: nohiki-attachments

observability:
  enabled: true

scaling:
  enabled: false
  type: kafka
  minReplicas: 0
  maxReplicas: 5
  pollingInterval: 15
  cooldownPeriod: 300
  kafka:
    lagThreshold: "10"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    enabled: true
    path: /healthz
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /readyz
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3

serviceAccount:
  create: true
  annotations: {}
  name: ""
