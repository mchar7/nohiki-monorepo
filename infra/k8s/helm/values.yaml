# Infrastructure services
bff-service:
  enabled: true
  database:
    enabled: true

notification-service:
  enabled: true
  database:
    enabled: true
  scaling:
    excluded: true

frontend:
  enabled: true
  image:
    name: frontend

# Strimzi KafkaConnect cluster + KafkaConnector CRDs
kafkaConnect:
  enabled: false
  name: nohiki-connect
  replicas: 2
  bootstrapServers: nohiki-kafka-kafka-bootstrap:9092
  # v1 API requires these explicitly (not optional like v1beta2)
  groupId: nohiki-connect-cluster
  configStorageTopic: nohiki-connect-configs
  offsetStorageTopic: nohiki-connect-offsets
  statusStorageTopic: nohiki-connect-status
  # Commit offsets every 10s (default 60s). Faster commits shrink the replay window
  # on Connect pod restart/rebalance and let consumers see lower lag during steady state.
  offsetFlushIntervalMs: 10000
  # Image for custom Kafka Connect build with Debezium + Qdrant plugins
  # MUST be configured per environment (same registry as service images)
  image:
    registry: ""  # REQUIRED: Set per environment
    repository: ""  # REQUIRED: Set per environment (e.g., nohiki-kafka-connect)
    tag: latest
    pullSecret: ""  # Set if using private registry
  build:
    enabled: true
    debeziumVersion: "3.6.0.Final"
    debeziumSha512: "6a59c35e657b824e9a37008586bde707f684fc7549ac5e0a59facaa41acb24d8adb85eaa93917be811794c0f05ef9056ad1efe339f082ee2f25ae9b67c91d788"
    qdrantKafkaVersion: "1.3.3"
    qdrantKafkaSha512: "d33addecfcbaf27845686d6a0928d8c595ab975d2c71310c33ab5a4847d4e1b9a9a9dd9ddbd51328ccd7fd40f7b72fbc657decd87487dc56a8fa04b2cb82ee3b"
  # Observability: JMX Prometheus exporter for Kafka Connect
  metricsConfig:
    type: jmxPrometheusExporter
    valueFrom:
      configMapKeyRef:
        name: nohiki-connect-metrics
        key: connect-metrics-config.yml
  resources:
    requests:
      memory: 512Mi
      cpu: 200m
    limits:
      memory: 1Gi
      cpu: 1000m
  # Debezium outbox connector settings
  debezium:
    snapshotMode: when_needed
    snapshotLockingMode: none
    # Heartbeat every 10s (default 60s). The outbox publication is low-volume, so without
    # frequent heartbeats Postgres cannot advance the replication slot's confirmed_flush_lsn
    # and WAL accumulates on disk. 10s keeps the slot moving without meaningful overhead.
    heartbeatIntervalMs: 10000
    # Snapshot in 2048-row batches (Debezium default 10240). Lower batch size caps peak
    # heap usage on Connect pods during initial snapshot at the cost of slightly slower
    # backfill. Outbox snapshots are rare, so bounded memory is preferable.
    snapshotFetchSize: 2048
    pollIntervalMs: 100
    maxBatchSize: 2048
    maxQueueSize: 8192
    topicReplicationFactor: 1
    topicPartitions: 3
  # Qdrant sink connector settings
  qdrant:
    enabled: true
    grpcUrl: "http://nohiki-qdrant:6334"
    tasksMax: 3
    topic: "ml.fct.embedding-completed-json.v1"

# System schedule tick publisher (Kubernetes CronJob)
scheduleTickPublisher:
  enabled: true
  schedule: "*/1 * * * *"
  batchLimit: 0
  sourceService: "sys-tick-cronjob"
  image:
    repository: "sys-tick-job"
    tag: ""
    pullPolicy: IfNotPresent

# Database migration hook Job (runs before install/upgrade)
dbMigration:
  enabled: false
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  image:
    repository: bff-service
    tag: ""
    pullPolicy: IfNotPresent

# Secret values - populated at deploy time via environments/<env>/secrets.yaml (age-encrypted).
# Never commit plaintext secrets. See environments/local/secrets.yaml.dec for structure.
secretValues: {}

# ML manifest JSON content - injected at deploy time by Helmfile readFile gotmpl.
# Never set this manually; populated automatically from data/config/semantic_representation_manifest.json.
mlManifestContent: ""


# Infrastructure dependencies are enabled by environment overlays.

# CloudNativePG PostgreSQL Cluster Configuration
# Note: Per-service databases are created via Database CRDs in each service's chart.
# This cluster configuration only defines the shared PostgreSQL cluster infrastructure.
cnpgCluster:
  enabled: false
  name: nohiki-pg
  instances: 1
  imageName: "ghcr.io/cloudnative-pg/postgresql:18.3"
  storage:
    size: 5Gi
    storageClass: ""
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  # Observability: PodMonitor for Prometheus Operator scraping
  monitoring:
    enabled: true
    podMonitorLabels:
      release: prometheus  # Match Prometheus Operator selector
  backup:
    enabled: false
    destinationPath: ""
    endpointURL: ""
    retentionPolicy: "7d"

# Valkey Configuration (Redis-compatible, Bitnami chart)
valkey:
  enabled: false
  fullnameOverride: nohiki-valkey
  architecture: standalone
  auth:
    enabled: false
  # Observability: Prometheus metrics exporter sidecar
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
  primary:
    persistence:
      size: 1Gi
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 200m

# Strimzi Kafka Operator
strimzi:
  enabled: false
  watchAnyNamespace: false
  watchNamespaces: []

# Strimzi Kafka Cluster (custom resource, deployed via templates)
kafkaCluster:
  enabled: false
  name: nohiki-kafka
  version: 4.3.0
  replicas: 1
  listeners:
    plain:
      port: 9092
  storage:
    type: persistent-claim
    size: 2Gi
    deleteClaim: true
  config:
    offsetsTopicReplicationFactor: 1
    transactionStateLogReplicationFactor: 1
    transactionStateLogMinIsr: 1
    defaultReplicationFactor: 1
    minInsyncReplicas: 1
    autoCreateTopicsEnable: true
    numPartitions: 3
  resources:
    requests:
      memory: 512Mi
      cpu: 200m
    limits:
      memory: 1Gi
      cpu: 500m

# RustFS (S3-compatible object storage, Apache-2.0 licensed MinIO replacement)
# Official Helm chart: https://github.com/rustfs/rustfs/tree/main/helm
# Mode: distributed (HA, 4 pods x 4 PVCs) for production; standalone for local.
rustfs:
  enabled: false
  fullnameOverride: nohiki-rustfs

  # Mode selection (distributed = HA production, standalone = local dev)
  # Production: distributed with 4 replicas (default)
  # Local: Override in values.local.yaml with mode.standalone.enabled: true
  mode:
    distributed:
      enabled: true
    standalone:
      enabled: false

  # Replica count (only applies to distributed mode)
  # 4 = default (4 pods x 4 PVCs each = 16 PVCs total)
  # 16 = alternative (16 pods x 1 PVC each)
  replicaCount: 4

  # Image configuration
  image:
    repository: rustfs/rustfs
    tag: 1.0.0-beta.8@sha256:fa19210ac4697c79d7ccca1ec9b0eb91aebacc6691991ffb14014bb3c67e6cc3
    pullPolicy: IfNotPresent

  bucketInit:
    image:
      repository: amazon/aws-cli
      tag: 2.35.21@sha256:238583846e731f31c9848dae26c5a560769ff35c4c5368a4cb6be5816683e485
      pullPolicy: IfNotPresent

  # Credentials - use existingSecret in production, inline for local dev
  secret:
    existingSecret: ""  # Set to secret name in production
    rustfs:
      access_key: ""
      secret_key: ""  # Override in values.local.yaml or use existingSecret

  # RustFS configuration
  config:
    rustfs:
      address: ":9000"
      console_address: ":9001"
      console_enable: "true"
      log_level: "info"
      obs_environment: "production"
      region: "local"  # RustFS region (arbitrary string, not AWS-specific)
      # Observability: Prometheus metrics endpoint
      prometheus_auth_type: "public"  # Expose /minio/v2/metrics/cluster without auth

  # Gateway API (preferred over deprecated Ingress)
  # Ingress nginx retiring March 2026: https://kubernetes.io/blog/2025/11/11/ingress-nginx-retirement/
  ingress:
    enabled: false  # Disable legacy Ingress
  gatewayApi:
    enabled: true
    gatewayClass: kgateway  # Using kgateway (25x less memory, 20x faster than nginx)
    hostname: ""  # Set per environment (e.g., s3.nohiki.com)
    existingGateway:
      name: nohiki-gateway  # Share gateway with other services
      namespace: ""  # Same namespace if empty

  # Storage configuration
  storageclass:
    name: ""  # Empty = use cluster default StorageClass
    dataStorageSize: 10Gi
    logStorageSize: 1Gi

  # Pod Disruption Budget (HA)
  pdb:
    create: true
    maxUnavailable: 1

  # Pod anti-affinity (spread across nodes for HA)
  affinity:
    podAntiAffinity:
      enabled: true
      topologyKey: "kubernetes.io/hostname"

  # Security context
  containerSecurityContext:
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL

  # Resources (production defaults)
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: 500m

  # Service configuration
  service:
    type: ClusterIP  # Use Gateway API for external access
    endpoint:
      port: 9000
    console:
      port: 9001

# Qdrant (vector database)
# Metrics: Qdrant exposes /metrics endpoint on HTTP port by default
qdrant:
  enabled: false
  fullnameOverride: nohiki-qdrant
  replicaCount: 1
  image:
    tag: v1.18.2@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c
  service:
    ports:
      - name: http
        port: 6333
        targetPort: 6333
        protocol: TCP
        checksEnabled: false
      - name: grpc
        port: 6334
        targetPort: 6334
        protocol: TCP
        checksEnabled: true
      - name: p2p
        port: 6335
        targetPort: 6335
        protocol: TCP
        checksEnabled: false
  persistence:
    size: 2Gi
  # Observability: ServiceMonitor for Prometheus Operator
  metrics:
    serviceMonitor:
      enabled: false
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

# Qdrant collection initialization (first-party image built from
# infra/shared/qdrant-init). Creates collections on Qdrant at deploy time
# according to the SemanticRepresentationManifest. Runs as a Helm
# post-install/post-upgrade hook at weight 0 (before skill-graph bootstrap
# at weight 2). Follows the same image override pattern as services: set
# registry/owner/repositoryName under qdrantInit.image to override globals.
qdrantInit:
  enabled: true
  image:
    name: qdrant-init

# Docling Serve (document conversion API)
docling-serve:
  enabled: false

# Gotenberg (PDF generation via HTML/Office documents)
gotenberg:
  enabled: false
  fullnameOverride: nohiki-gotenberg
  replicaCount: 1
  image:
    tag: "8@sha256:67097317623a503ba2a6a7e9ae8db6929a1f7e1bbd88077bacf2d325fbdab923"
  chromium:
    maxQueueSize: 30
    restartAfter: 0
  libreOffice:
    restartAfter: 10
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: 500m

