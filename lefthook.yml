# Nohiki Monorepo Git Hooks Configuration
# Docs: https://github.com/evilmartians/lefthook
#
# Pre-commit: Fast checks on staged files (~5-15s)
# Pre-push: Thorough checks before pushing (~3-7m)
#
# Hooks run on every commit and push. Bypass mechanisms are not honored.
# When a hook fails on a file unrelated to the current change, fix the
# unrelated issue as part of the same branch before merging.

min_version: 2.1.10

output:
  - meta
  - summary
  - success
  - failure
  - execution_info
  - skips

colors: true

# COMMIT MESSAGE VALIDATION
# Enforces conventional commit format (feat:, fix:, docs:, etc.)
commit-msg:
  commands:
    commitlint:
      run: scripts/dev/env-lock.sh shared node_modules -- pnpm exec commitlint --edit {1}
    internal-refs-msg:
      run: scripts/dev/env-lock.sh shared venv -- uv run --no-sync ci-checks internal-refs --message {1}
# PRE-COMMIT: Fast checks on staged files (~5-15s)
# All commands run in parallel, auto-fix where possible
pre-commit:
  parallel: true
  skip:
    - merge
    - rebase

  commands:
    # Python: lint and format the exact staged inventory in ARG_MAX-safe chunks.
    # Covers all repo Python (backend/, scripts/, tests/, benchmarks/, infra/).
    # The workspace pyproject.toml is the canonical ruff config; subdir
    # pyprojects extend it, so a single `uv run ruff` from repo root works.
    python-check-format:
      glob: "*.py"
      run: |
        set -euo pipefail
        paths=$(mktemp "${TMPDIR:-/tmp}/nohiki-python-staged.XXXXXX")
        cleanup() {
          rm -f -- "$paths"
        }
        trap cleanup EXIT
        trap 'exit 129' HUP
        trap 'exit 130' INT
        trap 'exit 143' TERM
        git diff --cached --name-only --diff-filter=ACMR -z -- \
          ':(glob)*.py' \
          ':(glob)**/*.py' > "$paths"
        xargs -0 -r scripts/dev/env-lock.sh shared venv -- uv run --no-sync ruff check --fix --force-exclude -- < "$paths"
        xargs -0 -r scripts/dev/env-lock.sh shared venv -- uv run --no-sync ruff format --force-exclude -- < "$paths"
      stage_fixed: true

    # Frontend: Biome lint/format with auto-fix
    frontend-lint:
      glob:
        - "*.{ts,tsx,js,jsx,mjs,css}"
        - "typescript/apps/frontend/e2e/*.json"
        - "typescript/apps/frontend/e2e/**/*.json"
      exclude:
        - "**/api/generated/**"
        - "**/node_modules/**"
      root: typescript/apps/frontend/
      run: |
        # The biome config `files.includes` is narrower than this glob (root-level configs
        # such as vitest.config.ts are out of scope), and biome exits non-zero when every
        # path handed to it is excluded. --no-errors-on-unmatched stops that failing commits.
        ../../../scripts/dev/env-lock.sh shared node_modules -- pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    # Proto: buf lint
    proto-lint:
      glob:
        - "proto/*.proto"
        - "proto/**/*.proto"
        - "proto/buf.yaml"
        - "proto/buf.lock"
      root: proto/
      run: just proto-lint

    # Markdown: markdownlint with auto-fix
    # Rules and ignores configured in .markdownlint-cli2.jsonc
    # IMPORTANT: .markdownlint-cli2.jsonc must NOT contain "globs" (see
    # comment in that file). File discovery is solely via {staged_files}.
    markdown-lint:
      glob:
        - "*.md"
        - ".markdownlint-cli2.jsonc"
        - ".markdownlintignore"
        - ".markdownlint.json"
      exclude:
        - "**/node_modules/**"
      run: |
        scripts/dev/env-lock.sh shared node_modules -- pnpm exec markdownlint-cli2 --fix {staged_files}
      stage_fixed: true

    # i18n: Validate translation keys (only on frontend src/locale changes)
    i18n-check:
      glob:
        - "typescript/apps/frontend/src/*.{ts,tsx}"
        - "typescript/apps/frontend/src/**/*.{ts,tsx}"
        - "typescript/apps/frontend/public/locales/**"
        - "typescript/apps/frontend/scripts/i18n-check.mjs"
        - "typescript/apps/frontend/scripts/i18n/*"
        - "typescript/apps/frontend/scripts/i18n/**/*"
      root: typescript/apps/frontend/
      run: just fe-i18n

    # Secrets: gitleaks - detect secrets in staged files
    # https://github.com/gitleaks/gitleaks
    # Config in .gitleaks.toml
    secrets-check:
      run: just secrets-scan staged

    # Workflows: actionlint plus the pinned SchemaStore workflow schema.
    actions-lint:
      glob:
        - ".github/workflows/*.{yml,yaml}"
        - ".github/actions/**"
      run: just workflow-lint

    # Dockerfiles: hadolint (rules in .hadolint.yaml)
    docker-lint:
      glob:
        - "**/Dockerfile{,.*}"
        - "Dockerfile"
        - ".hadolint.yaml"
      exclude:
        - "**/*.dockerignore"
        - "**/*.j2"
      run: just docker-lint

# PRE-PUSH: Thorough checks before pushing (~3-7m)
# Phased execution: typecheck -> tests -> hygiene
pre-push:
  jobs:
    # First serial job: scan every pushed commit message and patch.
    # Lefthook normally forwards pre-push's ref lines on stdin. Empty stdin
    # falls back to the local push ref, then origin/main when no push ref exists.
    - name: internal-refs-range
      run: |
        set -eu
        refs=$(cat)
        if [ -n "$refs" ]; then
          printf '%s\n' "$refs" | while IFS=' ' read -r local_ref local_sha remote_ref remote_sha; do
            if [ -z "$local_ref" ] || [ -z "$local_sha" ] || [ -z "$remote_ref" ] || [ -z "$remote_sha" ]; then
              echo "ERROR: malformed pre-push ref input" >&2
              exit 1
            fi
            scripts/dev/env-lock.sh shared venv -- uv run --no-sync ci-checks internal-refs --range "$remote_sha..$local_sha"
          done
        else
          range='@{push}..HEAD'
          if ! git rev-parse --verify '@{push}' >/dev/null 2>&1; then
            range='origin/main..HEAD'
          fi
          scripts/dev/env-lock.sh shared venv -- uv run --no-sync ci-checks internal-refs --range "$range"
        fi

    # Scan only the commits being pushed. Whole-history scans include unrelated worktree branches.
    # No glob: secrets can appear in any file type, so path filtering would create blind spots.
    - name: secrets-scan
      run: |
        set -eu
        refs=$(cat)
        if [ -n "$refs" ]; then
          printf '%s\n' "$refs" | while IFS=' ' read -r local_ref local_sha remote_ref remote_sha; do
            if [ -z "$local_ref" ] || [ -z "$local_sha" ] || [ -z "$remote_ref" ] || [ -z "$remote_sha" ]; then
              echo "ERROR: malformed pre-push ref input" >&2
              exit 1
            fi
            just secrets-scan-range "$remote_sha..$local_sha"
          done
        else
          range='@{push}..HEAD'
          if ! git rev-parse --verify '@{push}' >/dev/null 2>&1; then
            range='origin/main..HEAD'
          fi
          just secrets-scan-range "$range"
        fi

    # Phase 1: Static checks (parallel)
    - group:
        parallel: true
        jobs:
          - name: python-lint
            run: just lint

          - name: python-format
            run: just format-check

          - name: python-typecheck
            glob: &python_workspace_surface
              - "backend/*.py"
              - "backend/**/*.py"
              - "backend/pyproject.toml"
              - "backend/**/pyproject.toml"
              - "scripts/*.py"
              - "scripts/**/*.py"
              - "scripts/pyproject.toml"
              - "scripts/**/pyproject.toml"
              - "infra/*.py"
              - "infra/**/*.py"
              - "infra/pyproject.toml"
              - "infra/**/pyproject.toml"
              - "tests/*.py"
              - "tests/**/*.py"
              - "tests/pyproject.toml"
              - "tests/**/pyproject.toml"
              - "pyproject.toml"
              - "uv.lock"
              - ".python-version"
            run: just typecheck-all

          - name: frontend-typecheck
            glob:
              - "typescript/apps/frontend/**/*.{ts,tsx}"
              - "typescript/apps/frontend/public/*"
              - "typescript/apps/frontend/public/**/*"
              - "typescript/apps/frontend/package.json"
              - "typescript/apps/frontend/tsconfig*.json"
              - "typescript/apps/frontend/vite.config.*"
              - "typescript/apps/frontend/vitest.config.*"
              - "typescript/libs/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - ".npmrc"
            run: just fe-typecheck

          - name: edge-typecheck
            glob:
              - "typescript/edge/auth-listings-worker/src/*.ts"
              - "typescript/edge/auth-listings-worker/src/**/*.ts"
              - "typescript/edge/auth-listings-worker/package.json"
              - "typescript/edge/auth-listings-worker/tsconfig.json"
              - "typescript/libs/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - ".npmrc"
            run: just edge-typecheck

          - name: nix-check
            glob:
              - "flake.nix"
              - "flake.lock"
            run: just nix-check

    # Phase 2: Unit Tests (parallel, runs after typecheck)
    # Uses package-aware runner to avoid pytest plugin collisions
    # Skips: integration, e2e, requires_docker markers
    - group:
        parallel: true
        jobs:
          # No glob: `ci-checks tests affected` is the single authority on which packages a
          # push selects, and it reads the push range itself. A glob would be a second copy
          # of that policy, and the copy is what drifts.
          - name: python-tests
            run: scripts/dev/env-lock.sh shared venv -- uv run --no-sync ci-checks tests affected --mode push --ci --workers 2
            env:
              OTEL_SDK_DISABLED: "true"
              UV_NO_SYNC: "1"

          # The unit runner deselects `requires_skylos` so the hosted units that carry no private
          # analyzer can still collect the module. The developer shell always installs it, so the
          # marked tests run here instead of being suppressed on every lane.
          - name: skylos-cache-tests
            glob:
              - "scripts/ci/src/ci_checks/checks/skylos_cache.py"
              - "scripts/ci/tests/test_skylos_cache.py"
            run: just test-skylos-cache

          - name: node-workspace-contract-tests
            run: just test-node-contracts

          - name: frontend-tests
            glob:
              - "typescript/apps/frontend/src/**/*.{ts,tsx}"
              - "typescript/apps/frontend/__mocks__/*"
              - "typescript/apps/frontend/__mocks__/**/*"
              - "typescript/apps/frontend/scripts/*"
              - "typescript/apps/frontend/scripts/**/*"
              - "typescript/apps/frontend/public/locales/*"
              - "typescript/apps/frontend/public/locales/**/*"
              - "typescript/apps/frontend/package.json"
              - "typescript/apps/frontend/tsconfig*.json"
              - "typescript/apps/frontend/vitest.config.*"
              - "typescript/apps/frontend/vite.config.*"
              - "typescript/libs/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - ".npmrc"
            run: just fe-test

          - name: edge-tests
            glob:
              - "typescript/edge/auth-listings-worker/src/*.ts"
              - "typescript/edge/auth-listings-worker/src/**/*.ts"
              - "typescript/edge/auth-listings-worker/package.json"
              - "typescript/edge/auth-listings-worker/tsconfig.json"
              - "typescript/edge/auth-listings-worker/vitest.config.*"
              - "typescript/libs/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - ".npmrc"
            run: just edge-test

    # Phase 3: Code Hygiene (parallel, runs after tests)
    - group:
        parallel: true
        jobs:
          - name: deadcode
            glob: *python_workspace_surface
            run: just hygiene-deadcode-strict

          - name: deptry
            glob: *python_workspace_surface
            run: just hygiene-deps

          - name: semgrep
            glob:
              - "backend/**/*.py"
              - "semgrep.yml"
              - "semgrep-overrides.txt"
            run: just hygiene-arch

          - name: build-backend
            glob: *python_workspace_surface
            run: just hygiene-build-backend-strict

          - name: frontend-lint-all
            # why: CI lints the whole project; staged-file pre-commit cannot see violations in untouched files.
            glob:
              - "typescript/apps/frontend/src/*"
              - "typescript/apps/frontend/src/**/*"
              - "typescript/apps/frontend/scripts/*"
              - "typescript/apps/frontend/scripts/**/*"
              - "typescript/apps/frontend/e2e/*"
              - "typescript/apps/frontend/e2e/**/*"
              - "typescript/apps/frontend/public/theme-init.js"
              - "typescript/apps/frontend/package.json"
              - "typescript/apps/frontend/biome.jsonc"
              - "typescript/apps/frontend/tsconfig*.json"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - ".npmrc"
              - "typescript/libs/**"
              - "typescript/libs/biome-config/biome.json"
            run: just fe-lint

          - name: edge-lint
            # why: hosted lints the worker's whole src tree; fe-lint never reads this package.
            glob:
              - "typescript/edge/auth-listings-worker/src/*"
              - "typescript/edge/auth-listings-worker/src/**/*"
              - "typescript/edge/auth-listings-worker/package.json"
              - "typescript/edge/auth-listings-worker/biome.jsonc"
              - "typescript/libs/**"
              - "typescript/libs/biome-config/biome.json"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - ".npmrc"
            run: just edge-lint

          - name: frontend-fsd
            glob:
              - "typescript/apps/frontend/src/*"
              - "typescript/apps/frontend/src/**/*"
              - "typescript/apps/frontend/package.json"
              - "typescript/apps/frontend/steiger.config.ts"
              - "typescript/apps/frontend/tsconfig*.json"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - ".npmrc"
              - "typescript/libs/**"
            run: just fe-fsd

    # Phase 4: Generated API artifacts
    - name: api-schema-freshness
      # Library entries are the transitive dependency closure of the two exporter
      # services, mirroring the hosted reverse-dependency selection.
      glob:
        - "backend/services/bff-service/**/*.py"
        - "backend/services/user-auth-service/**/*.py"
        - "backend/libs/nohiki-common-exceptions/**/*.py"
        - "backend/libs/nohiki-core-settings/**/*.py"
        - "backend/libs/nohiki-db-utils/**/*.py"
        - "backend/libs/nohiki-domain-models/**/*.py"
        - "backend/libs/nohiki-fastapi-utils/**/*.py"
        - "backend/libs/nohiki-kafka-client/**/*.py"
        - "backend/libs/nohiki-observability/**/*.py"
        - "backend/libs/nohiki-redis-utils/**/*.py"
        - "backend/libs/nohiki-s3-client/**/*.py"
        - "backend/libs/nohiki-test-utils/**/*.py"
        - "scripts/util/export-openapi.py"
        - "docs/api/nohiki.openapi.json"
        - "typescript/apps/frontend/src/api/schema.d.ts"
        - "uv.lock"
        - "package.json"
        - "pnpm-lock.yaml"
        - "pnpm-workspace.yaml"
        - "Justfile"
        - "pyproject.toml"
        - ".npmrc"
      run: just api-schema-check

    - name: image-matrix-parity
      glob:
        - "Justfile"
        - ".github/workflows/build-push.yml"
        - "infra/k8s/local/images.json"
        - "scripts/ci/image_inventory.json"
        - "scripts/ci/image_matrix.py"
      run: just image-matrix-check

    # Phase 5: Proto Breaking Changes
    - name: proto-breaking
      glob:
        - "proto/*.proto"
        - "proto/**/*.proto"
        - "proto/buf.yaml"
        - "proto/buf.lock"
        - "scripts/proto_gen/*.py"
        - "scripts/proto_gen/**/*.py"
        - "scripts/proto_gen/pyproject.toml"
      run: just proto-breaking
