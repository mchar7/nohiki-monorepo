syntax = "proto3";

package nohiki.common.v1;

import "buf/validate/validate.proto";

// ════════════════════════════════════════════════════════════════════
// COMMAND HEADER: Common fields for async command messages
//
// Used by any service that publishes a command and expects an async
// callback via the request/callback pattern.
//
// Consumers (responders) MUST echo operation_id, caller_context,
// and attributes unchanged into CallbackHeader on responses.
// ════════════════════════════════════════════════════════════════════
message CommandHeader {
  // Unique ID correlating this command with its callback(s).
  // Generated by the requester BEFORE publishing. Used for saga state
  // lookup and deduplication on the response path.
  string operation_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  // Topic where the responder publishes success/failure callbacks.
  string callback_topic = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 5, max_len: 128}
  ];

  // Opaque domain state echoed unchanged in callbacks.
  // Serialized via CallbackStateMixin.to_bytes() - the responder
  // MUST NOT interpret or modify this field.
  bytes caller_context = 3 [(buf.validate.field).bytes.max_len = 65536];

  // Key-value operational metadata echoed unchanged in callbacks.
  // Used for routing hints, observability labels, pipeline metadata.
  map<string, string> attributes = 4 [
    (buf.validate.field).map.max_pairs = 20,
    (buf.validate.field).map.keys.string = {min_len: 1, max_len: 64},
    (buf.validate.field).map.values.string.max_len = 256
  ];
}

// ════════════════════════════════════════════════════════════════════
// CALLBACK HEADER: Common fields for async callback messages
//
// Used by responders publishing success or failure callbacks.
// All fields are echoed unchanged from the originating CommandHeader.
// ════════════════════════════════════════════════════════════════════
message CallbackHeader {
  // Echoed from CommandHeader.operation_id.
  string operation_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  // Echoed from CommandHeader.caller_context.
  bytes caller_context = 2 [(buf.validate.field).bytes.max_len = 65536];

  // Echoed from CommandHeader.attributes.
  map<string, string> attributes = 3 [
    (buf.validate.field).map.max_pairs = 20
  ];
}

// ════════════════════════════════════════════════════════════════════
// ERROR INFO: Structured error details for failure callbacks
// ════════════════════════════════════════════════════════════════════
message ErrorInfo {
  string error_code = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 64}
  ];
  string error_message = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 1000}
  ];
  bool retryable = 3;
}
