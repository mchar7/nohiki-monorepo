syntax = "proto3";

package nohiki.common.v1;

import "buf/validate/validate.proto";

// ════════════════════════════════════════════════════════════════════
// PAGINATION REQUEST: Pagination parameters for list requests
// ════════════════════════════════════════════════════════════════════
message PaginationRequest {
  int32 page_size = 1 [
    (buf.validate.field).int32 = {gte: 1, lte: 100}
  ];
  int32 page_number = 2 [
    (buf.validate.field).int32.gte = 1
  ];
  optional string cursor = 3 [
    (buf.validate.field).string.max_len = 500
  ];
}

// ════════════════════════════════════════════════════════════════════
// PAGINATION RESPONSE: Pagination metadata for list responses
// ════════════════════════════════════════════════════════════════════
message PaginationResponse {
  int32 page_size = 1;
  int32 page_number = 2;
  int32 total_items = 3;
  int32 total_pages = 4;
  bool has_next_page = 5;
  bool has_prev_page = 6;
  optional string next_cursor = 7;
  optional string prev_cursor = 8;
}
