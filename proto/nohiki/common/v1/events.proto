syntax = "proto3";

package nohiki.common.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "nohiki/common/v1/enums.proto";
import "nohiki/common/v1/operations.proto";

// ════════════════════════════════════════════════════════════════════
// EVENT METADATA: Base metadata for ALL events
// ════════════════════════════════════════════════════════════════════
message EventMetadata {
  string event_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  google.protobuf.Timestamp timestamp = 2 [(buf.validate.field).required = true];
  string source_service = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 3, max_len: 64, pattern: "^[a-z][a-z0-9-]*[a-z0-9]$"}
  ];
  optional string correlation_id = 4 [(buf.validate.field).string.uuid = true];
  optional string causation_id = 5 [(buf.validate.field).string.uuid = true];
  string version = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 2, max_len: 10, pattern: "^v[0-9]+$"}
  ];
  optional string trace_id = 7 [(buf.validate.field).string.min_len = 1];
}

// ════════════════════════════════════════════════════════════════════
// LISTING REFERENCE: Common job reference used across events
// ════════════════════════════════════════════════════════════════════
message ListingReference {
  string listing_url = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 10, max_len: 2048, pattern: "^https?://.*"}
  ];
  optional string listing_id = 2 [(buf.validate.field).string.uuid = true];
  optional string external_listing_id = 3 [(buf.validate.field).string.max_len = 255];
  JobBoardSource source = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {defined_only: true, not_in: [0]}
  ];
}

// ════════════════════════════════════════════════════════════════════
// PREF REFERENCE: User search preference reference
// ════════════════════════════════════════════════════════════════════
message PrefReference {
  string pref_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  string user_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

// ════════════════════════════════════════════════════════════════════
// OPERATION OUTCOME: Common operation result with structured error handling
// ════════════════════════════════════════════════════════════════════
message OperationOutcome {
  option (buf.validate.message).cel = {
    id: "operation_outcome.error_matches_status",
    message: "failed outcomes require error and non-failed outcomes forbid error",
    expression: "this.status == 4 ? has(this.error) : !has(this.error)"
  };
  ProcessingStatus status = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {defined_only: true, not_in: [0]}
  ];
  optional ErrorInfo error = 2;
  map<string, string> metadata = 3 [
    (buf.validate.field).map.max_pairs = 50,
    (buf.validate.field).map.keys.string = {min_len: 1, max_len: 64},
    (buf.validate.field).map.values.string.max_len = 1000
  ];
}
