syntax = "proto3";

package nohiki.common.v1;

import "buf/validate/validate.proto";
import "nohiki/common/v1/enums.proto";

// ════════════════════════════════════════════════════════════════════
// UPLOAD REFERENCE: Upload metadata with S3 storage reference
// Never embeds actual content - consumers fetch from S3 using storage_key
// ════════════════════════════════════════════════════════════════════
message UploadReference {
  // REQUIRED - Core identification
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  string user_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  // REQUIRED - Metadata
  string name = 10 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 255}
  ];
  string content_type = 11 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 100}
  ];
  int64 file_size = 12 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64 = {gt: 0, lte: 10485760}
  ];
  string content_hash = 13 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[0-9a-f]{64}$"
  ];

  // REQUIRED - Storage reference (S3 key)
  string storage_key = 20 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 1024}
  ];

  // OPTIONAL - Classification
  optional DocumentCategory document_category = 30 [
    (buf.validate.field).enum.defined_only = true
  ];
}

// ════════════════════════════════════════════════════════════════════
// SCHEMA SNAPSHOT: Schema definition for tailoring output
// ════════════════════════════════════════════════════════════════════
message SchemaSnapshot {
  // REQUIRED - Core identification
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  string family_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  string name = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 255}
  ];
  string version = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 50}
  ];

  // REQUIRED - Schema content
  string json_schema = 10 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 2
  ];
}

// ════════════════════════════════════════════════════════════════════
// ENTITLEMENT SNAPSHOT: User entitlements for event context
// ════════════════════════════════════════════════════════════════════
message EntitlementSnapshot {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];

  // Tier and subscription
  SubscriptionTier tier = 10 [
    (buf.validate.field).enum = {defined_only: true, not_in: [0]}
  ];
  SubscriptionStatus subscription_status = 11 [
    (buf.validate.field).enum = {defined_only: true, not_in: [0]}
  ];

  // Billing
  BillingProvider billing_provider = 12 [(buf.validate.field).enum.defined_only = true];

  // Computed limits (derived from tier)
  DiscoveryFrequency discovery_frequency_limit = 20 [(buf.validate.field).enum.defined_only = true];
  int32 max_prefs = 21 [(buf.validate.field).int32.gte = 0];
  int32 max_uploads_per_pref = 22 [(buf.validate.field).int32.gte = 0];

  // Source access
  repeated JobBoardSource allowed_sources = 30 [
    (buf.validate.field).repeated.items.enum.defined_only = true
  ];

  // Feature flags
  map<string, bool> features_enabled = 40;
}
