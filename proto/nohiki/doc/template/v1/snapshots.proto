syntax = "proto3";

package nohiki.doc.template.v1;

import "buf/validate/validate.proto";
import "nohiki/common/v1/enums.proto";

// Whether a template is intended for document selection or internal service use.
enum TemplateAudience {
  TEMPLATE_AUDIENCE_UNSPECIFIED = 0;
  TEMPLATE_AUDIENCE_DOCUMENT = 1;
  TEMPLATE_AUDIENCE_INTERNAL = 2;
}

// ════════════════════════════════════════════════════════════════════
// DOCUMENT TEMPLATE VERSION SNAPSHOT: Full state of a template version for ECST
// Used in events to provide consumers with complete template data
// Consumers: bff-service (projections), doc-content-service
// ════════════════════════════════════════════════════════════════════
message DocumentTemplateVersionSnapshot {
  string version_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  string version = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  ];
  string template_content = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 10, max_bytes: 102400}
  ];
  optional string description = 4 [(buf.validate.field).string.max_len = 1000];

  // JSON Schema for LLM output structure - embedded directly in template version
  optional string content_schema_json = 5 [
    (buf.validate.field).string.max_len = 1048576
  ];
}

// ════════════════════════════════════════════════════════════════════
// DOCUMENT TEMPLATE SNAPSHOT: Full state of a template family for ECST pattern
// Used in events to provide consumers with complete template data
// Consumers: bff-service (projections), doc-content-service
// ════════════════════════════════════════════════════════════════════
message DocumentTemplateSnapshot {
  // Core identification
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  string namespace = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 100
  ];
  string name = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 255
  ];

  // Access control
  nohiki.common.v1.AccessScope access_scope = 4 [
    (buf.validate.field).enum.defined_only = true
  ];
  optional string owner_id = 5 [(buf.validate.field).string.uuid = true];

  // Current version info
  string latest_version = 6 [(buf.validate.field).string.max_len = 50];
  optional string description = 7;
  string display_name = 8 [(buf.validate.field).string.max_len = 255];
  TemplateAudience audience = 9 [(buf.validate.field).enum.defined_only = true];

  // ECST: Include full version snapshot for consumers
  DocumentTemplateVersionSnapshot version_snapshot = 10 [(buf.validate.field).required = true];
}
