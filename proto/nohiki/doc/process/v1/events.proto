syntax = "proto3";

package nohiki.doc.process.v1;

import "buf/validate/validate.proto";
import "nohiki/common/v1/events.proto";
import "nohiki/common/v1/operations.proto";
import "nohiki/doc/process/v1/enums.proto";
import "nohiki/doc/process/v1/snapshots.proto";

// ════════════════════════════════════════════════════════════════════
// PROCESSING REQUESTED: Command to process a document
// Topic: doc-process.cmd.processing-requested.v1
// Publisher: user-upload-service
// Consumer: doc-process-service
// ════════════════════════════════════════════════════════════════════
message ProcessingRequested {
  nohiki.common.v1.EventMetadata metadata = 1 [(buf.validate.field).required = true];
  nohiki.common.v1.CommandHeader command = 2 [(buf.validate.field).required = true];

  string storage_key = 10 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 500}
  ];

  string content_id = 11 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  string user_id = 13 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  ProcessingLevel processing_level = 12 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {defined_only: true, not_in: [0]}
  ];
}

// ════════════════════════════════════════════════════════════════════
// PROCESSING RESULT: Success payload for processing callbacks
// ════════════════════════════════════════════════════════════════════
message ProcessingResult {
  ProcessedDocumentSnapshot snapshot = 1 [(buf.validate.field).required = true];
}

// ════════════════════════════════════════════════════════════════════
// PROCESSING CALLBACK: Async callback for document processing requests
// Topic: Dynamic (callback_topic from CommandHeader)
// Publisher: doc-process-service
// Consumer: Original requester
//
// Bug fix: Previously, failures were published to a fixed fact topic
// instead of the callback_topic. Now both success and failure are
// published to the requester's callback_topic via oneof.
// ════════════════════════════════════════════════════════════════════
message ProcessingCallback {
  nohiki.common.v1.EventMetadata metadata = 1 [(buf.validate.field).required = true];
  nohiki.common.v1.CallbackHeader callback = 2 [(buf.validate.field).required = true];

  string content_id = 10 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  oneof result {
    option (buf.validate.oneof).required = true;
    ProcessingResult success = 20;
    nohiki.common.v1.ErrorInfo error = 30;
  }
}
