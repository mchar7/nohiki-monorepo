    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

// ════════════════════════════════════════════════════════════════════
// USER PREF SETTINGS UPDATE REQUESTED: Command to update user-level settings
// Topic: user-pref.cmd.settings-update-requested.v1
// Publisher: bff-service
// Consumer: user-pref-service
//
// Used to set user-level default feature importance preferences.
// These defaults apply to all search preferences unless overridden.
// ════════════════════════════════════════════════════════════════════
message UserPrefSettingsUpdateRequested {
  nohiki.common.v1.EventMetadata metadata = 1 [(buf.validate.field).required = true];

  string request_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  string user_id = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  optional nohiki.common.v1.FeatureImportancePrefs default_feature_importance = 10;

  optional string preferred_timezone = 20 [(buf.validate.field).string.max_len = 50];
  optional string preferred_locale = 21 [(buf.validate.field).string.max_len = 10];

  repeated string updated_fields = 30 [(buf.validate.field).repeated.max_items = 10];
}

// ════════════════════════════════════════════════════════════════════
// PREF FEATURE IMPORTANCE UPDATE REQUESTED: Command to update per-pref importance
// Topic: user-pref.cmd.pref-importance-update-requested.v1
// Publisher: bff-service
// Consumer: user-pref-service
//
// Used to set per-search-preference feature importance overrides.
// These override the user-level defaults for this specific search preference.
// ════════════════════════════════════════════════════════════════════
message PrefFeatureImportanceUpdateRequested {
  nohiki.common.v1.EventMetadata metadata = 1 [(buf.validate.field).required = true];

  string request_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  string user_id = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  string pref_id = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  nohiki.common.v1.FeatureImportancePrefs feature_importance = 10 [(buf.validate.field).required = true];
}
