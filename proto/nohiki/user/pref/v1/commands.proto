    (buf.validate.field).string.uuid = true
  ];

  string pref_id = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

// ════════════════════════════════════════════════════════════════════
// PREF ATTACH UPLOAD REQUESTED: Command to attach an upload to a preference
// Topic: user-pref.cmd.attach-upload.v1
// Publisher: bff-service
// Consumer: user-pref-service
// ════════════════════════════════════════════════════════════════════
message PrefAttachUploadRequested {
  nohiki.common.v1.EventMetadata metadata = 1 [(buf.validate.field).required = true];

  string request_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  string user_id = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  string pref_id = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  string upload_id = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
