syntax = "proto3";

package nohiki.user.upload.v1;

import "buf/validate/validate.proto";
import "nohiki/common/v1/events.proto";
import "nohiki/user/upload/v1/snapshots.proto";

// ════════════════════════════════════════════════════════════════════
// UPLOAD CREATED: Published when an upload is created
// Topic: userdocs.fct.upload-created.v1
// Consumers: pref-service (cache upload metadata for ECST)
// ════════════════════════════════════════════════════════════════════
message UploadCreated {
  nohiki.common.v1.EventMetadata metadata = 1 [(buf.validate.field).required = true];
  string upload_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  string user_id = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  UploadSnapshot upload_snapshot = 10 [(buf.validate.field).required = true];
}

// ════════════════════════════════════════════════════════════════════
// UPLOAD UPDATED: Published when an upload is updated
// Topic: userdocs.fct.upload-updated.v1
// ════════════════════════════════════════════════════════════════════
message UploadUpdated {
  nohiki.common.v1.EventMetadata metadata = 1 [(buf.validate.field).required = true];
  string upload_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  string user_id = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  string name = 4 [(buf.validate.field).string.max_len = 255];
}

// ════════════════════════════════════════════════════════════════════
// UPLOAD DELETED: Published when an upload is deleted
// Topic: userdocs.fct.upload-deleted.v1
// Consumers: pref-service (remove from pref_uploads)
// ════════════════════════════════════════════════════════════════════
message UploadDeleted {
  nohiki.common.v1.EventMetadata metadata = 1 [(buf.validate.field).required = true];
  string upload_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  string user_id = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}
