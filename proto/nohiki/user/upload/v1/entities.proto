syntax = "proto3";

package nohiki.user.upload.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "nohiki/common/v1/enums.proto";

// ════════════════════════════════════════════════════════════════════
// UPLOAD: User-uploaded document entity
// ════════════════════════════════════════════════════════════════════
message Upload {
  // === IDENTIFICATION ===
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  string user_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  // === METADATA ===
  string name = 10 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 255}
  ];

  string content_type = 11 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 100}
  ];

  int64 file_size = 12 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64 = {gt: 0, lte: 10485760}
  ];

  string content_hash = 13 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[0-9a-f]{64}$"
  ];

  // === STORAGE ===
  string storage_key = 20 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 1024}
  ];

  // === CLASSIFICATION ===
  nohiki.common.v1.DocumentCategory document_category = 30 [
    (buf.validate.field).enum.defined_only = true
  ];

  // === TIMESTAMPS ===
  google.protobuf.Timestamp created_at = 40 [(buf.validate.field).required = true];
  google.protobuf.Timestamp updated_at = 41 [(buf.validate.field).required = true];
}
