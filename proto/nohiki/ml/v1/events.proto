syntax = "proto3";

package nohiki.ml.v1;

import "buf/validate/validate.proto";
import "nohiki/common/v1/events.proto";
import "nohiki/common/v1/operations.proto";
import "nohiki/ml/v1/types.proto";

// ════════════════════════════════════════════════════════════════════
// EMBEDDING RESULT: Success payload for embedding callbacks and fact events
//
// Contains all computed embeddings plus metadata. Used as the success
// branch of EmbeddingCallback's oneof and as the payload of
// EmbeddingCompleted (Qdrant sink fact event).
// ════════════════════════════════════════════════════════════════════
message EmbeddingResult {
  string collection_version = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 2, max_len: 20}
  ];
  string content_hash = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 128}
  ];
  repeated EmbeddingType requested_types = 3 [
    (buf.validate.field).repeated = {min_items: 1, max_items: 5}
  ];
  EncodingMode encoding_mode = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {defined_only: true, not_in: [0]}
  ];
  repeated EmbeddingVector embeddings = 10;
  map<string, string> payload_metadata = 11 [
    (buf.validate.field).map.max_pairs = 30,
    (buf.validate.field).map.keys.string.max_len = 64,
    (buf.validate.field).map.values.string.max_len = 500
  ];
}

// ════════════════════════════════════════════════════════════════════
// EMBEDDING CALLBACK: Async callback for embedding requests
// Topic: Dynamic (callback_topic from CommandHeader)
// Publisher: ml-compute-service
// Consumer: Original requester (user-pref, enrichment, etc.)
//
// Single message type per callback topic; oneof distinguishes success from failure.
// ════════════════════════════════════════════════════════════════════
message EmbeddingCallback {
  nohiki.common.v1.EventMetadata metadata = 1 [(buf.validate.field).required = true];
  nohiki.common.v1.CallbackHeader callback = 2 [(buf.validate.field).required = true];

  string entity_id = 10 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  EntityType entity_type = 11 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {defined_only: true, not_in: [0]}
  ];

  oneof result {
    EmbeddingResult success = 20;
    nohiki.common.v1.ErrorInfo error = 30;
  }
}

// ════════════════════════════════════════════════════════════════════
// EMBEDDING COMPLETED: Fact event for Qdrant sink connector
// Topic: ml.fct.embedding-completed.v1
// Publisher: ml-compute-service
// Consumer: Qdrant Kafka Sink Connector
//
// Separate from EmbeddingCallback - this is a broadcast fact event
// for indexing, not a point-to-point callback to the requester.
// ════════════════════════════════════════════════════════════════════
message EmbeddingCompleted {
  nohiki.common.v1.EventMetadata metadata = 1 [(buf.validate.field).required = true];

  string entity_id = 10 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  EntityType entity_type = 11 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {defined_only: true, not_in: [0]}
  ];

  EmbeddingResult payload = 20 [(buf.validate.field).required = true];
}

// ════════════════════════════════════════════════════════════════════
// BATCH EMBEDDING RESULT: Success payload for batch embedding callbacks
// ════════════════════════════════════════════════════════════════════
message BatchEmbeddingResult {
  repeated BatchEmbeddingResultItem results = 1 [
    (buf.validate.field).repeated = {min_items: 1, max_items: 768}
  ];
}

// ════════════════════════════════════════════════════════════════════
// BATCH EMBEDDING CALLBACK: Async callback for batch embedding requests
// Topic: Dynamic (callback_topic from CommandHeader)
// Publisher: ml-compute-service
// Consumer: skill-graph-service
// ════════════════════════════════════════════════════════════════════
message BatchEmbeddingCallback {
  nohiki.common.v1.EventMetadata metadata = 1 [(buf.validate.field).required = true];
  nohiki.common.v1.CallbackHeader callback = 2 [(buf.validate.field).required = true];

  EntityType entity_type = 10 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {defined_only: true, not_in: [0]}
  ];
  string collection_version = 11 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 2, max_len: 20}
  ];
  EncodingMode encoding_mode = 12 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {defined_only: true, not_in: [0]}
  ];

  oneof result {
    option (buf.validate.oneof).required = true;
    BatchEmbeddingResult success = 20;
    nohiki.common.v1.ErrorInfo error = 30;
  }
}

// ════════════════════════════════════════════════════════════════════
// RERANK RESULT: Success payload wrapping reranked items
// ════════════════════════════════════════════════════════════════════
message RerankResult {
  repeated RerankResultItem results = 1 [
    (buf.validate.field).repeated = {min_items: 1, max_items: 1000}
  ];
}

// ════════════════════════════════════════════════════════════════════
// RERANK CALLBACK: Async callback for rerank requests
// Topic: Dynamic (callback_topic from CommandHeader)
// Publisher: ml-compute-service
// Consumer: job-correlation-evaluation-service
// ════════════════════════════════════════════════════════════════════
message RerankCallback {
  nohiki.common.v1.EventMetadata metadata = 1 [(buf.validate.field).required = true];
  nohiki.common.v1.CallbackHeader callback = 2 [(buf.validate.field).required = true];

  oneof result {
    option (buf.validate.oneof).required = true;
    RerankResult success = 20;
    nohiki.common.v1.ErrorInfo error = 30;
  }
}
