syntax = "proto3";

package nohiki.job.correlation.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "nohiki/common/v1/enums.proto";

// ════════════════════════════════════════════════════════════════════
// CORRELATION: User-job match assessment (includes 0% matches)
// ════════════════════════════════════════════════════════════════════
message Correlation {
  // === IDENTIFICATION ===
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  string pref_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  string listing_id = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  string user_id = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  // === SCORING ===
  int32 fit_score = 10 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32 = {gte: 0, lte: 100}
  ];

  nohiki.common.v1.CorrelationStatus status = 11 [
    (buf.validate.field).enum.defined_only = true
  ];

  // === SCORING DETAILS ===
  map<string, int32> score_breakdown = 20 [
    (buf.validate.field).map.max_pairs = 20,
    (buf.validate.field).map.keys.string.max_len = 64,
    (buf.validate.field).map.values.int32 = {gte: -100, lte: 100}
  ];

  // === USER FEEDBACK ===
  optional int32 user_feedback = 30 [(buf.validate.field).int32 = {gte: -1, lte: 1}];
  optional string user_notes = 31 [(buf.validate.field).string.max_len = 1000];

  // === TIMESTAMPS ===
  google.protobuf.Timestamp evaluated_at = 40 [(buf.validate.field).required = true];
  google.protobuf.Timestamp created_at = 41 [(buf.validate.field).required = true];
  google.protobuf.Timestamp updated_at = 42 [(buf.validate.field).required = true];
}
