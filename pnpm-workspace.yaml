packages:
  - typescript/apps/*
  - typescript/libs/*
  - typescript/services/*
  - typescript/edge/*

overrides:
  "@opentelemetry/core": ">=2.8.0"
  brace-expansion: "5.0.9"
  fast-uri: "3.1.4"
  "js-yaml@>=4.0.0 <5.0.0": "4.3.1"
  postcss: "8.5.25"
  tar: "7.5.22"
  rollup: ">=4.59.0"

allowBuilds:
  esbuild: true
  lefthook: true
  msw: false
  protobufjs: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types'
  - markdownlint-cli2@0.23.2
